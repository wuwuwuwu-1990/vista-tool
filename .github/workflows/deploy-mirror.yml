name: Sync to Aliyun Mirror
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rsync to Aliyun server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 47.109.99.227 >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -az --delete --exclude='.git' --exclude='.github' -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" ./ root@47.109.99.227:/var/www/tools/
          echo "MIRROR_SYNC_DONE"
