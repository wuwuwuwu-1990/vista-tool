<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重庆楼盘优劣势速查表 v1.7</title>
<style>
  :root{
    --bg:linear-gradient(160deg,#0d1326 0%,#161f3d 50%,#0e1626 100%); --card:rgba(255,255,255,.09); --line:rgba(255,255,255,.16); --ink:#eef2fb; --sub:rgba(238,242,251,.6);
    --brand:#4f8ef7; --brand-weak:rgba(79,142,247,.18); --red:#f87171; --green:#34d399;
    --chip:rgba(255,255,255,.1); --chip-on:#4f8ef7;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{padding:20px 24px 14px;background:linear-gradient(120deg,#2f6df6,#5b8def);color:#fff}
  header h1{margin:0 0 4px;font-size:20px;font-weight:700}
  header .meta{font-size:12.5px;opacity:.92}
  .wrap{max-width:1560px;margin:0 auto;padding:0 16px 40px}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:120px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .stat b{font-size:22px;color:var(--brand);display:block;line-height:1.1}
  .stat span{font-size:12px;color:var(--sub)}
  .filters{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
           position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .frow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .fitem{display:flex;flex-direction:column;gap:4px}
  .fitem label{font-size:12px;color:var(--sub);font-weight:600}
  .fitem input,.fitem select{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;
       background:rgba(255,255,255,.12);color:var(--ink);font-size:13px;min-width:120px}
  .fitem input:focus,.fitem select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-weak)}
  .range{display:flex;align-items:center;gap:6px}
  .range input{width:84px;min-width:84px}
  .range span{color:var(--sub)}
  .btn{border:none;border-radius:9px;height:36px;padding:0 16px;font-size:13px;cursor:pointer;font-weight:600}
  .btn-reset{background:var(--chip);color:var(--ink)}
  .btn-reset:hover{background:rgba(255,255,255,.18)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{padding:5px 12px;border-radius:20px;background:var(--chip);color:var(--sub);font-size:12px;cursor:pointer;
        border:1px solid transparent;user-select:none}
  .chip.on{background:var(--chip-on);color:#fff}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px;flex-wrap:wrap;gap:8px}
  .toolbar .count{color:var(--sub);font-size:13px}
  .toolbar .count b{color:var(--ink)}
  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
        border-radius:12px;overflow:hidden}
  thead th{background:rgba(255,255,255,.08);color:var(--sub);font-size:12.5px;text-align:left;padding:11px 12px;font-weight:700;
           position:sticky;top:150px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
  tbody tr:hover{background:rgba(255,255,255,.07)}
  tbody tr:last-child td{border-bottom:none}
  .pname{font-weight:700;color:var(--ink)}
  .seq{color:var(--sub);font-variant-numeric:tabular-nums}
  .prods{font-size:12.5px;color:var(--ink)}
  .prods .pp{margin:2px 0;padding-left:10px;position:relative}
  .prods .pp:before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25)}
  .tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;margin:1px 3px 1px 0}
  .tag-qing{background:rgba(52,211,153,.14);color:#34d399}
  .tag-jing{background:rgba(248,113,113,.14);color:#f87171}
  .tag-hun{background:rgba(251,191,36,.14);color:#fbbf24}
  .tag-no{background:rgba(255,255,255,.08);color:rgba(238,242,251,.5)}
  .tag-myes{background:rgba(79,142,247,.15);color:#7cb3ff}
  .tag-mno{background:rgba(255,255,255,.08);color:#a78bfa}
  .tag-mun{background:rgba(255,255,255,.08);color:rgba(238,242,251,.5)}
  .tag-net{background:rgba(79,142,247,.15);color:#7cb3ff;font-weight:700}
  .tag-btype{background:rgba(79,142,247,.15);color:#93c5fd;font-weight:600}
  .markbox{display:flex;flex-wrap:wrap;gap:4px}
  .mbtn{border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--sub);border-radius:7px;
        padding:3px 7px;font-size:11.5px;cursor:pointer;user-select:none;font-weight:600;white-space:nowrap;line-height:1.3}
  .mbtn:hover{border-color:var(--brand)}
  .mbtn.m-yixiang.on{background:rgba(52,211,153,.14);color:#34d399;border-color:rgba(52,211,153,.45)}
  .mbtn.m-paiqi.on{background:rgba(251,191,36,.14);color:#fbbf24;border-color:rgba(251,191,36,.45)}
  .mbtn.m-paichu.on{background:rgba(248,113,113,.14);color:#f87171;border-color:rgba(248,113,113,.45)}
  .clabel{font-size:12px;color:var(--sub);font-weight:600;align-self:center}
  .pc{font-size:12px;color:var(--sub);max-height:96px;overflow:auto;white-space:pre-wrap;line-height:1.5}
  .pc .k{color:var(--green);font-weight:600}
  .pc .d{color:var(--red);font-weight:600}
  .pc-pros{font-size:12px;color:#34d399;max-height:150px;overflow:auto;white-space:pre-wrap;line-height:1.5}
  .pc-cons{font-size:12px;color:#f87171;max-height:150px;overflow:auto;white-space:pre-wrap;line-height:1.5}
  .num{font-variant-numeric:tabular-nums}
  .pages{display:flex;gap:6px;justify-content:center;margin-top:18px;flex-wrap:wrap;align-items:center}
  .pg{border:1px solid var(--line);background:rgba(255,255,255,.1);border-radius:8px;min-width:34px;height:34px;padding:0 10px;
      cursor:pointer;font-size:13px;color:var(--ink)}
  .pg.cur{background:var(--brand);color:#fff;border-color:var(--brand)}
  .pg:hover:not(.cur){background:#f0f3f8}
  .pg:disabled{opacity:.4;cursor:not-allowed}
  .empty{padding:40px;text-align:center;color:var(--sub)}
  @media(max-width:860px){
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tbody tr{border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:6px}
    tbody td{border:none;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:12px}
    tbody td:before{content:attr(data-l);color:var(--sub);font-weight:600;font-size:12px;white-space:nowrap}
    thead th{position:static}
    .filters{position:static}
  }
</style>
</head>
<body>
<header>
  <h1>重庆楼盘优劣势速查表</h1>
  <div class="meta">数据来源：重庆8000楼盘.xlsx（更新截止 2026.1.22）· 共 <span id="m-p"></span> 个楼盘 / <span id="m-pr"></span> 条在售产品 · 版本 1.7 · 离线单文件，可直接分享</div>
</header>
<div class="wrap">
  <div class="stats">
    <div class="stat"><b id="s-p">0</b><span>楼盘总数</span></div>
    <div class="stat"><b id="s-pr">0</b><span>在售产品</span></div>
    <div class="stat"><b id="s-show">0</b><span>当前筛选结果</span></div>
    <div class="stat"><b id="s-jing">0</b><span>含精装楼盘</span></div>
    <div class="stat"><b id="s-metro">0</b><span>近地铁楼盘</span></div>
  </div>

  <div class="filters">
    <div class="frow">
      <div class="fitem" style="flex:1;min-width:220px">
        <label>关键词搜索（楼盘名 / 优缺点 / 产品 / 学校）</label>
        <input id="f-kw" type="text" placeholder="如：八中、现房、低总价、江景…" style="width:100%">
      </div>
      <div class="fitem">
        <label>装修</label>
        <select id="f-finish">
          <option value="">全部</option>
          <option value="清水">清水</option>
          <option value="精装">精装</option>
          <option value="混合">清水+精装</option>
          <option value="其他">其他</option>
          <option value="未注明">未注明</option>
        </select>
      </div>
      <div class="fitem">
        <label>地铁</label>
        <select id="f-metro">
          <option value="">全部</option>
          <option value="有地铁">近地铁</option>
          <option value="无地铁">无地铁</option>
          <option value="未注明">未注明</option>
        </select>
      </div>
      <div class="fitem">
        <label>大区</label>
        <select id="f-region"><option value="">全部</option></select>
      </div>
      <div class="fitem">
        <label>板块</label>
        <select id="f-plate"><option value="">全部</option></select>
      </div>
      <div class="fitem">
        <label>户型</label>
        <select id="f-layout">
          <option value="">全部</option>
          <option value="两房">两房</option>
          <option value="三房">三房</option>
          <option value="四房">四房</option>
          <option value="五房">五房</option>
          <option value="其他">其他/未注明</option>
        </select>
      </div>
      <div class="fitem">
        <label>建面 (㎡)</label>
        <div class="range"><input id="f-amin" type="number" placeholder="最小"><span>~</span><input id="f-amax" type="number" placeholder="最大"></div>
      </div>
      <div class="fitem">
        <label>总价 (万)</label>
        <div class="range"><input id="f-pmin" type="number" placeholder="最小"><span>~</span><input id="f-pmax" type="number" placeholder="最大"></div>
      </div>
      <div class="fitem">
        <label>中小学含</label>
        <input id="f-school" type="text" placeholder="如：八中、人民小学">
      </div>
      <div class="fitem">
        <label>标记状态</label>
        <select id="f-mark">
          <option value="">全部</option>
          <option value="yixiang">仅意向</option>
          <option value="paiqi">仅商榷</option>
          <option value="paichu">仅排除</option>
          <option value="none">仅未标记</option>
        </select>
      </div>
      <div class="fitem">
        <label>排序</label>
        <select id="f-sort">
          <option value="id">默认（原表顺序）</option>
          <option value="name">楼盘名（拼音序）</option>
          <option value="areaAsc">建面 低→高</option>
          <option value="areaDesc">建面 高→低</option>
          <option value="priceAsc">总价 低→高</option>
          <option value="priceDesc">总价 高→低</option>
          <option value="mark">按意向&gt;商榷&gt;排除</option>
          <option value="region">按大区 / 板块</option>
        </select>
      </div>
      <div class="fitem">
        <label>&nbsp;</label>
        <button class="btn btn-reset" id="f-reset">重置筛选</button>
      </div>
    </div>
    <div class="frow" style="margin-top:12px">
      <div class="fitem" style="flex:1;min-width:260px">
        <label>建筑类型（可多选）</label>
        <div class="chips" id="btype-chips"></div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="count">筛选结果：<b id="r-count">0</b> 个楼盘 · 标记：意向 <b id="c-yixiang" style="color:#1f9d55">0</b> / 商榷 <b id="c-paiqi" style="color:#c4761a">0</b> / 排除 <b id="c-paichu" style="color:#e23b3b">0</b> <button class="btn btn-reset" id="m-clear" style="height:28px;padding:0 12px;font-size:12px;margin-left:6px">清除标记</button></div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:48px">#</th>
        <th style="width:140px">标记（意向/商榷/排除）</th>
        <th style="width:150px">楼盘名称</th>
        <th style="width:130px">大区 / 板块</th>
        <th>在售产品 / 建面 / 户型 / 交房</th>
        <th style="width:120px">总价区间</th>
        <th style="width:90px">装修</th>
        <th style="width:120px">中小学</th>
        <th style="width:120px">地铁</th>
        <th style="width:320px">主要优点</th>
        <th style="width:320px">主要缺点</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="pages" id="pages"></div>
</div>

const $ = id => document.getElementById(id);
document.getElementById("m-p").textContent = DATA.length;
document.getElementById("m-pr").textContent = DATA.reduce((a,p)=>a+p.products.length,0);
document.getElementById("s-p").textContent = DATA.length;
document.getElementById("s-pr").textContent = DATA.reduce((a,p)=>a+p.products.length,0);
document.getElementById("s-jing").textContent = DATA.filter(p=>p.finishes.includes("精装")||p.finishes.includes("混合")).length;
document.getElementById("s-metro").textContent = DATA.filter(p=>p.metroFlag==="有地铁").length;

let state = { page:1, per:25, btypes:new Set() };

// 楼盘标记（意向/商榷/排除），按楼盘 id 存储，localStorage 持久化，刷新不丢
const MARK_KEY = "cq_estate_marks_v1";
const MARK_RANK = { yixiang:0, paiqi:1, paichu:2, "":3 };
let marks = {};
try { marks = JSON.parse(localStorage.getItem(MARK_KEY) || "{}") || {}; } catch(e){ marks = {}; }
function saveMarks(){ try{ localStorage.setItem(MARK_KEY, JSON.stringify(marks)); }catch(e){} }
function markCell(p){
  const cur = marks[p.id] || "";
  const mk = (k,txt)=>'<span class="mbtn m-'+k+(cur===k?' on':'')+'" data-mk="'+k+'" data-id="'+p.id+'">'+txt+'</span>';
  return '<div class="markbox">'+mk("yixiang","意向")+mk("paiqi","商榷")+mk("paichu","排除")+'</div>';
}

const BTYPE_ORDER = ["高层","小高层","洋房","别墅","大平层","公寓/商业","其他"];
const availBtypes = [...new Set(DATA.flatMap(p=>p.btypes))].sort((a,b)=>BTYPE_ORDER.indexOf(a)-BTYPE_ORDER.indexOf(b));
(function buildBtypeChips(){
  const box = $("btype-chips");
  if(!availBtypes.length){ box.innerHTML='<span style="color:#9aa3af;font-size:12px">无数据</span>'; return; }
  box.innerHTML = availBtypes.map(b=>`<span class="chip" data-b="${b}">${b}</span>`).join("");
  box.querySelectorAll(".chip").forEach(c=>{
    c.addEventListener("click",()=>{
      const b=c.dataset.b;
      if(state.btypes.has(b)){state.btypes.delete(b);c.classList.remove("on");}
      else{state.btypes.add(b);c.classList.add("on");}
      state.page=1;render();
    });
  });
})();

// 大区 / 板块 下拉（v1.7 新增）：根据数据动态填充，板块随大区联动
const regionPlates = {};
const allPlatesSet = new Set();
DATA.forEach(p=>{
  if(p.region){ (regionPlates[p.region] = regionPlates[p.region] || []).push(p.plate); }
  if(p.plate) allPlatesSet.add(p.plate);
});
const regionCounts = {};
DATA.forEach(p=>{ if(p.region) regionCounts[p.region]=(regionCounts[p.region]||0)+1; });
const regionList = Object.keys(regionCounts).sort((a,b)=>regionCounts[b]-regionCounts[a]);
const allPlates = [...allPlatesSet].sort((a,b)=>a.localeCompare(b,"zh"));
function refreshPlateOptions(){
  const rg = $("f-region").value;
  const sel = $("f-plate");
  const opts = rg ? (regionPlates[rg]||[]).filter(Boolean).sort((a,b)=>a.localeCompare(b,"zh")) : allPlates;
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部</option>' + opts.map(o=>`<option value="${o}">${o}</option>`).join("");
  if(opts.includes(cur)) sel.value = cur; else sel.value = "";
}
(function buildRegionSelect(){
  const sel = $("f-region");
  sel.innerHTML = '<option value="">全部</option>' + regionList.map(r=>`<option value="${r}">${r}（${regionCounts[r]}）</option>`).join("");
  refreshPlateOptions();
})();

function esc(t){return (t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function finishTag(c){
  if(c==="清水") return '<span class="tag tag-qing">清水</span>';
  if(c==="精装") return '<span class="tag tag-jing">精装</span>';
  if(c==="混合") return '<span class="tag tag-hun">清水+精装</span>';
  if(c==="未注明") return '<span class="tag tag-no">未注明</span>';
  return '<span class="tag tag-no">'+esc(c)+'</span>';
}
function metroTag(f){
  if(f==="有地铁") return '<span class="tag tag-myes">近地铁</span>';
  if(f==="无地铁") return '<span class="tag tag-mno">无地铁</span>';
  return '<span class="tag tag-mun">未注明</span>';
}

function applyFilters(){
  const kw = $("f-kw").value.trim().toLowerCase();
  const finish = $("f-finish").value;
  const metro = $("f-metro").value;
  const layout = $("f-layout").value;
  const amin = parseFloat($("f-amin").value);
  const amax = parseFloat($("f-amax").value);
  const pmin = parseFloat($("f-pmin").value);
  const pmax = parseFloat($("f-pmax").value);
  const school = $("f-school").value.trim().toLowerCase();
  const markSel = $("f-mark").value;
  const regionSel = $("f-region").value;
  const plateSel = $("f-plate").value;

  let res = DATA.filter(p=>{
    if(finish && !p.finishes.includes(finish)) return false;
    if(metro && p.metroFlag!==metro) return false;
    if(layout && !p.layouts.includes(layout)) return false;
    if(state.btypes.size && !p.btypes.some(b=>state.btypes.has(b))) return false;
    if(markSel){
      const m = marks[p.id] || "";
      if(markSel==="none"){ if(m) return false; }
      else if(m!==markSel) return false;
    }
    if(regionSel && p.region!==regionSel) return false;
    if(plateSel && p.plate!==plateSel) return false;
    if(!isNaN(amin) && p.maxArea!==null && p.maxArea<amin) return false;
    if(!isNaN(amax) && p.minArea!==null && p.minArea>amax) return false;
    if(!isNaN(pmin) && p.maxPrice!==null && p.maxPrice<pmin) return false;
    if(!isNaN(pmax) && p.minPrice!==null && p.minPrice>pmax) return false;
    if(school && !(p.school||"").toLowerCase().includes(school)) return false;
    if(kw){
      const blob = (p.name+" "+(p.proscons||"")+" "+(p.school||"")+" "+(p.region||"")+" "+(p.plate||"")+" "+p.products.map(x=>x.product+" "+x.layout).join(" ")).toLowerCase();
      if(!blob.includes(kw)) return false;
    }
    return true;
  });

  const sort = $("f-sort").value;
  if(sort==="name") res.sort((a,b)=>a.name.localeCompare(b.name,"zh"));
  else if(sort==="areaAsc") res.sort((a,b)=>(a.minArea??1e9)-(b.minArea??1e9));
  else if(sort==="areaDesc") res.sort((a,b)=>(b.maxArea??-1)-(a.maxArea??-1));
  else if(sort==="priceAsc") res.sort((a,b)=>(a.minPrice??1e9)-(b.minPrice??1e9));
  else if(sort==="priceDesc") res.sort((a,b)=>(b.maxPrice??-1)-(a.maxPrice??-1));
  else if(sort==="mark") res.sort((a,b)=> (MARK_RANK[marks[a.id]??""]??3)-(MARK_RANK[marks[b.id]??""]??3) || (a.id-b.id));
  else if(sort==="region") res.sort((a,b)=> (a.region||"~").localeCompare(b.region||"~","zh") || (a.plate||"~").localeCompare(b.plate||"~","zh") || (a.name||"").localeCompare(b.name||"","zh"));

  return res;
}

function renderPros(t){
  if(!t) return '<span style="color:#9aa3af">—</span>';
  return '<div class="pc-pros">'+esc(t)+'</div>';
}
function renderCons(t){
  if(!t) return '<span style="color:#9aa3af">—</span>';
  return '<div class="pc-cons">'+esc(t)+'</div>';
}

function render(){
  const res = applyFilters();
  $("r-count").textContent = res.length;
  $("s-show").textContent = res.length;
  $("c-yixiang").textContent = DATA.filter(p=>marks[p.id]==="yixiang").length;
  $("c-paiqi").textContent = DATA.filter(p=>marks[p.id]==="paiqi").length;
  $("c-paichu").textContent = DATA.filter(p=>marks[p.id]==="paichu").length;
  const totalPages = Math.max(1, Math.ceil(res.length/state.per));
  if(state.page>totalPages) state.page=totalPages;
  const start = (state.page-1)*state.per;
  const slice = res.slice(start, start+state.per);

  const tb = $("tbody");
  if(slice.length===0){
    tb.innerHTML = '<tr><td colspan="11" class="empty">没有符合筛选条件的楼盘，试试放宽条件～</td></tr>';
  } else {
    tb.innerHTML = slice.map(p=>{
      const prods = p.products.map(x=>{
        const a = x.area!=null ? x.area+"㎡" : "—";
        const l = x.layout || "—";
        const d = x.deliver || "—";
        const bt = x.btype.map(b=>'<span class="tag tag-btype">'+esc(b)+'</span>').join("");
        return '<div class="pp">'+bt+' '+esc(x.product||"—")+' · <span class="num">'+a+'</span> · '+esc(l)+' · 交房 '+esc(d)+'</div>';
      }).join("");
      const finishHtml = p.finishes.map(finishTag).join("");
      const layoutHtml = p.layoutText;
      const regionHtml = (p.region||p.plate)
        ? ('<div style="font-size:12px"><span class="tag tag-mno" style="background:#eef0f7;color:#5a6271">'+esc(p.region||"—")+'</span></div>'+
           (p.plate?'<div style="font-size:12.5px;font-weight:600;color:#2f6df6;margin-top:3px">'+esc(p.plate)+'</div>':'<div style="font-size:12px;color:#6b7480;margin-top:3px">—</div>'))
        : '<span style="color:#9aa3af">—</span>';
      return '<tr>'+
        '<td class="seq" data-l="#">'+p.id+'</td>'+
        '<td data-l="标记">'+markCell(p)+'</td>'+
        '<td data-l="楼盘"><span class="pname">'+esc(p.name)+'</span></td>'+
        '<td data-l="大区/板块">'+regionHtml+'</td>'+
        '<td data-l="产品"><div class="prods">'+prods+'</div></td>'+
        '<td class="num" data-l="总价"><b>'+esc(p.priceText)+'</b></td>'+
        '<td data-l="装修">'+finishHtml+'</td>'+
        '<td data-l="中小学">'+esc(p.school||"—")+'</td>'+
        '<td data-l="地铁">'+metroTag(p.metroFlag)+(p.metro?('<div style="font-size:11px;color:#6b7480;margin-top:2px">'+esc(p.metro)+'</div>'):'')+(p.metroWeb?('<div style="font-size:11px;color:#2f6df6;margin-top:2px"><span class="tag tag-net">网</span>'+esc(p.metroWeb)+'</div>'):'')+'</td>'+
        '<td data-l="优点">'+renderPros(p.pros)+'</td>'+
        '<td data-l="缺点">'+renderCons(p.cons)+'</td>'+
      '</tr>';
    }).join("");
  }

  // 分页
  const pg = $("pages");
  let ph = '';
  ph += '<button class="pg" '+(state.page===1?'disabled':'')+' data-p="'+(state.page-1)+'">‹ 上一页</button>';
  const win = [];
  for(let i=1;i<=totalPages;i++){
    if(i===1||i===totalPages||Math.abs(i-state.page)<=2) win.push(i);
  }
  let last=0;
  win.forEach(i=>{ if(i-last>1) ph+='<span style="color:#9aa3af">…</span>'; ph+='<button class="pg'+(i===state.page?' cur':'')+'" data-p="'+i+'">'+i+'</button>'; last=i;});
  ph += '<button class="pg" '+(state.page===totalPages?'disabled':'')+' data-p="'+(state.page+1)+'">下一页 ›</button>';
  ph += '<span style="color:#6b7480;font-size:12px;margin-left:8px">共 '+totalPages+' 页</span>';
  pg.innerHTML = ph;
  pg.querySelectorAll(".pg[data-p]").forEach(b=>{
    b.addEventListener("click",()=>{ const v=parseInt(b.dataset.p); if(!isNaN(v)&&v>=1&&v<=totalPages){state.page=v;render();window.scrollTo({top:0,behavior:"smooth"});}});
  });
}

["f-kw","f-finish","f-metro","f-layout","f-amin","f-amax","f-pmin","f-pmax","f-school","f-sort","f-mark","f-region","f-plate"].forEach(id=>{
  $(id).addEventListener("input",()=>{state.page=1;render();});
  $(id).addEventListener("change",()=>{state.page=1;render();});
});
// 切换大区时联动刷新板块下拉
$("f-region").addEventListener("change",()=>{ refreshPlateOptions(); state.page=1; render(); });
// 点击「意向/商榷/排除」切换标记（事件委托，tbody 重建后仍有效）
$("tbody").addEventListener("click", e=>{
  const b = e.target.closest(".mbtn");
  if(!b) return;
  const id = b.dataset.id, k = b.dataset.mk;
  if(marks[id]===k) delete marks[id]; else marks[id]=k;
  saveMarks();
  render();
});
$("m-clear").addEventListener("click",()=>{
  if(confirm("确定清除全部意向 / 商榷 / 排除 标记？")){ marks={}; saveMarks(); render(); }
});
$("f-reset").addEventListener("click",()=>{
  ["f-kw","f-amin","f-amax","f-pmin","f-pmax","f-school"].forEach(id=>$(id).value="");
  ["f-finish","f-metro","f-layout","f-sort","f-mark","f-region","f-plate"].forEach(id=>$(id).value="");
  state.btypes.clear();
  document.querySelectorAll("#btype-chips .chip.on").forEach(c=>c.classList.remove("on"));
  state.page=1;render();
});

render();
</script>
</body>
</html>
