<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金福云 VR 直达</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b1020'/%3E%3Cpath d='M50 20 L76 38 V74 L50 92 L24 74 V38 Z' fill='none' stroke='%2322d3ee' stroke-width='6'/%3E%3Ccircle cx='50' cy='55' r='10' fill='%2322d3ee'/%3E%3C/svg%3E">
<!-- 提前建链：省去首次 DNS+TLS 握手，登录与目标页复用 -->
<link rel="dns-prefetch" href="https://vr.jinfuyun.cn">
<link rel="preconnect" href="https://vr.jinfuyun.cn" crossorigin>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0b1020;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  /* 全屏 iframe：先试直接打开目标页 */
  #jfyFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b1020;visibility:hidden}
  #jfyFrame.ready{visibility:visible}
  /* 进入遮罩（hidden 期间完成登录，用户无感） */
  #mask{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 700px at 20% -10%,#1e2a4f 0%,transparent 60%),
               radial-gradient(1000px 600px at 110% 110%,#2a1e4f 0%,transparent 55%),#0b1020;
    color:#eaf2ff;transition:opacity .45s ease}
  #mask.hide{opacity:0;pointer-events:none}
  .box{text-align:center}
  .logo{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;
    background:linear-gradient(135deg,#22d3ee,#a78bfa);display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px rgba(34,211,238,.35)}
  .logo svg{width:34px;height:34px}
  .box h1{font-size:18px;font-weight:700;letter-spacing:.5px;margin-bottom:8px}
  .box .sub{font-size:12.5px;color:#9fb3d8;line-height:1.7}
  .box .acct{font-size:11.5px;color:#6d7fa3;margin-top:10px}
  .box .acct b{color:#cfe3ff}
  .box .new{display:inline-block;margin-top:14px;font-size:12px;color:#22d3ee;text-decoration:none;border:1px solid rgba(34,211,238,.3);padding:6px 12px;border-radius:10px}
  .box .new:hover{background:rgba(34,211,238,.1)}
  .dot{width:10px;height:10px;border-radius:50%;background:#22d3ee;display:inline-block;margin-right:8px;
    animation:pulse 1.2s ease-in-out infinite;vertical-align:middle}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  /* 浮动自动登录按钮（网络失败兜底） */
  #fab{position:fixed;right:14px;bottom:14px;z-index:30;display:none;border:none;cursor:pointer;
    border-radius:14px;font-size:13.5px;font-weight:700;padding:11px 16px;color:#04121a;
    background:linear-gradient(180deg,#4de0f5,#0ea5c9);box-shadow:0 6px 18px rgba(34,211,238,.35)}
  #fab:active{transform:translateY(1px)}
</style>
</head>
<body>
  <iframe id="jfyFrame" src="about:blank" title="金福云" referrerpolicy="no-referrer-when-downgrade"></iframe>

  <div id="mask">
    <div class="box">
      <div class="logo">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M50 14 L80 34 V72 L50 92 L20 72 V34 Z" stroke="#04121a" stroke-width="7" stroke-linejoin="round"/>
          <circle cx="50" cy="54" r="11" fill="#04121a"/>
        </svg>
      </div>
      <h1><span class="dot"></span>正在进入金福云…</h1>
      <div class="sub">已登录将直接打开主页<br>未登录将自动登录后进入</div>
      <div class="acct">登录账号：<b id="acctTxt"></b></div>
      <a class="new" id="btnNew" href="#" target="_blank" rel="noopener">↗ 在新窗口打开</a>
    </div>
  </div>

  <button id="fab">🔑 自动登录</button>

<script>
  // ===== 配置 =====
  var JFY_ACCOUNT  = '18523591621';
  var JFY_PASSWORD = 'wxf19900064wxf';
  var LOGIN_URL    = 'https://vr.jinfuyun.cn/passport/login?act=do_login';
  var DEFAULT_DEST = 'https://vr.jinfuyun.cn/people?uid=17065';

  // 支持 ?url=完整地址 或 ?uid=123 覆盖目标页
  var DEST = DEFAULT_DEST;
  (function(){
    try{
      var q = new URLSearchParams(location.search);
      if(q.get('url')){ DEST = decodeURIComponent(q.get('url')); }
      else if(q.get('uid')){ DEST = 'https://vr.jinfuyun.cn/people?uid=' + q.get('uid'); }
    }catch(e){}
  })();

  var frame = document.getElementById('jfyFrame');
  var mask  = document.getElementById('mask');
  var fab   = document.getElementById('fab');
  document.getElementById('acctTxt').textContent = JFY_ACCOUNT.slice(0,3) + '****' + JFY_ACCOUNT.slice(-4);
  document.getElementById('btnNew').href = DEST;

  var shown = false;
  function showFrame(){
    if(shown) return;
    shown = true;
    frame.classList.add('ready');
    mask.classList.add('hide');
    fab.style.display = 'none';
    setTimeout(function(){ try{ mask.remove(); }catch(e){} }, 600);
  }

  function reloadFrame(){ frame.src = DEST; }

  // ===== 先试直接打开（iframe 直接加载目标页）=====
  frame.src = DEST;

  // ===== 后台静默登录：成功则刷新 iframe 进登录态 =====
  function doLogin(cb){
    try{
      var fd = new URLSearchParams();
      fd.set('phone', JFY_ACCOUNT);
      fd.set('password', JFY_PASSWORD);
      fetch(LOGIN_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: fd.toString(),
        credentials: 'include',
        mode: 'no-cors'
      }).then(function(){ cb(true); }, function(){ cb(false); });
    }catch(e){ cb(false); }
  }

  doLogin(function(ok){
    if(ok){
      // cookie 已种：重新加载 iframe（此时即为登录态主页），加载完再显示，避免闪烁
      frame.onload = function(){ showFrame(); };
      reloadFrame();
      // 保险：若 onload 迟迟不来也显示
      setTimeout(showFrame, 2500);
    } else {
      // 登录失败：显示当前 iframe（可能未登录），给出浮动按钮兜底
      showFrame();
      fab.style.display = 'block';
    }
  });

  // 兜底：6s 内未显示也强制显示
  setTimeout(showFrame, 6000);

  // ===== 浮动按钮：新窗口顶层 POST 登录（网络失败兜底）=====
  fab.addEventListener('click', function(){
    fab.textContent = '正在登录…';
    var w = window.open('about:blank', 'jfyAutoLoginWin');
    if(!w){ alert('请允许弹出窗口后重试'); fab.textContent = '🔑 自动登录'; return; }
    var d = w.document;
    d.write('<html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head>' +
      '<body style="margin:0;background:#0b1020;color:#9fb3d8;font:14px/2 sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center">' +
      '🔑 正在自动登录金福云…<br><small>登录成功后自动进入</small></body></html>');
    d.close();
    var form = d.createElement('form');
    form.method = 'POST';
    form.action = LOGIN_URL;
    var a = d.createElement('input'); a.type='hidden'; a.name='phone';    a.value=JFY_ACCOUNT;
    var b = d.createElement('input'); b.type='hidden'; b.name='password'; b.value=JFY_PASSWORD;
    form.appendChild(a); form.appendChild(b);
    d.body.appendChild(form);
    form.submit();
    setTimeout(function(){
      try{ w.location.href = DEST; }catch(e){}
      reloadFrame();      // 登录态已种，刷新 iframe 进入主页
      showFrame();
      fab.style.display = 'none';
    }, 2000);
  });
</script>
</body>
</html>
