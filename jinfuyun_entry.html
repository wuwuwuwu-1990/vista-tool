<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金福云 VR 自动登录入口</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b1020'/%3E%3Cpath d='M50 20 L76 38 V74 L50 92 L24 74 V38 Z' fill='none' stroke='%2322d3ee' stroke-width='6'/%3E%3Ccircle cx='50' cy='55' r='10' fill='%2322d3ee'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b1020;
    --card:#121a33;
    --cyan:#22d3ee;
    --cyan2:#a78bfa;
    --text:#eaf2ff;
    --sub:#9fb3d8;
    --ok:#34d399;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    background:radial-gradient(1200px 700px at 20% -10%,#1e2a4f 0%,transparent 60%),
               radial-gradient(1000px 600px at 110% 110%,#2a1e4f 0%,transparent 55%),
               var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    width:100%;max-width:460px;
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px;
    padding:40px 34px 34px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
    text-align:center;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(120deg,rgba(34,211,238,.12),transparent 40%,transparent 60%,rgba(167,139,250,.12));
  }
  .logo{
    width:74px;height:74px;margin:0 auto 18px;border-radius:20px;
    background:linear-gradient(135deg,var(--cyan),var(--cyan2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px rgba(34,211,238,.35);
  }
  .logo svg{width:40px;height:40px}
  h1{font-size:21px;font-weight:700;letter-spacing:.5px;margin-bottom:8px}
  .sub{font-size:13.5px;color:var(--sub);margin-bottom:26px;line-height:1.7}
  .status{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.22);
    border-radius:14px;padding:14px 18px;margin-bottom:22px;font-size:15px;font-weight:600;
  }
  .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);flex:none;
    animation:pulse 1.2s ease-in-out infinite}
  .dot.ok{background:var(--ok);animation:none}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .acct{font-size:12px;color:var(--sub);margin:-8px 0 20px}
  .acct b{color:#cfe3ff;font-weight:600}
  .btn{
    display:block;width:100%;border:none;cursor:pointer;border-radius:14px;
    font-size:15.5px;font-weight:700;padding:15px 18px;letter-spacing:.5px;
    transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;
    color:#04121a;
    background:linear-gradient(180deg,#4de0f5,#0ea5c9);
    box-shadow:0 6px 0 #06708a,0 14px 30px rgba(34,211,238,.25);
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #06708a}
  .btn.ghost{
    margin-top:14px;color:#cfe3ff;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.14);box-shadow:none;
  }
  .btn.ghost:hover{background:rgba(255,255,255,.09)}
  .hint{font-size:12px;color:#6d7fa3;margin-top:22px;line-height:1.7}
  .hint a{color:var(--cyan);text-decoration:none}
  .hint a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 100 100" fill="none">
        <path d="M50 14 L80 34 V72 L50 92 L20 72 V34 Z" stroke="#04121a" stroke-width="7" stroke-linejoin="round"/>
        <circle cx="50" cy="54" r="11" fill="#04121a"/>
      </svg>
    </div>
    <h1>金福云 VR 自动登录</h1>
    <div class="sub">正在使用内置账号自动登录，<br>成功后自动打开目标页面</div>
    <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusTxt">正在自动登录…</span></div>
    <div class="acct">登录账号：<b id="acctTxt"></b></div>
    <button class="btn" id="btnRelogin">🔑 重新自动登录（新窗口）</button>
    <button class="btn ghost" id="btnOpen" onclick="openDirect()">↗ 直接打开目标页</button>
    <div class="hint">
      若页面未自动跳转，说明浏览器拦截了第三方 Cookie。<br>
      点击上方「重新自动登录」可 100% 成功。
    </div>
  </div>

<script>
  // ===== 配置（可替换） =====
  var JFY_ACCOUNT  = '18523591621';
  var JFY_PASSWORD = 'wxf19900064wxf';
  var LOGIN_URL    = 'https://vr.jinfuyun.cn/passport/login?act=do_login';
  var DEFAULT_DEST = 'https://vr.jinfuyun.cn/people?uid=17065';

  // 支持 ?url=完整地址 或 ?uid=123 覆盖目标页
  var DEST = DEFAULT_DEST;
  (function(){
    try{
      var q = new URLSearchParams(location.search);
      if(q.get('url')){ DEST = decodeURIComponent(q.get('url')); }
      else if(q.get('uid')){ DEST = 'https://vr.jinfuyun.cn/people?uid=' + q.get('uid'); }
    }catch(e){}
  })();

  // ===== UI =====
  var statusEl = document.getElementById('status');
  var statusTxt = document.getElementById('statusTxt');
  var dotEl = document.getElementById('dot');
  document.getElementById('acctTxt').textContent =
    JFY_ACCOUNT.slice(0,3) + '****' + JFY_ACCOUNT.slice(-4);

  function setStatus(msg, ok){
    statusTxt.textContent = msg;
    if(ok){ dotEl.classList.add('ok'); } else { dotEl.classList.remove('ok'); }
  }

  function goDest(){
    setStatus('登录成功，正在打开目标页…', true);
    setTimeout(function(){ window.location.href = DEST; }, 600);
  }

  // ===== 方式一：隐藏 iframe POST 登录（无缝，大多数桌面浏览器可用） =====
  function autoLogin(){
    var finished = false;
    var f = document.createElement('iframe');
    f.name = 'jfyLoginFrame';
    f.src = 'about:blank';
    f.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:2px;height:2px;border:0;visibility:hidden';
    document.body.appendChild(f);

    var form = document.createElement('form');
    form.method = 'POST';
    form.target = 'jfyLoginFrame';
    form.action = LOGIN_URL;
    var a = document.createElement('input'); a.type='hidden'; a.name = 'phone';    a.value = JFY_ACCOUNT;
    var b = document.createElement('input'); b.type='hidden'; b.name = 'password'; b.value = JFY_PASSWORD;
    form.appendChild(a); form.appendChild(b);
    form.style.display = 'none';
    document.body.appendChild(form);

    var go = function(){
      if(finished) return;
      finished = true;
      try{ form.remove(); }catch(e){}
      try{ f.remove(); }catch(e){}
      goDest();
    };
    f.onload = function(){ setTimeout(go, 1500); };  // 等 cookie 落地
    setTimeout(go, 7000);                            // 兜底
    form.submit();
  }

  // ===== 方式二：顶层新窗口 POST（第三方 Cookie 被拦截时 100% 可用） =====
  document.getElementById('btnRelogin').addEventListener('click', function(){
    setStatus('正在新窗口自动登录…');
    var w = window.open('about:blank', 'jfyAutoLoginWin');
    if(!w){
      alert('请允许弹出窗口后重试');
      setStatus('弹窗被拦截，请允许弹出窗口');
      return;
    }
    var d = w.document;
    d.write('<html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head>' +
      '<body style="margin:0;background:#0b1020;color:#9fb3d8;font:14px/2 sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center">' +
      '🔑 正在自动登录金福云…<br><small>登录成功后自动打开目标页</small></body></html>');
    d.close();
    var form = d.createElement('form');
    form.method = 'POST';
    form.action = LOGIN_URL;
    var a = d.createElement('input'); a.type='hidden'; a.name='phone';    a.value=JFY_ACCOUNT;
    var b = d.createElement('input'); b.type='hidden'; b.name='password'; b.value=JFY_PASSWORD;
    form.appendChild(a); form.appendChild(b);
    d.body.appendChild(form);
    form.submit();
    setTimeout(function(){ try{ w.location.href = DEST; }catch(e){} }, 2000);
  });

  function openDirect(){ window.open(DEST, '_blank'); }

  // 启动
  autoLogin();
</script>
</body>
</html>
