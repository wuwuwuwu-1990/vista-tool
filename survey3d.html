    for(let k=0;k<segs.length;k+=6){
      const x1 = segs[k],   y1 = segs[k+1], z1 = segs[k+2]*zs;
      const x2 = segs[k+3], y2 = segs[k+4], z2 = segs[k+5]*zs;
      const d1 = z1 - baseZ, d2 = z2 - baseZ;
      if(Math.abs(d1) < 1e-4 && Math.abs(d2) < 1e-4) continue;
      if(!proj(x1, y1, z1, pa)) continue;
      if(!proj(x2, y2, z2, pb)) continue;
      if(!proj(x2, y2, baseZ, pc)) continue;
      if(!proj(x1, y1, baseZ, pd)) continue;
      const sx = x2 - x1, sy = y2 - y1;
      const sl = Math.hypot(sx, sy) || 1;
      quads.push({
        x1:pa[0], y1:pa[1], x2:pb[0], y2:pb[1],
        x3:pc[0], y3:pc[1], x4:pd[0], y4:pd[1],
        z:(pa[2]+pb[2])*0.5, cut:(d1+d2) > 0, nxv:-sy/sl, nyv:sx/sl
      });
    }
  } else {
  // 沿"有效格网区域"的边界成壁：多块测区会各自封闭，中间空白处自然断开
  const qnx = nx-1, qny = s.ny-1;
  const qv = new Uint8Array(qnx*qny);
  for(let j=0;j<qny;j++){
    const row = j*nx;
    for(let i=0;i<qnx;i++){
      const a = row + i;
      if(valid[a] && valid[a+1] && valid[a+nx] && valid[a+nx+1]) qv[j*qnx+i] = 1;
    }
  }
  for(let j=0;j<qny;j++){
    for(let i=0;i<qnx;i++){
      if(!qv[j*qnx+i]) continue;
      const a = j*nx + i;          // 左下
      const b = a + 1;             // 右下
      const d = a + nx;            // 左上
      const c = d + 1;             // 右上
      if(j === 0 || !qv[(j-1)*qnx+i]) edge(a, b, 0, -1);        // 南边
      if(j === qny-1 || !qv[(j+1)*qnx+i]) edge(b, c, 0, 1);     // 北边
      if(i === 0 || !qv[j*qnx+i-1]) edge(a, d, -1, 0);          // 西边
      if(i === qnx-1 || !qv[j*qnx+i+1]) edge(d, c, 1, 0);       // 东边
    }
  }
  }

  if(!quads.length) return;
  // 从远到近绘制，保证前后遮挡关系
  quads.sort((p, q) => q.z - p.z);

  const g = ctx;
  const LX = 0.42, LY = -0.36;
  // 挖方（地形高于基准面）用暖褐土色，填方（地形低于基准面）用冷灰蓝色
  const CUT_C = [142, 108, 74];
  const FIL_C = [72, 104, 124];

  g.save();
  g.lineWidth = 1;
  g.lineJoin = 'round';
  for(let k=0;k<quads.length;k++){
    const q = quads[k];
    const c = q.cut ? CUT_C : FIL_C;
    let f = 0.74 + (q.nxv*LX + q.nyv*LY)*0.55;
    if(f < 0.34) f = 0.34; else if(f > 1.12) f = 1.12;
    const col = 'rgb(' + clampInt(c[0]*f,0,255) + ',' + clampInt(c[1]*f,0,255) + ',' + clampInt(c[2]*f,0,255) + ')';
    g.fillStyle = col;
    g.strokeStyle = col;
    g.beginPath();
    g.moveTo(q.x1, q.y1);
    g.lineTo(q.x2, q.y2);
    g.lineTo(q.x3, q.y3);
    g.lineTo(q.x4, q.y4);
    g.closePath();
    g.fill();
    g.stroke();
  }
  g.restore();
}

function fmtVol(v){
  // 直接用完整真实数值：不缩写（k）、不加千分位分隔，四舍五入到整数
  return Math.round(v).toString();
}

function updateBaseInfo(){
  const el = $('baseInfo');
  if(!el) return;
  if(!S.loaded || !S.surf || !S.rawBox){ el.innerHTML = '<span>载入数据后显示挖填方量</span>'; return; }
  const s = S.surf;

  // 三角网 DTM 法：逐三角柱积分（CASS「DTM 法土方计算」的算法）
  if(s.kind === 'tin'){
    const tris = s.tris, ntri = s.ntri, px = s.px, py = s.py, pz = s.pz;
    const base = S.baseElev;   // 绝对高程（pz 是减去中心高程后的相对值，需 +zCenter 还原）
    let cut = 0, fill = 0, nAbove = 0;
    for(let t=0;t<ntri;t++){
      const a = tris[3*t], b = tris[3*t+1], c = tris[3*t+2];
      const area = Math.abs((px[b]-px[a])*(py[c]-py[a]) - (py[b]-py[a])*(px[c]-px[a]))*0.5;
      const hh = (pz[a] + pz[b] + pz[c])/3 + S.zCenter;   // 还原为绝对高程
      if(hh > base){ cut += (hh - base)*area; nAbove++; }
      else fill += (base - hh)*area;
    }
    const pct = ntri ? nAbove/ntri*100 : 0;
    el.innerHTML =
      '<span>挖方 <b>' + fmtVol(cut) + '</b> m³</span>' +
      '<span>填方 <b>' + fmtVol(fill) + '</b> m³</span>' +
      '<span>高于基准面 <b>' + pct.toFixed(0) + '</b>%</span>' +
      '<span>净' + (cut >= fill ? '挖 ' : '填 ') + '<b>' + fmtVol(Math.abs(cut - fill)) + '</b> m³</span>';
    return;
  }

  const res = s.res, nx = s.nx;
  const dx = (S.box.x1 - S.box.x0)/res, dy = (S.box.y1 - S.box.y0)/res;
  const A = dx*dy;
  const base = S.baseElev;
  let cut = 0, fill = 0, nAbove = 0, nCells = 0;
  for(let j=0;j<res;j++){
    const row = j*nx;
    for(let i=0;i<res;i++){
      const a = row + i, bb = a+1, cc = a+nx+1, dd = a+nx;
      if(!s.valid[a] || !s.valid[bb] || !s.valid[cc] || !s.valid[dd]) continue;
      const h = (s.vz[a] + s.vz[bb] + s.vz[cc] + s.vz[dd])*0.25 + S.zCenter;
      nCells++;
      if(h > base){ cut += (h - base)*A; nAbove++; }
      else fill += (base - h)*A;
    }
  }
  const pct = nCells ? nAbove/nCells*100 : 0;
  el.innerHTML =
    '<span>挖方 <b>' + fmtVol(cut) + '</b> m³</span>' +
    '<span>填方 <b>' + fmtVol(fill) + '</b> m³</span>' +
    '<span>高于基准面 <b>' + pct.toFixed(0) + '</b>%</span>' +
    '<span>净' + (cut >= fill ? '挖 ' : '填 ') + '<b>' + fmtVol(Math.abs(cut - fill)) + '</b> m³</span>';
}

function render(){
  updateCamera();

  ctx.fillStyle = '#080b10';
  ctx.fillRect(0, 0, V.w, V.h);

  if(!S.loaded){
    drawGizmo();
    return;
  }

  // 基准面与地形的遮挡：基准面在地形之下时先画（被地形自然覆盖），
  // 高于地形平均高程时后画（半透明覆盖，近似正确遮挡）。侧壁跟随同组顺序。
  const planeAbove = S.showBase && S.baseElev > (S.rawBox.h0 + S.rawBox.h1) * 0.5;
  const skirt = S.showBase && S.showSkirt;
  if(skirt && !planeAbove) drawSkirt();
  if(S.showBase && !planeAbove) drawBasePlane();
  if((S.showSurface || S.showContour) && S.surf) drawSurface();
  if(S.showCloud) drawCloud();
  if(skirt && planeAbove) drawSkirt();
  if(S.showBase && planeAbove) drawBasePlane();
  drawGizmo();
}

/* ---- 点云 ---- */
function drawCloud(){
  const ex = V.eye.x, ey = V.eye.y, ez = V.eye.z;
  const fx = V.fx, fy = V.fy, fz = V.fz;
  const rx = V.rx, ry = V.ry, rz = V.rz;
  const ux = V.ux, uy = V.uy, uz = V.uz;
  const focal = V.focal, ccx = V.cx, ccy = V.cy;
  const W = V.w, H = V.h;

  const wx = S.wx, wy = S.wy, wz = S.wz, ci = S.ci;
  const pal = S.palBase;
  const idx = S.drawIdx, dn = S.drawN;
  const zs = S.zExag;
  const sz = S.pointSize;
  const half = sz/2;
  const lift = (S.showSurface && S.surf) ? S.diag*0.0012 : 0;
  // 拖拽旋转时进一步抽稀，保证流畅
  const stride = S.dragging ? Math.max(1, Math.ceil(dn/30000)) : 1;
  // 点云很密时降低不透明度，避免盖住曲面色彩变成噪点
  const dense = dn > 15000;
  if(dense) ctx.globalAlpha = 0.5;

  for(let k=0;k<dn;k+=stride){
    const i = idx[k];
    const px = wx[i];
    const py = wy[i];
    const pz = wz[i]*zs + lift;
    const ddx = px-ex, ddy = py-ey, ddz = pz-ez;
    const zc = ddx*fx + ddy*fy + ddz*fz;
    if(zc < 0.5) continue;
    const inv = focal/zc;
    const sxx = ccx + (ddx*rx + ddy*ry + ddz*rz)*inv;
    if(sxx < -8 || sxx > W+8) continue;
    const syy = ccy - (ddx*ux + ddy*uy + ddz*uz)*inv;
    if(syy < -8 || syy > H+8) continue;
    ctx.fillStyle = pal[ci[i]];
    ctx.fillRect(sxx-half, syy-half, sz, sz);
  }
  if(dense) ctx.globalAlpha = 1;
}

/* ---- 曲面 + 等高线（同一遍历顺序绘制，保证遮挡关系正确） ---- */
/* ---- 三角网 DTM 渲染：深度分桶 + 同色合并批绘 ----
   三角网面数可达数十万，逐面 fill/stroke 会拖垮帧率。
   按面重心深度分桶（远→近），桶内再按"色带×明暗"合并成一条路径一次填充，
   canvas 调用次数从上百万降到几千，同时保住前后遮挡关系。 */
function drawTIN(){
  const base = S.surf;
  if(!base || base.kind !== 'tin') return;
  const s = (S.dense && base.dense) ? base.dense : base;
  const zs = S.zExag;
  const px = s.px, py = s.py, pz = s.pz, nv = s.nv;
  const tris = s.tris, ntri = s.ntri;
  const fci = s.fci, fnx = s.fnx, fny = s.fny;
  const sx = s.sx, sy = s.sy, cz = s.cz, vis = s.vis;

  const ex = V.eye.x, ey = V.eye.y, ez = V.eye.z;
  const fx = V.fx, fy = V.fy, fz = V.fz;
  const rx = V.rx, ry = V.ry, rz = V.rz;
  const ux = V.ux, uy = V.uy, uz = V.uz;
  const focal = V.focal, ccx = V.cx, ccy = V.cy;

  for(let k=0;k<nv;k++){
    const dx = px[k]-ex, dy = py[k]-ey, dz = pz[k]*zs - ez;
    const d = dx*fx + dy*fy + dz*fz;
    cz[k] = d;
    if(d < 0.5){ vis[k] = 0; continue; }
    vis[k] = 1;
    const inv = focal/d;
    sx[k] = ccx + (dx*rx + dy*ry + dz*rz)*inv;
    sy[k] = ccy - (dx*ux + dy*uy + dz*uz)*inv;
  }

  // 光照：坡度随垂直夸张变化，zs 改了才重算
  if(!s.fsh || s.fshZ !== zs){
    const fsh = new Uint8Array(ntri);
    const LX = 0.42, LY = -0.36, LZ = 0.83;
    for(let t=0;t<ntri;t++){
      const ax = fnx[t]*zs, ay = fny[t]*zs;
      const len = Math.sqrt(ax*ax + ay*ay + 1) || 1;
      const dot = (ax*LX + ay*LY + LZ)/len;
      let sh = Math.round((dot*0.5 + 0.5)*(SHADE_N-1));
      if(sh < 0) sh = 0; else if(sh > SHADE_N-1) sh = SHADE_N-1;
      fsh[t] = sh;
    }
    s.fsh = fsh; s.fshZ = zs;
  }
  const fsh = s.fsh;
  const pal = S.palShaded;
  const g = ctx;

  // ---- 面重心深度 ----
  if(!s.rt || s.rt.n !== ntri){
    s.rt = {
      n: ntri,
      fz: new Float32Array(ntri),
      bucket: new Int32Array(ntri),
      order: new Int32Array(ntri),
      ck: new Int32Array(ntri),
      corder: new Int32Array(ntri),
      cstart: new Int32Array(PAL_N*SHADE_N),
      ccur: new Int32Array(PAL_N*SHADE_N),
      cnt: null, off: null, nb: 0
    };
  }
  const rt = s.rt;
  const fzA = rt.fz;
  let zmin = Infinity, zmax = -Infinity;
  for(let t=0;t<ntri;t++){
    const i3 = 3*t;
    const a = tris[i3], b = tris[i3+1], c = tris[i3+2];
    if(!vis[a] || !vis[b] || !vis[c]){ fzA[t] = -1; continue; }
    const z = (cz[a] + cz[b] + cz[c]) * 0.3333333;
    fzA[t] = z;
    if(z < zmin) zmin = z;
    if(z > zmax) zmax = z;
  }
  if(!(zmax > zmin)) return;

  const lowQ = S.dragging || S.spin;
  const NB = lowQ ? 32 : (ntri > 60000 ? 160 : (ntri > 20000 ? 96 : 48));
  if(rt.nb !== NB){ rt.cnt = new Int32Array(NB+1); rt.off = new Int32Array(NB+1); rt.nb = NB; }
  const cnt = rt.cnt, off = rt.off;
  cnt.fill(0);

  const invR = (NB - 1)/(zmax - zmin);
  for(let t=0;t<ntri;t++){
    const z = fzA[t];
    if(z < 0) continue;
    let b = ((zmax - z)*invR)|0;      // 桶 0 = 最远
    if(b < 0) b = 0; else if(b >= NB) b = NB-1;
    rt.bucket[t] = b;
    cnt[b+1]++;
  }
  let acc = 0;
  for(let b=0;b<NB;b++){ off[b] = acc; acc += cnt[b+1]; }
  off[NB] = acc;
  // 填充（off 复用为游标）
  const cur = rt.ccur;   // 借用（后面会重置）
  for(let b=0;b<NB;b++) cur[b] = off[b];
  for(let t=0;t<ntri;t++){
    if(fzA[t] < 0) continue;
    const b = rt.bucket[t];
    rt.order[cur[b]++] = t;
  }

  // ---- 逐桶绘制，桶内按颜色合并 ----
  const CK = PAL_N*SHADE_N;
  const ck = rt.ck, corder = rt.corder, cstart = rt.cstart, ccur = rt.ccur;
  const doTri = S.showSurface;

  for(let b=0;b<NB;b++){
    const st = off[b], en = off[b+1];
    if(st >= en) continue;
    if(!doTri) break;

    ccur.fill(0, 0, CK+1);
    for(let i=st;i<en;i++){
      const t = rt.order[i];
      const k = fci[t]*SHADE_N + fsh[t];
      ck[i] = k;
      ccur[k+1]++;
    }
    for(let k=0;k<CK;k++) ccur[k+1] += ccur[k];
    cstart.set(ccur.subarray(0, CK));
    for(let i=st;i<en;i++){
      const k = ck[i];
      corder[ccur[k]++] = rt.order[i];
    }
    for(let k=0;k<CK;k++){
      const e0 = cstart[k], e1 = ccur[k];
      if(e1 <= e0) continue;
      g.beginPath();
      for(let i=e0;i<e1;i++){
        const i3 = 3*rt.corder[i];
        const a = tris[i3], bb = tris[i3+1], cc = tris[i3+2];
        g.moveTo(sx[a], sy[a]);
        g.lineTo(sx[bb], sy[bb]);
        g.lineTo(sx[cc], sy[cc]);
        g.closePath();
      }
      const col = pal[(k/SHADE_N)|0][k % SHADE_N];
      g.fillStyle = col;
      // 线框：面照常填色，描边换成深色细线，一眼就能看出三角网有没有空洞
      g.strokeStyle = S.showWire ? 'rgba(6,20,28,.62)' : col;
      g.lineWidth = 1;
      g.lineJoin = 'bevel';   // 默认 miter 会让细长三角形的尖角飞出去变成白刺
      g.miterLimit = 1.4;
      g.fill();
      if(!lowQ) g.stroke();   // 描边填缝；拖拽时省略以保帧率
    }
  }

  // ---- 三角网边界勾边（成图范围轮廓） ----
  const segs = s.edgeSegs;
  if(segs && segs.length && doTri){
    g.beginPath();
    let has = false;
    for(let i=0;i<segs.length;i+=6){
      const x1 = segs[i], y1 = segs[i+1], z1 = segs[i+2]*zs;
      const x2 = segs[i+3], y2 = segs[i+4], z2 = segs[i+5]*zs;
      const dx1 = x1-ex, dy1 = y1-ey, dz1 = z1-ez;
      const c1 = dx1*fx + dy1*fy + dz1*fz;
      if(c1 < 0.5) continue;
      const dx2 = x2-ex, dy2 = y2-ey, dz2 = z2-ez;
      const c2 = dx2*fx + dy2*fy + dz2*fz;
      if(c2 < 0.5) continue;
      const k1 = focal/c1, k2 = focal/c2;
      g.moveTo(ccx + (dx1*rx + dy1*ry + dz1*rz)*k1, ccy - (dx1*ux + dy1*uy + dz1*uz)*k1);
      g.lineTo(ccx + (dx2*rx + dy2*ry + dz2*rz)*k2, ccy - (dx2*ux + dy2*uy + dz2*uz)*k2);
      has = true;
    }
    if(has){
      g.strokeStyle = 'rgba(226,240,255,.34)';
      g.lineWidth = 1;
      g.stroke();
    }
  }

  // ---- 等高线：直接在三角面上线性内插（CASS 的"DGM 内插等高线"） ----
  if(S.showContour && S.cntLevels && S.cntLevels.length) drawContourTIN(s, sx, sy, vis, zs);
}

/* ---- 三角网等高线：逐面在三条边上按高程线性内插 ---- */
function drawContourTIN(s, sx, sy, vis, zs){
  const tris = s.tris, ntri = s.ntri, pz = s.pz;
  const levels = S.cntLevels;
  const nlev = levels.length;
  const g = ctx;
  const p1 = new Path2D(), p2 = new Path2D();

  let ax = 0, ay = 0, bx = 0, by = 0;
  for(let t=0;t<ntri;t++){
    const i3 = 3*t;
    const a = tris[i3], b = tris[i3+1], c = tris[i3+2];
    if(!vis[a] || !vis[b] || !vis[c]) continue;
    const ha = pz[a], hb = pz[b], hc = pz[c];
    let mn = ha, mx = ha;
    if(hb < mn) mn = hb; if(hb > mx) mx = hb;
    if(hc < mn) mn = hc; if(hc > mx) mx = hc;
    if(mx - mn < 1e-9) continue;

    let lo = 0, hi = nlev-1, st = -1;
    while(lo <= hi){
      const md = (lo+hi)>>1;
      if(levels[md] <= mn) lo = md+1; else { st = md; hi = md-1; }
    }
    if(st < 0) continue;

    const xa = sx[a], ya = sy[a], xb = sx[b], yb = sy[b], xc = sx[c], yc = sy[c];

    for(let li=st; li<nlev; li++){
      const L = levels[li];
      if(L >= mx) break;
      let n = 0;
      // 三条边依次求交，正常情况恰好两点
      const d1 = ha - L, d2 = hb - L, d3 = hc - L;
      if(d1*d2 < 0){ const k = d1/(d1-d2); ax = xa + (xb-xa)*k; ay = ya + (yb-ya)*k; n = 1; }
      if(d2*d3 < 0 && n < 2){
        const k = d2/(d2-d3);
        if(n === 0){ ax = xb + (xc-xb)*k; ay = yb + (yc-yb)*k; n = 1; }
        else { bx = xb + (xc-xb)*k; by = yb + (yc-yb)*k; n = 2; }
      }
      if(d3*d1 < 0 && n < 2){
        const k = d3/(d3-d1);
        if(n === 0){ ax = xc + (xa-xc)*k; ay = yc + (ya-yc)*k; n = 1; }
        else { bx = xc + (xa-xc)*k; by = yc + (ya-yc)*k; n = 2; }
      }
      if(n !== 2) continue;
      const target = (li % 5 === 0) ? p2 : p1;
      target.moveTo(ax, ay);
      target.lineTo(bx, by);
    }
  }

  g.strokeStyle = 'rgba(255,255,255,.50)';
  g.lineWidth = 1;
  g.stroke(p1);
  g.strokeStyle = 'rgba(255,255,255,.92)';
  g.lineWidth = 1.7;
  g.stroke(p2);
}

function drawSurface(){
  const s = S.surf;
  if(!s) return;
  if(s.kind === 'tin'){ drawTIN(); return; }
  const res = s.res, nx = s.nx;
  const zs = S.zExag;

  const ex = V.eye.x, ey = V.eye.y, ez = V.eye.z;
  const fx = V.fx, fy = V.fy, fz = V.fz;
  const rx = V.rx, ry = V.ry, rz = V.rz;
  const ux = V.ux, uy = V.uy, uz = V.uz;
  const focal = V.focal, ccx = V.cx, ccy = V.cy;

  const vx = s.vx, vy = s.vy, vz = s.vz;
  const valid = s.valid, vis = s.vis;
  const sx = s.sx, sy = s.sy;
  const ci = s.ci;
  const total = nx*s.ny;

  // 顶点投影
  for(let k=0;k<total;k++){
    if(!valid[k]){ vis[k] = 0; continue; }
    const px = vx[k], py = vy[k], pz = vz[k]*zs;
    const ddx = px-ex, ddy = py-ey, ddz = pz-ez;
    const zc = ddx*fx + ddy*fy + ddz*fz;
    if(zc < 1){ vis[k] = 0; continue; }
    vis[k] = 1;
    const inv = focal/zc;
    sx[k] = ccx + (ddx*rx + ddy*ry + ddz*rz)*inv;
    sy[k] = ccy - (ddx*ux + ddy*uy + ddz*uz)*inv;
  }

  const pal = S.palShaded;
  const g = ctx;
  const doTri = S.showSurface;
  const cOff = s.cOff, cSeg = s.cSeg, cIdx = s.cIdx;
  const showC = S.showContour && !!cOff;

  // 抽稀策略：粗绘时三角形会覆盖邻格的等高线，故此时不画等高线（松手即恢复）
  const lowQ = S.dragging || S.spin;
  let step = (lowQ || res > 150) ? 2 : 1;
  const drawCnt = showC && (!doTri || !lowQ);
  if(drawCnt && doTri) step = 1;

  const dirX = ex > 0 ? 1 : -1;
  const dirY = ey > 0 ? 1 : -1;
  const LX = 0.42, LY = -0.36, LZ = 0.83;

  function tri(i1, i2, i3, colIdx){
    const x1 = vx[i1], y1 = vy[i1], z1 = vz[i1]*zs;
    const x2 = vx[i2], y2 = vy[i2], z2 = vz[i2]*zs;
    const x3 = vx[i3], y3 = vy[i3], z3 = vz[i3]*zs;
    const ax = x2-x1, ay = y2-y1, az = z2-z1;
    const bx = x3-x1, by = y3-y1, bz = z3-z1;
    let nvx = ay*bz - az*by;
    let nvy = az*bx - ax*bz;
    let nvz = ax*by - ay*bx;
    const len = Math.hypot(nvx, nvy, nvz) || 1;
    let dot = (nvx*LX + nvy*LY + nvz*LZ)/len;
    let sh = Math.round((dot*0.5 + 0.5)*(SHADE_N-1));
    if(sh < 0) sh = 0; else if(sh > SHADE_N-1) sh = SHADE_N-1;
    g.fillStyle = pal[colIdx][sh];
    g.strokeStyle = pal[colIdx][sh];
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(sx[i1], sy[i1]);
    g.lineTo(sx[i2], sy[i2]);
    g.lineTo(sx[i3], sy[i3]);
    g.closePath();
    g.fill();
    g.stroke();   // 描边填缝：消除相邻三角形的发丝接缝
  }

  /* 边界格裁剪：格内按"有效/无效"场的 0.5 等值线切开，只填有效一侧。
     相邻格共享角点取值，切口在格边上线性插值 → 边界是连续折线，不再是格点化的大台阶。 */
  const _src = new Int32Array(4);
  const _qx = new Float64Array(10), _qy = new Float64Array(10),
        _qz = new Float64Array(10);
  const _px = new Float64Array(10), _py = new Float64Array(10);

  function clipCell(i0, i1, i2, i3, colIdx){
    _src[0] = i0; _src[1] = i1; _src[2] = i2; _src[3] = i3;
    let m = 0;
    for(let k=0;k<4;k++){
      const ka = _src[k], kb = _src[(k+1) & 3];
      const va = valid[ka], vb = valid[kb];
      if(va){
        _qx[m] = vx[ka]; _qy[m] = vy[ka]; _qz[m] = vz[ka]*zs; m++;
      }
      if(va !== vb){
        const za = vz[ka]*zs, zb = vz[kb]*zs;
        _qx[m] = (vx[ka] + vx[kb])*0.5;
        _qy[m] = (vy[ka] + vy[kb])*0.5;
        _qz[m] = (za + zb)*0.5;
        m++;
      }
      if(m >= 9) break;
    }
    if(m < 3) return;

    // 投影（任一点在相机后方则整格放弃）
    for(let k=0;k<m;k++){
      const ddx = _qx[k]-ex, ddy = _qy[k]-ey, ddz = _qz[k]-ez;
      const zc = ddx*fx + ddy*fy + ddz*fz;
      if(zc < 1) return;
      const inv = focal/zc;
      _px[k] = ccx + (ddx*rx + ddy*ry + ddz*rz)*inv;
      _py[k] = ccy - (ddx*ux + ddy*uy + ddz*uz)*inv;
    }

    const ax = _qx[1]-_qx[0], ay = _qy[1]-_qy[0], az = _qz[1]-_qz[0];
    const bx = _qx[2]-_qx[0], by = _qy[2]-_qy[0], bz = _qz[2]-_qz[0];
    const nvx = ay*bz - az*by, nvy = az*bx - ax*bz, nvz = ax*by - ay*bx;
    const len = Math.hypot(nvx, nvy, nvz) || 1;
    const dot = (nvx*LX + nvy*LY + nvz*LZ)/len;
    let sh = Math.round((dot*0.5 + 0.5)*(SHADE_N-1));
    if(sh < 0) sh = 0; else if(sh > SHADE_N-1) sh = SHADE_N-1;
    g.fillStyle = pal[colIdx][sh];
    g.strokeStyle = pal[colIdx][sh];
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(_px[0], _py[0]);
    for(let k=1;k<m;k++) g.lineTo(_px[k], _py[k]);
    g.closePath();
    g.fill();
    g.stroke();
  }

  let _ax = 0, _ay = 0, _bx = 0, _by = 0;
  function seg2d(k){    const b = k*6;
    const dx1 = cSeg[b]-ex, dy1 = cSeg[b+1]-ey, dz1 = cSeg[b+2]*zs-ez;
    const c1 = dx1*fx + dy1*fy + dz1*fz;
    if(c1 < 1) return false;
    const k1 = focal/c1;
    _ax = ccx + (dx1*rx + dy1*ry + dz1*rz)*k1;
    _ay = ccy - (dx1*ux + dy1*uy + dz1*uz)*k1;

    const dx2 = cSeg[b+3]-ex, dy2 = cSeg[b+4]-ey, dz2 = cSeg[b+5]*zs-ez;
    const c2 = dx2*fx + dy2*fy + dz2*fz;
    if(c2 < 1) return false;
    const k2 = focal/c2;
    _bx = ccx + (dx2*rx + dy2*ry + dz2*rz)*k2;
    _by = ccy - (dx2*ux + dy2*uy + dz2*uz)*k2;
    return true;
  }

  function cellLines(j, i){
    const cell = j*res + i;
    const o0 = cOff[cell], o1 = cOff[cell+1];
    if(o1 <= o0) return;

    // 首曲线
    let has = false;
    for(let k=o0;k<o1;k++){
      if(cIdx[k]) continue;
      if(!seg2d(k)) continue;
      if(!has){ g.beginPath(); has = true; }
      g.moveTo(_ax, _ay); g.lineTo(_bx, _by);
    }
    if(has){
      g.strokeStyle = 'rgba(255,255,255,.50)';
      g.lineWidth = 1;
      g.stroke();
    }
    // 计曲线（每 5 条加粗提亮）
    has = false;
    for(let k=o0;k<o1;k++){
      if(!cIdx[k]) continue;
      if(!seg2d(k)) continue;
      if(!has){ g.beginPath(); has = true; }
      g.moveTo(_ax, _ay); g.lineTo(_bx, _by);
    }
    if(has){
      g.strokeStyle = 'rgba(255,255,255,.92)';
      g.lineWidth = 1.7;
      g.stroke();
    }
  }

  // 遍历顺序：远 → 近。曲面按 step 抽稀（仍完整覆盖），等高线逐格绘制
  for(let jj=0;jj<res;jj++){
    const j = dirY > 0 ? jj : (res-1-jj);
    const rowA = j*nx;
    const js = (j % step === 0) && (j <= res-step);
    for(let ii=0;ii<res;ii++){
      const i = dirX > 0 ? ii : (res-1-ii);
      if(doTri && js && (i % step === 0) && (i <= res-step)){
        const a = rowA + i;
        const b = a + step;
        const c = a + step*nx;
        const d = c + step;
        const da = valid[a], db = valid[b], dc = valid[c], dd = valid[d];
        if(da && db && dc && dd){
          if(vis[a] && vis[b] && vis[c] && vis[d]){
            tri(a, b, d, ci[a]);
            tri(a, d, c, ci[a]);
          }
        } else if(da || db || dc || dd){
          // 边界格（内部空白边缘）：按 0.5 等值线裁剪，避免格点化台阶
          if(vis[a] || vis[b] || vis[c] || vis[d]) clipCell(a, b, d, c, ci[a]);
        }
      }
      if(drawCnt) cellLines(j, i);
    }
  }
}

/* ---- 坐标轴指示器 ---- */
function drawGizmo(){
  const ox = V.w - 78, oy = 112, R = 30;
  ctx.save();

  // 背板
  ctx.beginPath();
  ctx.arc(ox, oy, R + 22, 0, 6.2832);
  ctx.fillStyle = 'rgba(11,16,23,.62)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.07)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.lineCap = 'round';
  ctx.font = '700 11px -apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const axes = [
    {x:1,y:0,z:0,c:'#ff7b72',t:'E',n:'东'},
    {x:0,y:1,z:0,c:'#6ab8ff',t:'N',n:'北'},
    {x:0,y:0,z:1,c:'#5ee08a',t:'H',n:'高'}
  ];
  for(const a of axes){
    const px = a.x*V.rx + a.y*V.ry + a.z*V.rz;
    const py = a.x*V.ux + a.y*V.uy + a.z*V.uz;
    const exx = ox + px*R, eyy = oy - py*R;
    ctx.strokeStyle = a.c;
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(exx, eyy); ctx.stroke();
    ctx.fillStyle = a.c;
    ctx.beginPath(); ctx.arc(exx, eyy, 3.2, 0, 6.2832); ctx.fill();
    ctx.fillText(a.t, exx + px*13, eyy - py*13);
  }
  ctx.beginPath();
  ctx.arc(ox, oy, 2.2, 0, 6.2832);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fill();
  ctx.restore();
}

let drag = null;

cv.addEventListener('contextmenu', e => e.preventDefault());

cv.addEventListener('pointerdown', e => {
  if(!S.loaded) return;
  cv.setPointerCapture(e.pointerId);
  drag = {
    x: e.clientX, y: e.clientY,
    pan: (e.button === 2 || e.button === 1 || e.shiftKey)
  };
  S.dragging = true;
  cv.classList.add('grabbing');
});

cv.addEventListener('pointermove', e => {
  if(!drag) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;

  if(drag.pan){
    const k = cam.dist * 0.0016;
    cam.target.x += (-dx*V.rx + dy*V.ux)*k;
    cam.target.y += (-dx*V.ry + dy*V.uy)*k;
    cam.target.z += (-dx*V.rz + dy*V.uz)*k;
  } else {
    cam.azim -= dx*0.0072;
    cam.elev = clamp(cam.elev + dy*0.0062, -1.54, 1.54);
  }
  requestRender();
});

function endDrag(e){
  if(!drag) return;
  drag = null;
  S.dragging = false;
  cv.classList.remove('grabbing');
  requestRender();
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

cv.addEventListener('wheel', e => {
  if(!S.loaded) return;
  e.preventDefault();
  const f = Math.exp(clamp(e.deltaY,-160,160)*0.0016);
  cam.dist = clamp(cam.dist*f, S.diag*0.02, S.diag*12);
  requestRender();
}, {passive:false});

cv.addEventListener('dblclick', () => {
  if(!S.loaded) return;
  fitView();
  requestRender();
  toast('视角已复位');
});

document.querySelectorAll('[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    if(!S.loaded) return;
    const v = btn.dataset.view;
    if(v === 'iso'){ cam.azim = Math.PI - 0.52; cam.elev = 0.60; }
    else if(v === 'top'){ cam.azim = Math.PI; cam.elev = 1.5533; }
    else if(v === 'front'){ cam.azim = Math.PI; cam.elev = 0.02; }
    else if(v === 'side'){ cam.azim = Math.PI/2; cam.elev = 0.02; }
    cam.dist = S.diag*1.35;
    requestRender();

});

const selA = $('selA'), selB = $('selB'), selC = $('selC');

function sampleOf(colIdx){
  const rows = S.rows;
  const lim = Math.min(rows.length, 40);
  for(let i=0;i<lim;i++){
    const v = rows[i][colIdx];
    if(Number.isFinite(v)) return String(v);
  }
  return '—';
}

function refreshMapUI(){
  const sels = [selA, selB, selC];
  const keys = ['a','b','c'];
  const options = S.numCols.map(j => {
    const s = sampleOf(j);
    const v = s.length > 12 ? s.slice(0,11)+'…' : s;
    return '<option value="'+j+'">第 '+(j+1)+' 列 · '+v+'</option>';
  }).join('');
  sels.forEach((sel, i) => {
    sel.innerHTML = options;
    sel.value = String(S.map[keys[i]]);
  });
}

/* ============================================================
   10. 文件读写
   ============================================================ */
function showLoading(on, txt){
  $('loadTxt').textContent = txt || '正在生成地形曲面…';
  $('loading').classList.toggle('show', !!on);
}

async function loadFile(file){
  if(!file) return;
  const low = file.name.toLowerCase();
  if(!/\.(dat|txt|csv|xyz|pts|asc)$/i.test(low)){
    toast('请选择 .dat / .txt / .csv 等文本格式文件');
    return;
  }
  showLoading(true, '正在读取文件…');
  try{
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8', {fatal:false}).decode(buf);
    if(text.indexOf('\uFFFD') >= 0){
      try{ text = new TextDecoder('gbk').decode(buf); }catch(err){}
    }
    showLoading(true, '正在解析并生成地形…');
    await new Promise(r => setTimeout(r, 30));
    ingest(text, file.name);
    showLoading(false);
    if(S.loaded) toast('已载入 ' + S.n.toLocaleString() + ' 个点');
  }catch(err){
    showLoading(false);
    console.error(err);
    toast('文件读取失败：' + err.message);
  }
}

$('btnOpen').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => {
  if(e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
  e.target.value = '';
});

/* ---- 拖拽 ---- */
const dragMask = $('dragover');
let dragDepth = 0;
window.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  if(dragDepth > 0) dragMask.classList.add('show');
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', e => {
  dragDepth--;
  if(dragDepth <= 0){ dragDepth = 0; dragMask.classList.remove('show'); }
});
window.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  dragMask.classList.remove('show');
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) loadFile(f);
});

/* ---- 导出模型：生成只读查看的独立 HTML ---- */
function escStr(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function exportModel(){
  if(!S.loaded || S.n < 3){ toast('请先载入数据'); return; }
  try{
    // 按当前列映射提取绝对坐标（东,北,高），保证导出与当前视图一致
    const a = S.map.a, b = S.map.b, c = S.map.c, rows = S.rows;
    const parts = [];
    for(let i=0;i<rows.length;i++){
      const r = rows[i];
      const A = r[a], B = r[b], C = r[c];
      if(Number.isFinite(A) && Number.isFinite(B) && Number.isFinite(C)) parts.push(A + ',' + B + ',' + C);
    }
    if(parts.length < 3){ toast('有效坐标点不足，无法导出'); return; }
    const data = parts.join('\n');
    const name = S.fileName || '未命名';
    const payload = JSON.stringify({
      data: data,
      name: name,
      cfg: {
        mode: S.mode, tinMinAngle: S.tinMinAngle, tinEdgeK: S.tinEdgeK, tinMaxEdge: S.tinMaxEdge,
        cntInterval: S.cntInterval, palette: S.palette, zExag: S.zExag,
        showCloud: S.showCloud, showBase: S.showBase, showSkirt: S.showSkirt, showWire: S.showWire,
        dense: S.dense, denseLen: S.denseLen, denseSmooth: S.denseSmooth,
        baseElev: S.baseElev
      }
    });
    // 打包当前整个页面（渲染引擎 + 样式），再注入内嵌数据与只读标志
    let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const inj = '\n<' + 'script>\nwindow.__EXPORT__ = ' + payload + ';\n</' + 'script>\n';
    html = html.replace(/<\/body>/i, inj + '</' + 'body>');
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const aEl = document.createElement('a');
    aEl.href = url;
    aEl.download = name.replace(/\.(dat|txt|csv)$/i, '') + '_三维模型.html';
    document.body.appendChild(aEl); aEl.click(); document.body.removeChild(aEl);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast('模型已导出（只读查看，' + parts.length.toLocaleString() + ' 点）');
  }catch(err){
    toast('导出失败：' + err.message);
  }
}
$('btnExport').addEventListener('click', exportModel);

/* ---- 只读模型模式（导出的 HTML 启动时进入）---- */
function buildReadonlyUI(){
  // 浮动视角按钮
  const bar = document.createElement('div');
  bar.id = 'roBar';
  const views = [['等轴','iso'],['俯视','top'],['正视','front'],['侧视','side']];
  views.forEach(([txt, v]) => {
    const btn = document.createElement('button');
    btn.textContent = txt;
    btn.addEventListener('click', () => {
      if(v === 'iso'){ cam.azim = Math.PI - 0.52; cam.elev = 0.60; }
      else if(v === 'top'){ cam.azim = Math.PI; cam.elev = 1.5533; }
      else if(v === 'front'){ cam.azim = Math.PI; cam.elev = 0.02; }
      else { cam.azim = Math.PI/2; cam.elev = 0.02; }
      cam.dist = S.diag*1.35;
      requestRender();
    });
    bar.appendChild(btn);
  });
  document.body.appendChild(bar);

  // 只读信息卡
  const info = document.createElement('div');
  info.id = 'roInfo';
  const rb = S.rawBox || {};
  const tin = S.tin;
  const spacing = tin ? tin.spacing : 0;
  const maxEdge = tin ? tin.maxEdge : 0;
  const cnt = S.cntInterval > 0 ? S.cntInterval : 0;
  const fmtH = v => (Math.abs(v) >= 1000 ? v.toFixed(2) : v.toFixed(3));
  let rows = '<div class="ro-t">模型信息</div>'
    + '<div class="ro-row"><span>文件</span><b>' + escStr(S.fileName || '') + '</b></div>'
    + '<div class="ro-row"><span>点数</span><b>' + S.n.toLocaleString() + '</b></div>'
    + '<div class="ro-row"><span>范围</span><b>' + (rb.e1 ? ((rb.e1-rb.e0).toFixed(1) + ' × ' + (rb.n1-rb.n0).toFixed(1) + ' m') : '—') + '</b></div>'
    + '<div class="ro-row"><span>高程</span><b>' + (rb.h0 !== undefined ? (fmtH(rb.h0) + ' ~ ' + fmtH(rb.h1) + ' m') : '—') + '</b></div>'
    + '<div class="ro-row"><span>高差</span><b>' + (rb.h1 !== undefined ? ((rb.h1-rb.h0).toFixed(2) + ' m') : '—') + '</b></div>'
    + (tin ? '<div class="ro-row"><span>三角网</span><b>' + tin.ntri.toLocaleString() + ' 面</b></div>' : '')
    + (spacing > 0 ? '<div class="ro-row"><span>点距</span><b>' + spacing.toFixed(2) + ' m</b></div>' : '')
    + (maxEdge > 0 ? '<div class="ro-row"><span>间隔</span><b>' + maxEdge.toFixed(0) + ' m</b></div>' : '')
    + '<div class="ro-row"><span>等高距</span><b>' + (cnt > 0 ? cnt + ' m' : '—') + '</b></div>';
  // 挖填方（复用已算好的 baseInfo 内容）
  const baseEl = $('baseInfo');
  if(baseEl && baseEl.innerHTML && baseEl.textContent.indexOf('载入数据') < 0){
    rows += '<div class="ro-t" style="margin-top:6px">挖填方</div>'
      + '<div class="bstats">' + baseEl.innerHTML + '</div>';
  }
  info.innerHTML = rows;
  document.body.appendChild(info);
}

function startReadonly(exp){
  const c = exp.cfg || {};
  S.mode = (c.mode === 'grid') ? 'grid' : 'tin';
  S.tinMinAngle = c.tinMinAngle || 10;
  S.tinEdgeK = c.tinEdgeK || 6;
  S.tinMaxEdge = c.tinMaxEdge || 0;
  S.cntInterval = (c.cntInterval > 0) ? c.cntInterval : 0.5;
  S.palette = c.palette || 'terrain';
  S.showCloud = !!c.showCloud;
  S.showBase = (c.showBase !== false);
  S.showSkirt = (c.showSkirt !== false);
  S.showWire = !!c.showWire;
  S.dense = !!c.dense;
  S.denseLen = (c.denseLen > 0) ? c.denseLen : 0;
  S.denseSmooth = (typeof c.denseSmooth === 'number') ? c.denseSmooth : 0.5;
  buildPalette(S.palette);
  // 隐藏编辑控件，只保留信息条与复位视角
  ['side','btnOpen','btnDemo','btnShot','btnExport','help'].forEach(id => { const el = $(id); if(el) el.style.display = 'none'; });
  const sm = document.querySelector('.brand small'); if(sm) sm.textContent = '只读模型';
  // 载入数据（内部已完成 buildScene/buildContours/updateBaseInfo/fitView）
  ingest(exp.data, exp.name);
  // 覆盖自动缩放与基准面，保持导出时的一致外观
  if(c.zExag && c.zExag > 0) S.zExag = c.zExag;
  if(typeof c.baseElev === 'number') S.baseElev = c.baseElev;
  updateBaseInfo();
  buildReadonlyUI();
  requestRender();
}

   12. 启动

// 数字步进：上下箭头放在输入框外（不隐藏箭头、不挤占框内数字）
function spinNumber(inp, dir){
  if(inp.disabled || inp.readOnly) return;
  const step = parseFloat(inp.step) || 1;
  const min = (inp.min !== '' && inp.min != null) ? parseFloat(inp.min) : -Infinity;
  const max = (inp.max !== '' && inp.max != null) ? parseFloat(inp.max) : Infinity;
  const cur = parseFloat(inp.value);
  let v;
  if(inp.value === '' || isNaN(cur)){
    v = dir > 0 ? (min > 0 ? min : step) : (isFinite(max) ? max : 0);
  } else {
    v = cur + dir * step;
  }
  v = Math.min(Math.max(v, min), max);
  v = parseFloat(v.toFixed(10));
  inp.value = v;
  inp.dispatchEvent(new Event('input', {bubbles:true}));
  inp.dispatchEvent(new Event('change', {bubbles:true}));
}
function setupSpinners(){
  document.querySelectorAll('input[type=number]').forEach(inp => {
    if(inp.closest('.spinbox')) return;
    const box = document.createElement('div'); box.className = 'spinbox';
    const col = document.createElement('div'); col.className = 'spn';
    const up = document.createElement('button'); up.type = 'button'; up.tabIndex = -1;
    up.title = '增加'; up.textContent = '▲';
    const dn = document.createElement('button'); dn.type = 'button'; dn.tabIndex = -1;
    dn.title = '减少'; dn.textContent = '▼';
    col.appendChild(up); col.appendChild(dn);
    inp.parentNode.insertBefore(box, inp);
    box.appendChild(inp); box.appendChild(col);
    up.addEventListener('click', () => spinNumber(inp, 1));
    dn.addEventListener('click', () => spinNumber(inp, -1));
    const sync = () => { up.disabled = dn.disabled = inp.disabled; };
    sync();
    new MutationObserver(sync).observe(inp, {attributes:true, attributeFilter:['disabled']});
  });
}

// 启动：导出模型为只读查看；否则载入示例数据（?empty=1 可跳过）
function boot(){
  setupSpinners();
  if(window.__EXPORT__){
    startReadonly(window.__EXPORT__);
  } else if(!/[?&]empty=1/.test(location.search)){
    $('btnDemo').click();
  }
}
setTimeout(boot, 120);

})();
