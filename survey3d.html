<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测绘数据三维可视化系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f14'/%3E%3Cpath d='M9 46 L23 22 L36 35 L55 15' stroke='%2322d3ee' stroke-width='4.5' fill='none' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#080b10;color:#dbe4ee;font-size:13px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#wrap{position:fixed;inset:0}
#cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#cv.grabbing{cursor:grabbing}

/* ---------- 顶栏 ---------- */
#top{
  position:absolute;top:0;left:0;right:0;height:52px;z-index:12;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  background:linear-gradient(180deg,rgba(8,11,16,.97),rgba(8,11,16,.55));
  border-bottom:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600;letter-spacing:.3px}
.brand svg{width:22px;height:22px;display:block}
.brand small{
  font-size:10.5px;font-weight:400;color:#22d3ee;background:rgba(34,211,238,.12);
  border:1px solid rgba(34,211,238,.25);padding:1px 6px;border-radius:20px;letter-spacing:.5px;
}
.spacer{flex:1}

/* 顶栏数据信息条 */
#topInfo{
  flex:1 1 auto;display:flex;align-items:center;gap:13px;min-width:0;
  overflow:hidden;white-space:nowrap;font-size:11.5px;
  padding-left:6px;
}
#topInfo .ti{display:inline-flex;align-items:baseline;gap:5px;flex:0 0 auto}
#topInfo .ti i{font-style:normal;color:#5a6a7d;font-size:11px;letter-spacing:.3px}
#topInfo .ti b{
  color:#d5ecf4;font-weight:600;font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.2px;
}
#topInfo .ti.file b{color:#7dd3e8;max-width:170px;overflow:hidden;text-overflow:ellipsis}
#topInfo .dv{width:1px;height:13px;background:rgba(255,255,255,.1);flex:0 0 1px}
@media (max-width:1180px){ #topInfo .ti.opt{display:none} #topInfo .dv.opt{display:none} }
@media (max-width:900px){ #topInfo{display:none} }
.tbtn{
  display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:7px;color:#c8d4e2;font-size:12.5px;font-family:inherit;cursor:pointer;
  transition:.16s;white-space:nowrap;
}
.tbtn:hover{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.45);color:#e6f7fb}
.tbtn:active{transform:translateY(1px)}
.tbtn.primary{background:linear-gradient(135deg,#0e7490,#0891b2);border-color:transparent;color:#fff;font-weight:500}
.tbtn.primary:hover{filter:brightness(1.15)}
.tbtn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- 侧栏 ---------- */
#side{
  position:absolute;top:58px;left:14px;width:344px;z-index:11;
  max-height:calc(100% - 74px);overflow-y:auto;overscroll-behavior:contain;
  background:rgba(16,22,30,.9);border:1px solid rgba(255,255,255,.09);
  border-radius:12px;padding:6px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  transition:opacity .2s;
}
#side::-webkit-scrollbar{width:7px}
#side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
#side::-webkit-scrollbar-track{background:transparent}
.sec{padding:6px 8px 8px;border-bottom:1px solid rgba(255,255,255,.055)}
.sec:last-child{border-bottom:none}
.sec-h{
  font-size:10.5px;font-weight:600;color:#6b7a8d;letter-spacing:1.4px;
  text-transform:uppercase;margin-bottom:5px;
}
.meta{font-size:11.5px;color:#8fa0b4;line-height:1.75;word-break:break-all}
.sec.collapse>.sec-h{cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.sec.collapse>.sec-h:hover{color:#8fa0b4}
.sec-h .cv{font-style:normal;font-size:9px;color:#5d6e82;transition:transform .18s;transform:rotate(0deg)}
.sec.collapse.closed>.sec-h .cv{transform:rotate(-90deg)}
.sec.collapse.closed>.sec-body{display:none}
.sec.collapse.closed>.sec-h{margin-bottom:0}
.meta b{color:#22d3ee;font-weight:600}
.meta .k{color:#64748b}
label.fld{display:block;margin-bottom:7px}
label.fld>span{display:block;font-size:11.5px;color:#8fa0b4;margin-bottom:3px}
.fld-i{display:flex;align-items:center;gap:7px;margin-bottom:6px;cursor:pointer}
.fld-i>span{flex:0 0 60px;font-size:11.5px;color:#8fa0b4}
.fld-i select,.fld-i input{flex:1;min-width:0}
select,button.act{
  width:100%;height:28px;border-radius:6px;font-family:inherit;font-size:12px;
  color:#dbe4ee;background:#1a222c;border:1px solid rgba(255,255,255,.1);
  padding:0 7px;cursor:pointer;outline:none;transition:.15s;
}
select:hover,button.act:hover{border-color:rgba(34,211,238,.42)}
select:focus{outline:1px solid rgba(34,211,238,.5)}
button.act{display:flex;align-items:center;justify-content:center;gap:5px}
button.act+.act{margin-top:6px}
button.act.primary{background:linear-gradient(135deg,#0e7490,#0891b2);border-color:transparent;color:#fff}
button.act.primary:hover{filter:brightness(1.15)}
button.act:disabled{opacity:.35;cursor:not-allowed;filter:none}

.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#c3d0de;cursor:pointer;padding:2px 0;user-select:none}
.chk input{
  appearance:none;-webkit-appearance:none;width:15px;height:15px;flex:0 0 15px;
  border:1.5px solid #3b4a5c;border-radius:4px;background:#141c25;cursor:pointer;
  position:relative;transition:.15s;
}
.chk input:checked{background:#0891b2;border-color:#0891b2}
.chk input:checked::after{
  content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);
}
.chk:hover input{border-color:#22d3ee}

.rng{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.rng .rh{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#8fa0b4;margin-bottom:0;flex:0 0 64px}
.rng .rh b{color:#7dd3e8;font-weight:600;font-variant-numeric:tabular-nums}
.rng input[type=range]{flex:1;min-width:0}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;
  background:linear-gradient(90deg,#0891b2,#164e63);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:#e6f7fb;border:2px solid #0891b2;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.5);
}
input[type=number]{
  width:100%;height:28px;border-radius:6px;font-family:inherit;font-size:12px;
  color:#dbe4ee;background:#1a222c;border:1px solid rgba(255,255,255,.1);
  padding:0 8px;outline:none;transition:.15s;
  font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;appearance:textfield;
}
input[type=number]:hover{border-color:rgba(34,211,238,.42)}
input[type=number]:focus{border-color:#22d3ee;outline:1px solid rgba(34,211,238,.5)}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* 数字上下步进箭头放在输入框外（自定义按钮，不挤占框内数字） */
.spinbox{display:flex;align-items:stretch;gap:3px;flex:1 1 auto;min-width:0}
.spinbox input[type=number]{flex:1;min-width:0}
.spinbox .spn{display:flex;flex-direction:column;flex:0 0 20px;gap:2px}
.spinbox .spn button{
  flex:1;min-height:0;padding:0;border:1px solid rgba(255,255,255,.15);
  background:#1b2430;color:#7dd3e8;font-size:8px;line-height:1;cursor:pointer;
  border-radius:4px;display:flex;align-items:center;justify-content:center;transition:.15s;
}
.spinbox .spn button:hover{background:rgba(34,211,238,.18);border-color:rgba(34,211,238,.5);color:#e6f7fb}
.spinbox .spn button:active{background:rgba(34,211,238,.3);color:#fff}
.spinbox .spn button:disabled{opacity:.35;cursor:default}
.row2{display:flex;gap:6px;align-items:center}
.row2 button.act{width:58px;flex:0 0 58px;padding:0}
.cntinfo{font-size:11.5px;color:#8fa0b4;margin-top:5px;line-height:1.5}
.cntinfo b{color:#22d3ee;font-weight:600;font-variant-numeric:tabular-nums}
.bstats{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin-top:7px;font-size:11px;color:#8fa0b4}
.bstats span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bstats b{color:#22d3ee;font-weight:600;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid2 button,.grid4 button{
  height:28px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;
  background:#1a222c;color:#c3d0de;border:1px solid rgba(255,255,255,.1);transition:.15s;
}
.grid4 button{font-size:11.5px;padding:0}
.grid2 button:hover,.grid4 button:hover{background:rgba(34,211,238,.13);border-color:rgba(34,211,238,.42);color:#e6f7fb}
.grid2 button.on{background:rgba(34,211,238,.18);border-color:#22d3ee;color:#a5f3fc}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.chkrow{display:flex;gap:14px;align-items:center}
.grid3 button{
  height:25px;border-radius:6px;font-size:11.5px;font-family:inherit;cursor:pointer;
  background:#1a222c;color:#a9b8c8;border:1px solid rgba(255,255,255,.09);transition:.15s;padding:0;
}
.grid3 button:hover{background:rgba(34,211,238,.13);border-color:rgba(34,211,238,.42);color:#e6f7fb}
button.mini{height:26px;border-radius:6px;font-size:11px;font-family:inherit;cursor:pointer;background:#1a222c;color:#a9b8c8;border:1px solid rgba(255,255,255,.09);padding:0 7px;transition:.15s;flex:0 0 auto;white-space:nowrap}
button.mini:hover{background:rgba(34,211,238,.13);border-color:rgba(34,211,238,.42);color:#e6f7fb}

/* ---------- 空状态 ---------- */
#empty{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;z-index:5;
  pointer-events:none;transition:opacity .3s;
}
#empty.hide{opacity:0;pointer-events:none}
#empty .eic{font-size:42px;color:#1e4b5c;line-height:1;margin-bottom:4px}
#empty h2{font-size:17px;font-weight:500;color:#7c8ea3;letter-spacing:.5px}
#empty p{font-size:12.5px;color:#526275}
#empty .eg{
  margin-top:14px;font-size:11.5px;color:#465568;font-family:Consolas,Monaco,monospace;
  background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.09);
  padding:8px 16px;border-radius:8px;line-height:1.9;text-align:center;
}

/* ---------- 拖拽遮罩 ---------- */
#dragover{
  position:absolute;inset:0;z-index:30;display:none;
  align-items:center;justify-content:center;
  background:rgba(5,20,28,.82);border:2px dashed #22d3ee;border-radius:0;
  backdrop-filter:blur(3px);
}
#dragover.show{display:flex}
#dragover div{font-size:16px;color:#a5f3fc;letter-spacing:1px}

/* ---------- 提示 ---------- */
#toast{
  position:absolute;left:50%;bottom:34px;transform:translate(-50%,14px);
  background:rgba(16,22,30,.96);border:1px solid rgba(34,211,238,.4);
  color:#c8f0f8;padding:9px 18px;border-radius:9px;font-size:12.5px;z-index:40;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 28px rgba(0,0,0,.6);
  max-width:70vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 右下角操作提示 ---------- */
#help{
  position:absolute;right:14px;bottom:14px;z-index:10;
  font-size:11px;color:#5d6e82;text-align:right;line-height:1.9;
  pointer-events:none;user-select:none;
  background:rgba(11,16,23,.45);padding:7px 11px;border-radius:9px;
  border:1px solid rgba(255,255,255,.05);
}
#help b{color:#8fa0b4;font-weight:600}

/* ---------- 加载 ---------- */
#loading{
  position:absolute;inset:0;z-index:35;display:none;align-items:center;justify-content:center;
  background:rgba(6,9,13,.7);backdrop-filter:blur(2px);
}
#loading.show{display:flex}
#loading .box{display:flex;flex-direction:column;align-items:center;gap:12px}
#loading .sp{
  width:30px;height:30px;border:2.5px solid rgba(34,211,238,.2);
  border-top-color:#22d3ee;border-radius:50%;animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
#loading span{font-size:12.5px;color:#7dd3e8;letter-spacing:.5px}

@media (max-width:820px){
  #side{width:288px;transform:scale(.96);transform-origin:top left}
  #help{display:none}
}

/* 只读模型视图（导出模型后显示）：浮动视角按钮 + 只读信息卡 */
#roBar{
  position:absolute;right:16px;bottom:16px;z-index:20;display:flex;gap:6px;
}
#roBar button{
  height:30px;padding:0 13px;border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;
  background:rgba(20,28,38,.82);color:#c3d0de;border:1px solid rgba(255,255,255,.14);
  transition:.15s;
}
#roBar button:hover{background:rgba(34,211,238,.16);border-color:rgba(34,211,238,.5);color:#e6f7fb}
#roInfo{
  position:absolute;left:16px;bottom:16px;z-index:20;min-width:190px;padding:10px 12px;
  border-radius:10px;background:rgba(16,22,30,.86);border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:11.5px;color:#8fa0b4;line-height:1.75;
}
#roInfo .ro-t{font-size:10px;color:#5a6a7d;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:2px}
#roInfo b{color:#22d3ee;font-weight:600;font-variant-numeric:tabular-nums}
#roInfo .ro-row{display:flex;justify-content:space-between;gap:14px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="top">
    <div class="brand">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0e7490"/><path d="M9 46 L23 22 L36 35 L55 15" stroke="#a5f3fc" stroke-width="4.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>
      测绘数据三维可视化系统 <small>V1.0.12</small>
    </div>
    <div id="topInfo">
      <span class="ti file"><i>文件</i><b id="tiFile">未载入</b></span>
      <span class="dv"></span>
      <span class="ti"><i>点数</i><b id="tiN">—</b></span>
      <span class="dv"></span>
      <span class="ti"><i>范围</i><b id="tiRange">—</b></span>
      <span class="dv opt"></span>
      <span class="ti opt"><i>高程</i><b id="tiH">—</b></span>
      <span class="dv"></span>
      <span class="ti"><i>高差</i><b id="tiDh">—</b></span>
    </div>
    <div class="spacer" style="flex:0 0 4px"></div>
    <button class="tbtn primary" id="btnOpen">导入 DAT</button>
    <button class="tbtn" id="btnDemo">示例数据</button>
    <button class="tbtn" id="btnShot" disabled>导出图片</button>
    <button class="tbtn" id="btnExport" disabled>导出模型</button>
    <button class="tbtn" id="btnReset" disabled>复位视角</button>
  </div>

  <div id="side">
    <div class="sec collapse closed" id="secMap">
      <div class="sec-h" id="hdrMap">坐标列映射<i class="cv">▼</i></div>
      <div class="sec-body">
        <label class="fld-i"><span>东 / 横</span><select id="selA"></select></label>
        <label class="fld-i"><span>北 / 纵</span><select id="selB"></select></label>
        <label class="fld-i"><span>高程 Z</span><select id="selC"></select></label>
        <button class="act" id="btnSwap" style="margin-top:2px">⇄ 交换坐标 1 / 2</button>
      </div>
    </div>

    <div class="sec collapse">
      <div class="sec-h">成图规则<i class="cv">▼</i></div>
      <div class="sec-body">
        <label class="fld" style="margin-bottom:6px"><span>算法</span>
          <select id="selMode">
            <option value="tin">三角网 DTM（南方 CASS）</option>
            <option value="grid">规则格网 IDW</option>
          </select>
        </label>
        <div id="tinBox">
          <div class="row2" style="margin-bottom:5px">
            <label class="fld-i" style="flex:1;margin-bottom:0">
              <span style="flex:0 0 56px;font-size:11px">连接距离</span>
              <input type="number" id="numMaxEdge" min="0" step="5" placeholder="自动" title="三角网最大连接边长（米）。相隔超过该距离的两点不建立三角形；留空或填 0 = 按实测点距自动取值。">
            </label>
            <button class="mini" id="btnMaxAuto" title="按实测点距自动取值">自动</button>
          </div>
          <div class="row2">
            <label class="fld-i"><span>最小内角 °</span><input type="number" id="numAngle" min="0" max="45" step="1" value="10"></label>
            <label class="fld-i"><span>长宽比 ≤</span><input type="number" id="numEdge" min="1" max="60" step="1" value="6"></label>
          </div>
          <div class="cntinfo" id="tinInfo">三角网 —</div>
          <label class="chk" style="margin-top:4px" title="显示三角网线框，可直接看出有没有空洞"><input type="checkbox" id="chkWire"> 三角网线框</label>
          <label class="chk" style="margin-top:4px" title="在稀疏实测点之间密集内插高程点，使三角网更密、三维表面显示更平缓（仅影响显示，实测点与挖填方量算不变）"><input type="checkbox" id="chkDense"> 密集内插（更平缓）</label>
          <div id="denseBox" style="display:none;margin-top:5px">
            <label class="fld-i" style="margin-bottom:6px"><span>内插边长 m</span><input type="number" id="numDenseLen" min="0" step="0.5" placeholder="自动" title="内插目标边长（米）：超过该长度的三角网边会在中点插入新点细分。留空/0 = 按实测点距自动。"></label>
            <label class="fld-i" style="margin-bottom:0"><span style="flex:0 0 66px">平滑强度</span><input type="number" id="numDenseSmooth" min="0" max="1" step="0.1" value="0.5" title="平滑强度 0~1：0 = 纯线性仅加密，1 = 最强平滑，越大表面越圆润。"></label>
          </div>
          <div class="cntinfo" id="denseInfo" style="display:none">—</div>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h">显示设置</div>
      <div class="chkrow">
        <label class="chk"><input type="checkbox" id="chkCloud"> 点云</label>
        <label class="chk"><input type="checkbox" id="chkSurf" checked> 地形曲面</label>
      </div>

      <label class="chk" style="margin-top:4px" title="勾选后：周围没有测点的空白区域不绘制（多块测区之间留白）；不勾选则整片铺满"><input type="checkbox" id="chkHole"> 无数据区留空</label>
      <label class="chk" style="margin-top:2px"><input type="checkbox" id="chkCnt"> 显示等高线</label>
      <div class="row2" style="margin-top:5px">
        <input type="number" id="numCnt" min="0.01" step="0.5" value="0.5" title="等高距（米）">
        <button class="act" id="btnCntAuto" title="按高差自动计算等高距">自动</button>
      </div>
      <div class="cntinfo" id="cntInfo" style="margin-top:5px">等高距 —</div>
      <div class="rng" style="margin-top:5px"><div class="rh"><span>曲面精度</span><b id="vRes">100</b></div><input type="range" id="rngRes" min="40" max="200" step="10" value="100"></div>
      <div class="rng"><div class="rh"><span>垂直夸张</span><b id="vZ">1.0×</b></div><input type="range" id="rngZ" min="1" max="20" step="0.5" value="1"></div>
      <label class="fld" style="margin-bottom:0"><span>高程配色</span>
        <select id="selPal">
          <option value="terrain">地形色（推荐）</option>
          <option value="satellite">卫星影像（模拟谷歌地球）</option>
          <option value="geology">真实地质（岩层色）</option>
          <option value="rainbow">彩虹色</option>
          <option value="viridis">Viridis</option>
          <option value="blue">冷蓝</option>
          <option value="gray">灰度</option>
        </select>
      </label>
    </div>

    <div class="sec">
      <div class="sec-h">视角</div>
      <div class="grid4">
        <button data-view="iso">等轴</button>
        <button data-view="top">俯视</button>
        <button data-view="front">正视</button>
        <button data-view="side">侧视</button>
      </div>
      <div style="height:5px"></div>
      <label class="chk"><input type="checkbox" id="chkSpin"> 自动旋转</label>
    </div>

    <div class="sec">
      <div class="sec-h">基准面</div>
      <div class="chkrow">
        <label class="chk"><input type="checkbox" id="chkBase" checked> 基准面</label>
        <label class="chk"><input type="checkbox" id="chkSkirt" checked> 侧面填充</label>
      </div>
      <div style="margin-top:5px">
        <input type="number" id="numBase" step="0.5" placeholder="基准高程 m" title="基准面高程（米）" disabled>
      </div>
      <div style="height:5px"></div>
      <div class="grid4">
        <button id="btnBaseDef" disabled title="恢复默认基准高程（最低点向下 10 m）">默认</button>
        <button id="btnBaseMin" disabled>最低点</button>
        <button id="btnBaseAvg" disabled>平均</button>
        <button id="btnBaseMax" disabled>最高点</button>
      </div>
      <div class="bstats" id="baseInfo"><span>载入数据后显示挖填方量</span></div>
    </div>
  </div>

  <div id="empty">
    <div class="eic">◈</div>
    <h2>拖拽测绘数据文件到窗口</h2>
    <p>支持 .dat / .txt / .csv，自动识别坐标列</p>
    <div class="eg">
      <div>1,500000.123,3200000.456,251.330</div>
      <div>2,500012.884,3200008.017,252.104</div>
    </div>
  </div>

  <div id="dragover"><div>松开鼠标即可载入数据</div></div>

  <div id="help">
    <b>左键拖拽</b> 旋转视角<br>
    <b>滚轮</b> 缩放 · <b>右键 / Shift+左键</b> 平移<br>
    <b>双击</b> 复位视角 · <b>拖文件</b> 换数据
  </div>

  <div id="loading"><div class="box"><div class="sp"></div><span id="loadTxt">正在生成地形曲面…</span></div></div>
  <div id="toast"></div>
  <input type="file" id="fileInput" accept=".dat,.txt,.csv,.xyz,.pts,.asc" style="display:none">
</div>

<script>
(function(){
'use strict';

/* ============================================================
   1. 基础工具
   ============================================================ */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const clampInt = (v,a,b) => v<a?a:(v>b?b:v);

function toNum(s){
  if(typeof s !== 'string') return NaN;
  s = s.trim();
  if(!s) return NaN;
  if(s[0]==='"' || s[0]==="'") s = s.replace(/^["']+|["']+$/g,'');
  const v = Number(s);
  return Number.isFinite(v) ? v : NaN;
}

function hex2rgb(h){
  h = h.replace('#','');
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
}
function mixRgb(a,b,t){
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
}

let toastTimer = 0;
function toast(msg, ms){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), ms || 2200);
}

/* ============================================================
   2. 全局状态
   ============================================================ */
const S = {
  n: 0,
  rows: [],          // 每行数值（NaN 占位）
  numCols: [],       // 数值列索引
  map: {a:-1, b:-1, c:-1},
  wx: null, wy: null, wz: null, ci: null,  // 东 / 北 / 高程（居中）+ 色索引
  box: {x0:0,x1:1,y0:0,y1:1,z0:0,z1:1},    // 居中后的包围盒（x=东 y=北 z=高）
  hspan: 1, diag: 1,
  showCloud: false, showSurface: true, showWire: false,
  showContour: false, cntInterval: 0.5, cntIv: 0.5, cntLevels: [],
  showBase: true, showSkirt: true, showHole: false, baseElev: 0, zCenter: 0,
  mode: 'tin',                       // 'tin' = 三角网 DTM（CASS 规则）；'grid' = 规则格网 IDW
  tinMinAngle: 10, tinEdgeK: 6, tin: null, tinSpacing: 0,   // 最小内角(°) / 超长边倍数阈值
  tinMaxEdge: 0,                     // 最大连接边长(m)：相隔超过此距离的两点不建三角网；0 = 按点距自动
  dense: false, denseLen: 0, denseSmooth: 0.5,   // 密集内插(更平缓)：开关 / 目标边长(m,0=按点距自动) / 平滑强度0~1
  pointSize: 1.8, surfaceRes: 100, zExag: 1,
  palette: 'terrain', spin: false, dragging: false,
  surf: null, drawIdx: null, drawN: 0,
  palBase: null, palShaded: null,
  fileName: '', loaded: false
};

const cam = {
  azim: Math.PI - 0.52,
  elev: 0.60,
  dist: 10,
  target: {x:0,y:0,z:0},
  fov: 42*Math.PI/180
};

const V = {
  eye:{x:0,y:0,z:0},
  rx:0,ry:0,rz:0,
  ux:0,uy:0,uz:0,
  fx:0,fy:0,fz:0,
  focal:1, w:0, h:0, cx:0, cy:0
};

/* ============================================================
   3. 调色板
   ============================================================ */
const PALETTES = {
  /* 陆地测高配色：低地绿→草原黄→坡地褐→峰顶浅白（不出现假水体） */
  terrain: [[0.00,'#14514a'],[0.10,'#1d6b52'],[0.22,'#3d8a5c'],[0.35,'#6ba368'],
            [0.47,'#9db96a'],[0.58,'#c7c464'],[0.68,'#dcc25e'],[0.78,'#d2a35a'],
            [0.87,'#bb8b60'],[0.93,'#c3a07c'],[0.97,'#cfb99d'],[1.00,'#ded4c0']],
  /* 模拟谷歌地球卫星影像：林地→草地→旱地→裸土→岩体→雪线（仅极低处带一点水体色） */
  satellite: [[0.00,'#173a2a'],[0.09,'#1c4529'],[0.20,'#24522d'],[0.32,'#2f6131'],
              [0.44,'#427139'],[0.55,'#5c8142'],[0.65,'#7d8f48'],[0.74,'#9d9a4e'],
              [0.81,'#ab9257'],[0.87,'#a1866a'],[0.93,'#a8a297'],[0.97,'#c4beb2'],[1.00,'#dcd8cc']],
  /* 模拟三维地质体：深灰岩→紫褐→砖红→赭石→土黄→灰绿→浅灰 */
  geology:   [[0.00,'#4b4b54'],[0.10,'#5e4a48'],[0.20,'#77514a'],[0.31,'#8c5c47'],
              [0.42,'#9c6f4d'],[0.53,'#a88559'],[0.64,'#a8976c'],[0.75,'#909579'],
              [0.86,'#9a958b'],[1.00,'#c2bbad']],
  rainbow: [[0.00,'#3b4cc0'],[0.22,'#5fa8e8'],[0.42,'#4ec36b'],[0.62,'#e8d84b'],
            [0.82,'#ef7d3d'],[1.00,'#c0392b']],
  viridis: [[0.00,'#440154'],[0.25,'#3b528b'],[0.50,'#21918c'],[0.75,'#5ec962'],[1.00,'#fde725']],
  blue:    [[0.00,'#08243f'],[0.50,'#1d7fb8'],[1.00,'#b6ecff']],
  gray:    [[0.00,'#20252c'],[1.00,'#f0f4f8']]
};

const PAL_N = 64, SHADE_N = 16;

function buildPalette(name){
  const stops = PALETTES[name] || PALETTES.terrain;
  const base = new Array(PAL_N);
  const rgbArr = new Array(PAL_N);
  for(let i=0;i<PAL_N;i++){
    const t = i/(PAL_N-1);
    let k = 0;
    while(k < stops.length-2 && t > stops[k+1][0]) k++;
    const [t0,c0] = stops[k];
    const [t1,c1] = stops[k+1];
    const u = t1 > t0 ? clamp((t-t0)/(t1-t0),0,1) : 0;
    const rgb = mixRgb(hex2rgb(c0), hex2rgb(c1), u);
    rgbArr[i] = rgb;
    base[i] = 'rgb('+(rgb[0]|0)+','+(rgb[1]|0)+','+(rgb[2]|0)+')';
  }
  // 预生成明暗表
  const shaded = new Array(PAL_N);
  for(let i=0;i<PAL_N;i++){
    const r0 = rgbArr[i][0], g0 = rgbArr[i][1], b0 = rgbArr[i][2];
    const row = new Array(SHADE_N);
    for(let s=0;s<SHADE_N;s++){
      const k = 0.55 + (s/(SHADE_N-1))*0.67;   // 0.55 ~ 1.22（上限收一点，避免亮色过曝成纯白）
      row[s] = 'rgb('+clampInt(r0*k,0,255)+','+clampInt(g0*k,0,255)+','+clampInt(b0*k,0,255)+')';
    }
    shaded[i] = row;
  }
  S.palBase = base;
  S.palShaded = shaded;
}

/* ============================================================
   4. 画布 / 相机
   ============================================================ */
const wrap = $('wrap');
const cv = $('cv');
const ctx = cv.getContext('2d', {alpha:false});

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = wrap.clientWidth || window.innerWidth;
  const h = wrap.clientHeight || window.innerHeight;
  cv.width = Math.round(w*dpr);
  cv.height = Math.round(h*dpr);
  cv.style.width = w+'px';
  cv.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  V.w = w; V.h = h; V.cx = w/2; V.cy = h/2;
  V.focal = (h/2) / Math.tan(cam.fov/2);
  requestRender();
}

function updateCamera(){
  // Z-up 坐标系：x = 东，y = 北，z = 高程
  const ce = Math.cos(cam.elev), se = Math.sin(cam.elev);
  const ca = Math.cos(cam.azim), sa = Math.sin(cam.azim);
  const r = cam.dist;
  V.eye.x = cam.target.x + r*ce*sa;
  V.eye.y = cam.target.y + r*ce*ca;
  V.eye.z = cam.target.z + r*se;

  let fx = cam.target.x - V.eye.x;
  let fy = cam.target.y - V.eye.y;
  let fz = cam.target.z - V.eye.z;
  const L = Math.hypot(fx,fy,fz) || 1;
  fx /= L; fy /= L; fz /= L;
  V.fx = fx; V.fy = fy; V.fz = fz;

  // right = forward × up_world(0,0,1)
  let rx = fy, ry = -fx, rz = 0;
  const rl = Math.hypot(rx,ry,rz) || 1;
  rx /= rl; ry /= rl; rz /= rl;
  V.rx = rx; V.ry = ry; V.rz = rz;

  // up = right × forward
  V.ux = ry*fz - rz*fy;
  V.uy = rz*fx - rx*fz;
  V.uz = rx*fy - ry*fx;

  V.focal = (V.h/2) / Math.tan(cam.fov/2);
}

let pendingFrame = false;
function requestRender(){
  if(pendingFrame) return;
  pendingFrame = true;
  requestAnimationFrame(()=>{ pendingFrame = false; render(); });
}

/* ============================================================
   5. 解析 DAT
   ============================================================ */
const MAX_ROWS = 400000;

function ingest(text, name){
  const t0 = performance.now();
  const lines = text.split(/\r\n|\r|\n/);
  const rows = [];
  const colNum = [];
  const colTot = [];
  let linesUsed = 0;

  for(let li=0; li<lines.length && rows.length < MAX_ROWS; li++){
    let ln = lines[li];
    if(!ln) continue;
    ln = ln.trim();
    if(!ln) continue;
    if(ln.charCodeAt(0) === 35 || (ln[0]==='/' && ln[1]==='/')) continue; // # //
    // 逗号/分号分隔时保留空字段，避免 "点号,,东,北,高" 这类空列导致列错位
    const sep = (ln.indexOf(',') >= 0 || ln.indexOf(';') >= 0) ? /[,;\t]/ : /\s+/;
    const toks = ln.split(sep);
    const arr = [];
    let any = false;
    for(let j=0;j<toks.length;j++){
      const s = toks[j].trim();
      if(!s){ arr.push(NaN); continue; }
      colTot[j] = (colTot[j]||0)+1;
      const v = toNum(s);
      if(Number.isFinite(v)){ colNum[j] = (colNum[j]||0)+1; arr.push(v); any = true; }
      else arr.push(NaN);
    }
    if(!any || arr.length < 2) continue;
    rows.push(arr);
    linesUsed++;
  }

  if(rows.length === 0){ toast('文件中没有解析到数值数据'); return; }

  // 找出数值列
  const numCols = [];
  const nc = colTot.length;
  for(let j=0;j<nc;j++){
    const tot = colTot[j] || 1;
    if((colNum[j]||0)/tot > 0.75 && tot >= rows.length*0.75) numCols.push(j);
  }
  if(numCols.length < 3){
    toast('识别到的数值列不足 3 列，无法构成三维坐标');
    return;
  }

  S.rows = rows;
  S.numCols = numCols;
  S.fileName = name || '未命名';
  S.baseTouched = false;    // 新数据重新取最低点作基准

  // 默认：最后三列 → 东 / 北 / 高程（兼容 点号,Y,X,H 与 Y,X,H 等常见格式）
  const m = numCols.length;
  S.map.a = numCols[m-3];
  S.map.b = numCols[m-2];
  S.map.c = numCols[m-1];

  refreshMapUI();
  buildFromMap(true);
  showLoading(false);
  const dt = Math.round(performance.now()-t0);
  console.log('[解析] 行数='+rows.length+' 列数='+nc+' 数值列='+numCols.length+' 用时='+dt+'ms');
}

/* ============================================================
   6. 由列映射构建点集
   ============================================================ */
/* 估算平均点距（最近邻距离）：抽样计算，大数据用面积密度近似 */
function estimateSpacing(){
  const n = S.n, wx = S.wx, wy = S.wy;
  if(n < 3) return 1;
  if(n <= 4000){
    const step = Math.max(1, Math.floor(n/300));
    let sum = 0, cnt = 0;
    for(let t=0;t<n;t+=step){
      let best = Infinity;
      for(let q=0;q<n;q++){
        if(q === t) continue;
        const ddx = wx[q]-wx[t], ddy = wy[q]-wy[t];
        const d2 = ddx*ddx + ddy*ddy;
        if(d2 < best) best = d2;
      }
      if(best < Infinity){ sum += Math.sqrt(best); cnt++; }
    }
    if(cnt) return Math.max(1e-6, sum/cnt);
  }
  const b = S.box;
  return Math.max(1e-6, Math.sqrt(Math.abs((b.x1-b.x0)*(b.y1-b.y0))/n));
}

function buildFromMap(autoScale){
  const a = S.map.a, b = S.map.b, c = S.map.c;
  if(a < 0 || b < 0 || c < 0) return;

  const rows = S.rows;
  const total = rows.length;
  let wx = new Float32Array(total);   // 东
  let wy = new Float32Array(total);   // 北
  let wz = new Float32Array(total);   // 高程

  let e0=Infinity,e1=-Infinity,n0=Infinity,n1=-Infinity,h0=Infinity,h1=-Infinity;
  let cnt = 0;
  for(let i=0;i<total;i++){
    const r = rows[i];
    const A = r[a], B = r[b], C = r[c];
    if(!Number.isFinite(A) || !Number.isFinite(B) || !Number.isFinite(C)) continue;
    wx[cnt] = A;
    wy[cnt] = B;
    wz[cnt] = C;
    if(A<e0) e0=A; if(A>e1) e1=A;
    if(B<n0) n0=B; if(B>n1) n1=B;
    if(C<h0) h0=C; if(C>h1) h1=C;
    cnt++;
  }

  if(cnt < 3){ toast('有效坐标点不足（' + cnt + ' 个）'); return; }
  if(cnt !== total){
    wx = wx.subarray(0,cnt); wy = wy.subarray(0,cnt); wz = wz.subarray(0,cnt);
  }

  const ce = (e0+e1)/2, cn = (n0+n1)/2, ch = (h0+h1)/2;
  const hspan = (h1-h0) || 1;
  const ci = new Uint8Array(cnt);

  for(let i=0;i<cnt;i++){
    ci[i] = clampInt(Math.round((wz[i] - h0)/hspan*(PAL_N-1)), 0, PAL_N-1);
    wx[i] -= ce;
    wy[i] -= cn;
    wz[i] -= ch;
  }

  S.n = cnt;
  S.wx = wx; S.wy = wy; S.wz = wz; S.ci = ci;
  S.box = {x0:e0-ce, x1:e1-ce, y0:n0-cn, y1:n1-cn, z0:h0-ch, z1:h1-ch};
  S.hspan = hspan;
  S.zCenter = ch;
  S.rawBox = {e0:e0, e1:e1, n0:n0, n1:n1, h0:h0, h1:h1};

  const dE = e1-e0, dN = n1-n0;
  S.diag = Math.max(Math.hypot(dE, dN), hspan) || 1;

  // 抽稀绘制索引
  const stride = Math.max(1, Math.ceil(cnt / 90000));
  S.drawN = 0;
  const idx = new Int32Array(Math.ceil(cnt/stride));
  for(let i=0;i<cnt;i+=stride) idx[S.drawN++] = i;
  S.drawIdx = idx;

  // 垂直夸张：让高差占视图约 22%
  if(autoScale){
    const xySpan = Math.max(dE, dN) || 1;
    let zx = (xySpan*0.22)/hspan;
    zx = Math.min(12, Math.max(1, zx));
    S.zExag = Math.round(zx*2)/2;
    $('rngZ').value = S.zExag;
    $('vZ').textContent = S.zExag.toFixed(1)+'×';

    // 曲面精度：按实际点距自适应。网格步长取约 0.7 倍点距，
    // 测区边界与空洞边界就不会被切成大台阶；上限再按点数控制，避免大数据卡顿。
    const sp = estimateSpacing();
    const span = Math.max(dE, dN) || 1;
    let ar = Math.round(span/(sp*0.7));
    const cap = clampInt(Math.round(6.0*Math.sqrt(cnt)), 80, 160);
    ar = clampInt(ar, 60, Math.max(60, cap));
    S.surfaceRes = ar;
    $('rngRes').value = ar;
    $('vRes').textContent = ar;
  }

  S.loaded = true;
  $('empty').classList.add('hide');
  setTimeout(() => { $('empty').style.display = 'none'; }, 340);
  $('btnShot').disabled = false;
  $('btnExport').disabled = false;
  $('btnReset').disabled = false;

  // 基准面：无历史设置时默认取「最低点向下 10 m」
  if(!S.baseTouched){
    S.baseElev = Math.round((h0 - 10)*100)/100;   // 默认落在最低点向下 10 m，侧壁才有足够进深
    $('numBase').value = S.baseElev.toFixed(2);
  }
  $('numBase').disabled = false;
  $('btnBaseDef').disabled = false;
  $('btnBaseMin').disabled = false;
  $('btnBaseAvg').disabled = false;
  $('btnBaseMax').disabled = false;

  updateInfo();
  buildScene();
  buildContours();
  updateBaseInfo();
  fitView();
  requestRender();

  // 周围无测点的区域占比很大时，提示可以只显示实测范围（多测区分离）
  if(S.mode === 'grid' && !S.showHole && S.invalidRatio > 0.32){
    setTimeout(() => toast('周围无测点区域较大：勾选左侧「无数据区留空」可只绘制实测范围', 3600), 1500);
  }
}

function updateInfo(){
  const b = S.rawBox;
  if(!b){ return; }
  const fmt = v => (Math.abs(v) >= 1000 ? v.toFixed(2) : v.toFixed(3));
  const w = (b.e1-b.e0), d = (b.n1-b.n0), hh = (b.h1-b.h0);
  const nm = S.fileName || '未命名';
  $('tiFile').textContent = nm.length > 20 ? nm.slice(0,18)+'…' : nm;
  $('tiFile').title = nm;
  $('tiN').textContent = S.n.toLocaleString();
  $('tiRange').textContent = w.toFixed(1) + ' × ' + d.toFixed(1) + ' m';
  $('tiH').textContent = fmt(b.h0) + ' ~ ' + fmt(b.h1) + ' m';
  $('tiDh').textContent = hh.toFixed(2) + ' m';
}

function fitView(){
  cam.target = {x:0,y:0,z:0};
  cam.dist = S.diag * 1.5;
  cam.azim = Math.PI - 0.52;   // 东南方向俯视
  cam.elev = 0.60;
}

/* ============================================================
   6b. 三角网 DTM（南方 CASS 成图规则）的数学内核
   —— Delaunay 三角剖分：三角网顶点就是实测高程点，网外不插值，
      所以成图范围天然等于三角网覆盖范围，无数据区不会插出假地形。
   ============================================================ */
/* ============================================================
   Delaunay 三角剖分（增量插入 + walk 定位 + BFS 空腔重连）
   与南方 CASS「建立 DTM」等价的核心算法：三角网顶点为实测点，
   三角网外不插值，因此天然形成「无数据区不出图」的成图范围。
   输入：px, py（东/北坐标）、n 点数
   输出：{ tris: Int32Array（逆时针顶点索引×3）, ntri }
   ============================================================ */
function delaunayTIN(px, py, n){
  if(n < 3) return null;

  // ---- 1. 归一化到 [0,1]（大坐标直接用双精度算外接圆会丢精度）----
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for(let i=0;i<n;i++){
    const a = px[i], b = py[i];
    if(a < x0) x0 = a; if(a > x1) x1 = a;
    if(b < y0) y0 = b; if(b > y1) y1 = b;
  }
  const span = Math.max(x1-x0, y1-y0) || 1;
  const sc = 1/span;

  // ---- 2. 去重（网格桶，避免重合点破坏拓扑）----
  const keep = new Int32Array(n);
  let m = 0;
  {
    const g = Math.max(4, Math.min(512, Math.round(Math.sqrt(n))));
    const buckets = new Int32Array(g*g).fill(-1);
    const nextIdx = new Int32Array(n).fill(-1);
    const cellX = (x1-x0 || 1)/g, cellY = (y1-y0 || 1)/g;
    const tol = span*1e-7, tol2 = tol*tol;
    for(let i=0;i<n;i++){
      let gx = Math.floor((px[i]-x0)/cellX); if(gx<0)gx=0; if(gx>=g)gx=g-1;
      let gy = Math.floor((py[i]-y0)/cellY); if(gy<0)gy=0; if(gy>=g)gy=g-1;
      let dup = false;
      for(let oy=-1; oy<=1 && !dup; oy++){
        const yy = gy+oy; if(yy<0||yy>=g) continue;
        for(let ox=-1; ox<=1 && !dup; ox++){
          const xx = gx+ox; if(xx<0||xx>=g) continue;
          let q = buckets[yy*g+xx];
          while(q >= 0){
            const dx = px[i]-px[q], dy = py[i]-py[q];
            if(dx*dx+dy*dy <= tol2){ dup = true; break; }
            q = nextIdx[q];
          }
        }
      }
      if(dup) continue;
      const k = gy*g+gx;
      nextIdx[i] = buckets[k];
      buckets[k] = i;
      keep[m++] = i;
    }
  }
  if(m < 3) return null;

  // ---- 3. 归一化坐标 + Morton 序插入（提高 walk 的局部性）----
  const ux = new Float64Array(m+3);
  const uy = new Float64Array(m+3);
  for(let k=0;k<m;k++){
    const p = keep[k];
    ux[k] = (px[p]-x0)*sc;
    uy[k] = (py[p]-y0)*sc;
  }
  // 超级三角形（包住 [0,1]²）
  ux[m] = -64;  uy[m] = -64;
  ux[m+1] = 64; uy[m+1] = -64;
  ux[m+2] = 0;  uy[m+2] = 64;

  const order = new Int32Array(m);
  {
    // Morton（Z 序）10 bit：沿空间相邻的顺序插入，walk 命中率高
    const qq = 1023;
    const key = new Float64Array(m);
    const idx = new Array(m);
    for(let k=0;k<m;k++){
      let ix = Math.floor(ux[k]*qq); if(ix<0)ix=0; if(ix>qq)ix=qq;
      let iy = Math.floor(uy[k]*qq); if(iy<0)iy=0; if(iy>qq)iy=qq;
      let kk = 0;
      for(let b=0;b<10;b++){
        kk |= ((ix>>b)&1) * Math.pow(2, 2*b);
        kk |= ((iy>>b)&1) * Math.pow(2, 2*b+1);
      }
      key[k] = kk;
      idx[k] = k;
    }
    idx.sort((a,b) => key[a]-key[b]);
    for(let k=0;k<m;k++) order[k] = idx[k];
  }

  // ---- 4. 增量插入 ----
  const maxT = m*3 + 64;      // 存活三角形约 2n，留余量
  const tv = new Int32Array(maxT*3);
  const he = new Int32Array(maxT*3).fill(-1);
  const dead = new Uint8Array(maxT);
  const stamp = new Int32Array(maxT);
  const freeT = new Int32Array(maxT);   // 空腔腾出的槽位复用，避免无限增长
  let freeN = 0;
  let stampId = 0;
  let nt = 1;
  tv[0] = m; tv[1] = m+1; tv[2] = m+2;

  const ori = (ax,ay,bx,by,cx,cy) => (bx-ax)*(cy-ay) - (by-ay)*(cx-ax);

  function inCircle(ax,ay,bx,by,cx,cy,pxx,pyy){
    const dx = ax-pxx, dy = ay-pyy;
    const ex = bx-pxx, ey = by-pyy;
    const fx = cx-pxx, fy = cy-pyy;
    return (dx*dx+dy*dy)*(ex*fy-fx*ey)
         - (ex*ex+ey*ey)*(dx*fy-fx*dy)
         + (fx*fx+fy*fy)*(dx*ey-ex*dy);
  }

  let last = 0;
  let maxDeg = 0;
  const stack = new Int32Array(Math.max(64, m*2));
  const cavity = new Int32Array(Math.max(64, m*2));
  const mapNew = new Int32Array(m+3).fill(-1);
  let mapStamp = new Int32Array(m+3);
  let mapId = 0;

  for(let oi=0; oi<m; oi++){
    const p = order[oi];
    const pxx = ux[p], pyy = uy[p];

    // --- walk 定位包含 p 的三角形 ---
    let t = last;
    let guard = 0;
    const lim = 8*m + 256;
    while(true){
      const i0 = tv[3*t], i1 = tv[3*t+1], i2 = tv[3*t+2];
      const o0 = ori(ux[i0],uy[i0], ux[i1],uy[i1], pxx,pyy);
      const o1 = ori(ux[i1],uy[i1], ux[i2],uy[i2], pxx,pyy);
      const o2 = ori(ux[i2],uy[i2], ux[i0],uy[i0], pxx,pyy);
      if(o0 >= 0 && o1 >= 0 && o2 >= 0) break;
      let nt2 = -1;
      if(o0 < 0) nt2 = he[3*t];
      else if(o1 < 0) nt2 = he[3*t+1];
      else nt2 = he[3*t+2];
      if(nt2 < 0 || dead[(nt2/3)|0] || ++guard > lim) break;   // 兜底：就地重定位
      t = (nt2/3)|0;
    }
    // 极端兜底：暴力找（极少数退化触发）
    {
      const i0 = tv[3*t], i1 = tv[3*t+1], i2 = tv[3*t+2];
      const ok = ori(ux[i0],uy[i0], ux[i1],uy[i1], pxx,pyy) >= -1e-12 &&
                 ori(ux[i1],uy[i1], ux[i2],uy[i2], pxx,pyy) >= -1e-12 &&
                 ori(ux[i2],uy[i2], ux[i0],uy[i0], pxx,pyy) >= -1e-12;
      if(!ok){
        for(let q=0;q<nt;q++){
          if(dead[q]) continue;
          const j0 = tv[3*q], j1 = tv[3*q+1], j2 = tv[3*q+2];
          if(ori(ux[j0],uy[j0], ux[j1],uy[j1], pxx,pyy) >= -1e-12 &&
             ori(ux[j1],uy[j1], ux[j2],uy[j2], pxx,pyy) >= -1e-12 &&
             ori(ux[j2],uy[j2], ux[j0],uy[j0], pxx,pyy) >= -1e-12){ t = q; break; }
        }
      }
    }

    // --- BFS 收集"外接圆含 p"的空腔 ---
    stampId++;
    let sp = 0, nc = 0;
    stamp[t] = stampId; stack[sp++] = t;
    while(sp > 0){
      const ct = stack[--sp];
      cavity[nc++] = ct;
      for(let e=0;e<3;e++){
        const h = he[3*ct+e];
        if(h < 0) continue;
        const ht = (h/3)|0;
        if(dead[ht] || stamp[ht] === stampId) continue;
        const a0 = tv[3*ht], a1 = tv[3*ht+1], a2 = tv[3*ht+2];
        const det = inCircle(ux[a0],uy[a0], ux[a1],uy[a1], ux[a2],uy[a2], pxx,pyy);
        if(det > 0){
          stamp[ht] = stampId;
          if(sp >= stack.length){ break; }
          stack[sp++] = ht;
        }
      }
    }
    if(nc > maxDeg) maxDeg = nc;


    // --- 标记空腔（槽位回收）---
    for(let k=0;k<nc;k++){
      const c = cavity[k];
      dead[c] = 1;
      if(freeN < maxT) freeT[freeN++] = c;
    }

    mapId++;
    let lastNew = -1;
    let nb = 0;

    // 第一遍：只读收集空腔的边界面（此时绝不能写 tv/he —— 新三角形会复用空腔槽位）
    const bnd = [];
    for(let k=0;k<nc;k++){
      const ct = cavity[k];
      for(let e=0;e<3;e++){
        const h = he[3*ct+e];
        if(h >= 0 && stamp[(h/3)|0] === stampId) continue;   // 空腔内部边
        const a = tv[3*ct+e], b = tv[3*ct+(e+1)%3];
        if(a === b) continue;
        bnd.push(a, b, h);
      }
    }
    nb = bnd.length/3;
    const newTri = new Int32Array(nb);

    // 第二遍：分配槽位（优先复用刚回收的）并建 (a,b,p)
    for(let k=0, j=0; k<bnd.length; k+=3, j++){
      const a = bnd[k], b = bnd[k+1], hh = bnd[k+2];
      let ni;
      if(freeN > 0) ni = freeT[--freeN];
      else if(nt < maxT) ni = nt++;
      else break;
      tv[3*ni] = a; tv[3*ni+1] = b; tv[3*ni+2] = p;
      he[3*ni] = hh; he[3*ni+1] = -1; he[3*ni+2] = -1;
      dead[ni] = 0;
      if(hh >= 0) he[hh] = 3*ni;
      mapNew[a] = ni; mapStamp[a] = mapId;
      newTri[j] = ni;
      lastNew = ni;
    }

    // 第三遍：环上相邻新三角形互链 —— (a,b,p) 的 b→p ↔ (b,c,p) 的 p→b
    for(let k=0, j=0; k<bnd.length; k+=3, j++){
      const b = bnd[k+1], ni = newTri[j];
      if(mapStamp[b] === mapId && ni >= 0){
        const nj = mapNew[b];
        he[3*ni+1] = 3*nj+2;
        he[3*nj+2] = 3*ni+1;
      }
    }

    if(nb > 0) last = lastNew;
  }

  // ---- 5. 丢弃含超级顶点的三角形，压缩输出 ----
  let outN = 0;
  for(let t=0;t<nt;t++){
    if(dead[t]) continue;
    if(tv[3*t] >= m || tv[3*t+1] >= m || tv[3*t+2] >= m) continue;
    outN++;
  }
  const out = new Int32Array(outN*3);
  let w = 0;
  for(let t=0;t<nt;t++){
    if(dead[t]) continue;
    if(tv[3*t] >= m || tv[3*t+1] >= m || tv[3*t+2] >= m) continue;
    out[w++] = keep[tv[3*t]];
    out[w++] = keep[tv[3*t+1]];
    out[w++] = keep[tv[3*t+2]];
  }
  return { tris: out, ntri: outN, used: m, maxDeg: maxDeg };
}


/* 显示用点数上限：三角面在屏幕上若只有 1~2 像素，除了拖慢渲染
   只会把曲面糊成噪点（子像素走样）。超过上限时按网格保留高程极值点抽稀，
   山脊、沟谷这些特征点不会丢。 */
const AUTO_EDGE_K = 15;            // 自动连接距离 = 实测点距 × 该倍数
const MAX_TIN_PTS = 25000;
const MAX_DENSE_V = 30000;           // 密集内插后顶点上限：防大数据加密后卡死

function decimateIdx(wx, wy, wz, n, target){
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for(let i=0;i<n;i++){
    const a = wx[i], b = wy[i];
    if(a < x0) x0 = a; if(a > x1) x1 = a;
    if(b < y0) y0 = b; if(b > y1) y1 = b;
  }
  const g = Math.max(2, Math.round(Math.sqrt(target/2)));
  const cellX = (x1-x0 || 1)/g, cellY = (y1-y0 || 1)/g;
  const lo = new Int32Array(g*g).fill(-1);
  const hi = new Int32Array(g*g).fill(-1);
  for(let i=0;i<n;i++){
    let gx = Math.floor((wx[i]-x0)/cellX); if(gx < 0) gx = 0; if(gx >= g) gx = g-1;
    let gy = Math.floor((wy[i]-y0)/cellY); if(gy < 0) gy = 0; if(gy >= g) gy = g-1;
    const k = gy*g + gx;
    const a = lo[k];
    if(a < 0 || wz[i] < wz[a]) lo[k] = i;
    const b = hi[k];
    if(b < 0 || wz[i] > wz[b]) hi[k] = i;
  }
  const out = [];
  for(let k=0;k<g*g;k++){
    const a = lo[k];
    if(a < 0) continue;
    out.push(a);
    const b = hi[k];
    if(b >= 0 && b !== a) out.push(b);
  }
  return out;
}

/* ============================================================
   7a. 按南方 CASS 规则建立 DTM
   ① Delaunay 构网（三角网全部顶点为实测点）
   ② 过滤三角形：最小内角（默认 10°，CASS 默认值）+ 最大边长
      （跨越无数据区的狭长三角形会被剔除 → 多测区自然分离）
   ③ 逐面算坡度（供光照）与分层设色索引
   ④ 提取三角网边界边（供侧面填充与范围勾边）
   ============================================================ */
function buildTIN(){
  S.tin = null;
  S.surf = null;
  const n = S.n;
  if(n < 6) return;

  const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();

  let wx = S.wx, wy = S.wy, wz = S.wz, np = n, decimated = false;
  if(n > MAX_TIN_PTS){
    let pick = decimateIdx(S.wx, S.wy, S.wz, n, MAX_TIN_PTS);
    // 数据只占包围盒一部分时格网会大量落空，点数远低于目标：放大格网补一次
    if(pick.length > 0 && pick.length < MAX_TIN_PTS*0.7){
      const boost = Math.min(4, Math.sqrt(MAX_TIN_PTS/Math.max(1, pick.length)));
      pick = decimateIdx(S.wx, S.wy, S.wz, n, MAX_TIN_PTS*boost*boost);
    }
    if(pick.length >= 6 && pick.length < n){
      np = pick.length;
      wx = new Float64Array(np);
      wy = new Float64Array(np);
      wz = new Float64Array(np);
      for(let i=0;i<np;i++){
        const q = pick[i];
        wx[i] = S.wx[q]; wy[i] = S.wy[q]; wz[i] = S.wz[q];
      }
      decimated = true;
    }
  }

  const r = delaunayTIN(wx, wy, np);
  if(!r || r.ntri < 2) return;

  const tris0 = r.tris, nt0 = r.ntri;

  // ---- CASS 过滤参数 ----
  // 超长边阈值按 CASS 的规矩取"最小边长 × 倍数"：先用抽样估全网点距
  // （取各三角形最短边的中位数），再乘倍数。跨越无数据区的长边会被剔除，
  // 多个测区之间就不会被几条细长三角形连成假地形。
  let spacing = 0;
  {
    const step = Math.max(1, Math.floor(nt0/6000));
    const samp = [];
    for(let t=0;t<nt0;t+=step){
      const a = tris0[3*t], b = tris0[3*t+1], c = tris0[3*t+2];
      const ax = wx[a], ay = wy[a], bx = wx[b], by = wy[b], cx = wx[c], cy = wy[c];
      const lab = (bx-ax)*(bx-ax) + (by-ay)*(by-ay);
      const lac = (cx-ax)*(cx-ax) + (cy-ay)*(cy-ay);
      const lbc = (cx-bx)*(cx-bx) + (cy-by)*(cy-by);
      samp.push(Math.sqrt(lab < lac ? (lab < lbc ? lab : lbc) : (lac < lbc ? lac : lbc)));
    }
    if(samp.length){ samp.sort((p, q) => p - q); spacing = samp[samp.length >> 1]; }
  }
  const edgeK = Math.max(1, S.tinEdgeK || 6);
  const edgeK2 = edgeK * edgeK;

  // ---- 最大连接边长（V1.0.7）----
  // 形状判据只看"长边/短边"的比值，对一块形状匀称、但整块都跨在大空白上的
  // 大三角形无能为力 —— 两块测区之间就会残留一根几十上百米的尖刺。
  // 这里再按"绝对距离"切一刀：任意一边超过 maxEdge 的三角形不建。
  // 用户可在侧栏直接填米数；留空/填 0 时按实测点距自动取值。
  const autoMaxEdge = spacing > 0 ? Math.round(spacing*AUTO_EDGE_K*10)/10 : 0;
  const maxEdge = (S.tinMaxEdge > 0) ? S.tinMaxEdge : autoMaxEdge;
  const maxE2 = (maxEdge > 0) ? maxEdge*maxEdge : Infinity;

  const angDeg = Math.max(0, Math.min(45, S.tinMinAngle));
  const cosMin = Math.cos(angDeg * Math.PI / 180);
  const cosMin2 = cosMin * cosMin;

  const keep = new Uint8Array(nt0);
  const reason = new Uint8Array(nt0);        // 1 = 长宽比剔除，2 = 最小内角剔除
  let nKeep = 0, cutEdge = 0, cutAngle = 0;
  for(let t=0;t<nt0;t++){
    const a = tris0[3*t], b = tris0[3*t+1], c = tris0[3*t+2];
    const ax = wx[a], ay = wy[a];
    const bx = wx[b], by = wy[b];
    const cx = wx[c], cy = wy[c];
    const abx = bx-ax, aby = by-ay;
    const acx = cx-ax, acy = cy-ay;
    const bcx = cx-bx, bcy = cy-by;
    const lab = abx*abx + aby*aby;
    const lac = acx*acx + acy*acy;
    const lbc = bcx*bcx + bcy*bcy;
    // CASS「过滤三角形」：同一三角形内 最长边 / 最短边 超过倍数即剔除。
    // 用局部比值而不是绝对边长，稀疏区的大三角形只要形状规整就保留，
    // 只剔除跨越无数据区的细长"假桥"。
    {
      const mnb = lab < lac ? (lab < lbc ? lab : lbc) : (lac < lbc ? lac : lbc);
      const mxb = lab > lac ? (lab > lbc ? lab : lbc) : (lac > lbc ? lac : lbc);
      if(mnb > 1e-12 && mxb > mnb*edgeK2){ reason[t] = 1; cutEdge++; continue; }
    }
    if(cosMin2 > 0){
      // 余弦判据（免开方）：夹角余弦 > cosMin ⇔ 整数平方比较
      const dA = abx*acx + aby*acy;              // ∠A 夹 ab、ac
      if(dA > 0 && dA*dA > cosMin2*lab*lac){ reason[t] = 2; cutAngle++; continue; }
      const dB = -abx*bcx - aby*bcy;             // ∠B 夹 ba、bc
      if(dB > 0 && dB*dB > cosMin2*lab*lbc){ reason[t] = 2; cutAngle++; continue; }
      const dC = -acx*bcx - acy*bcy;             // ∠C 夹 ca、cb
      if(dC > 0 && dC*dC > cosMin2*lac*lbc){ reason[t] = 2; cutAngle++; continue; }
    }
    keep[t] = 1;
    nKeep++;
  }

  /* ---- 洞块分析 + 碎洞回填（V1.0.6）----------------------------------
     剔除三角形必然在网里留下空洞。两块真实测区之间的空白区**应当**留空，
     但被最小内角 / 长宽比判据误删出来的"碎洞、边缘凹口"必须补回来，
     否则地形上会凭空冒出几个窟窿——这是 V1.0.5 最明显的毛病。

     判据用「洞心到最近实测点的距离 / 点距」：
       · 凹口、碎洞 —— 中心紧贴实测点（实测两套样本 ≤ 1.90 倍点距）
       · 真空区   —— 中心离最近测点很远（实测 ≥ 12.86 倍点距）
     两档之间有 6 倍以上余量，取 6 倍点距为界。按"整洞"一起决策，
     不逐三角形判断，避免真空区边缘被啃成锯齿。                       */
  let holeCount = 0, refillHole = 0, refillTri = 0;
  {
    // 只给被剔除三角形建边表（数量少，Map 负担轻）；值编码两片三角形下标：
    // v = p*E2 + (q+1)，q = -1 表示该边只有一片
    const E2 = 2097152;
    const em2 = new Map();
    for(let t=0;t<nt0;t++){
      if(keep[t]) continue;
      for(let k=0;k<3;k++){
        const a = tris0[3*t+k], b = tris0[3*t+(k+1)%3];
        const key = a < b ? a*np + b : b*np + a;
        const v = em2.get(key);
        if(v === undefined) em2.set(key, t*E2);
        else em2.set(key, Math.floor(v/E2)*E2 + (t+1));
      }
    }

    const seen = new Uint8Array(nt0);
    const stack = new Int32Array(nt0);
    const comp = new Int32Array(nt0);
    const lim2 = (spacing*6)*(spacing*6);

    for(let t0=0;t0<nt0;t0++){
      if(keep[t0] || seen[t0]) continue;
      let sp = 0, cn = 0, sumX = 0, sumY = 0;
      stack[sp++] = t0; seen[t0] = 1;
      while(sp > 0){
        const u = stack[--sp];
        comp[cn++] = u;
        const a0 = tris0[3*u], b0 = tris0[3*u+1], c0 = tris0[3*u+2];
        sumX += wx[a0] + wx[b0] + wx[c0];
        sumY += wy[a0] + wy[b0] + wy[c0];
        for(let k=0;k<3;k++){
          const a = tris0[3*u+k], b = tris0[3*u+(k+1)%3];
          const key = a < b ? a*np + b : b*np + a;
          const v = em2.get(key);
          if(v === undefined) continue;
          const p = Math.floor(v/E2), q = v - p*E2 - 1;
          if(p !== u && !seen[p]){ seen[p] = 1; stack[sp++] = p; }
          if(q >= 0 && q !== u && !seen[q]){ seen[q] = 1; stack[sp++] = q; }
        }
      }
      holeCount++;
      // 洞心（按三角形重心算术平均）到最近实测点的距离
      const hx = sumX/(cn*3), hy = sumY/(cn*3);
      let near = false;
      for(let i=0;i<np;i++){
        const dx = wx[i]-hx, dy = wy[i]-hy;
        if(dx*dx + dy*dy <= lim2){ near = true; break; }
      }
      if(!near) continue;                 // 真空区：保持留空
      refillHole++;
      for(let q=0;q<cn;q++){
        const u = comp[q];
        if(keep[u]) continue;
        keep[u] = 1; nKeep++; refillTri++;
        if(reason[u] === 1) cutEdge--; else if(reason[u] === 2) cutAngle--;
      }
    }
  }
  /* ---- 第二阶段：最大连接边长过滤（V1.0.7）--------------------------
     形状判据只看比值，对"形状匀称但整块跨在大空白上"的长三角形无能为力，
     两块测区之间就会残留一根几十上百米的尖刺。这里按绝对距离再切一刀。
     注意**不回填**：超过连接距离的两点之间本来就不该生成地形。        */
  let cutLong = 0;
  if(maxE2 < Infinity){
    for(let t=0;t<nt0;t++){
      if(!keep[t]) continue;
      const a = tris0[3*t], b = tris0[3*t+1], c = tris0[3*t+2];
      const ax = wx[a], ay = wy[a], bx = wx[b], by = wy[b], cx = wx[c], cy = wy[c];
      const d1 = (bx-ax)*(bx-ax) + (by-ay)*(by-ay);
      const d2 = (cx-ax)*(cx-ax) + (cy-ay)*(cy-ay);
      const d3 = (cx-bx)*(cx-bx) + (cy-by)*(cy-by);
      const mx3 = d1 > d2 ? (d1 > d3 ? d1 : d3) : (d2 > d3 ? d2 : d3);
      if(mx3 > maxE2){ keep[t] = 0; nKeep--; cutLong++; }
    }
  }
  if(nKeep < 2) return;

  const tris = new Int32Array(nKeep*3);
  {
    let w = 0;
    for(let t=0;t<nt0;t++){
      if(!keep[t]) continue;
      tris[w++] = tris0[3*t];
      tris[w++] = tris0[3*t+1];
      tris[w++] = tris0[3*t+2];
    }
  }

  const halfH = S.hspan/2;
  const invH = (S.hspan > 0) ? (PAL_N-1)/S.hspan : 0;
  const ntri = nKeep;
  const fci = new Uint8Array(ntri);
  const fnx = new Float32Array(ntri);
  const fny = new Float32Array(ntri);

  for(let t=0;t<ntri;t++){
    const a = tris[3*t], b = tris[3*t+1], c = tris[3*t+2];
    const ax = wx[a], ay = wy[a], az = wz[a];
    const bx = wx[b], by = wy[b], bz = wz[b];
    const cx = wx[c], cy = wy[c], cz = wz[c];
    // 平面梯度：法线 n = (b-a) × (c-a)，nz>0（逆时针）；dz/dx = -nx/nz
    const ux1 = bx-ax, uy1 = by-ay, uz1 = bz-az;
    const ux2 = cx-ax, uy2 = cy-ay, uz2 = cz-az;
    const nX = uy1*uz2 - uz1*uy2;
    const nY = uz1*ux2 - ux1*uz2;
    const nZ = ux1*uy2 - uy1*ux2;
    if(nZ > 1e-12){ fnx[t] = -nX/nZ; fny[t] = -nY/nZ; }
    else { fnx[t] = 0; fny[t] = 0; }
    const ha = (az + bz + cz) / 3;
    fci[t] = clampInt(Math.round((ha + halfH) * invH), 0, PAL_N-1);
  }

  // ---- 边界边（只被一个三角形使用的边）：供侧壁封口与范围勾边 ----
  const nv = np;
  const em = new Map();
  for(let t=0;t<ntri;t++){
    for(let k=0;k<3;k++){
      const a = tris[3*t+k], b = tris[3*t+((k+1)%3)];
      const key = a < b ? (a*(nv+1) + b) : (b*(nv+1) + a);
      em.set(key, (em.get(key) || 0) + 1);
    }
  }
  const segArr = [];
  em.forEach((cnt, key) => {
    if(cnt !== 1) return;
    const a = Math.floor(key/(nv+1)), b = key % (nv+1);
    segArr.push(wx[a], wy[a], wz[a], wx[b], wy[b], wz[b]);
  });

  S.tin = {
    kind: 'tin',
    px: wx, py: wy, pz: wz, nv: nv,
    tris: tris, ntri: ntri,
    fci: fci, fnx: fnx, fny: fny, fsh: null, fshZ: -1,
    edgeSegs: segArr.length ? new Float32Array(segArr) : null,
    sx: new Float32Array(nv), sy: new Float32Array(nv), cz: new Float32Array(nv), vis: new Uint8Array(nv),
    tri0: nt0, cutEdge: cutEdge, cutAngle: cutAngle, cutLong: cutLong, spacing: spacing,
    maxEdge: maxEdge, autoMaxEdge: autoMaxEdge,
    holeCount: holeCount, refillHole: refillHole, refillTri: refillTri,
    np: np, decimated: decimated,
    lod: null, lodKind: 0,
    ms: ((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) - t0
  };
  S.surf = S.tin;
  // ---- 密集内插 + 平滑（V1.0.11）：默认关闭，仅生成"显示层"加密数据 ----
  // 实测点坐标与 S.tin（供挖填方量算 / 信息显示）完全不变。
  S.tin.dense = (S.dense && S.mode === 'tin') ? densifyTIN(S.tin) : null;
  S.invalidRatio = 0;
}

/* 密集内插 + 平滑：对三角网中"边长 > 目标边长"的边做中点细分（1→2/3/4），
   新点高程在「边中点线性值」与「邻域重心平均」之间按平滑强度插值，
   让稀疏实测点之间的大三角变得更密、表面更平缓。
   仅生成显示层数据；实测点、原始三角网、挖填方量算均不受影响。 */
function densifyTIN(tin){
  const px = tin.px, py = tin.py, pz = tin.pz, nv = tin.nv;
  const tris = tin.tris, ntri = tin.ntri;
  const spacing = tin.spacing || 1;
  let targetLen = S.denseLen > 0 ? S.denseLen : spacing * 0.55;
  if(!(targetLen > 0.001)) targetLen = spacing * 0.55;
  const sm = (isFinite(S.denseSmooth) ? clamp(S.denseSmooth, 0, 1) : 0.5);

  // 收集长边（u<v）及其所属三角形的第三点（1~2 个，供平滑取邻域重心）
  function collect(t2){
    const edge = new Map();
    for(let t=0;t<ntri;t++){
      const a = tris[3*t], b = tris[3*t+1], c = tris[3*t+2];
      let u, v, w;
      u=a; v=b; w=c; if(u>v){u=b;v=a;}
      { const dx=px[v]-px[u], dy=py[v]-py[u]; if(dx*dx+dy*dy > t2){ const k=u*nv+v; let e=edge.get(k); if(!e){e={u:u,v:v,third:[]};edge.set(k,e);} if(e.third.length<2) e.third.push(w); } }
      u=b; v=c; w=a; if(u>v){u=c;v=b;}
      { const dx=px[v]-px[u], dy=py[v]-py[u]; if(dx*dx+dy*dy > t2){ const k=u*nv+v; let e=edge.get(k); if(!e){e={u:u,v:v,third:[]};edge.set(k,e);} if(e.third.length<2) e.third.push(w); } }
      u=c; v=a; w=b; if(u>v){u=a;v=c;}
      { const dx=px[v]-px[u], dy=py[v]-py[u]; if(dx*dx+dy*dy > t2){ const k=u*nv+v; let e=edge.get(k); if(!e){e={u:u,v:v,third:[]};edge.set(k,e);} if(e.third.length<2) e.third.push(w); } }
    }
    return edge;
  }

  let t2 = targetLen * targetLen;
  let edge = collect(t2);
  let guard = 0;
  while(nv + edge.size > MAX_DENSE_V && guard < 8){
    targetLen *= 1.6; t2 = targetLen * targetLen; edge = collect(t2); guard++;
  }
  const addV = edge.size;
  if(addV < 1) return null;
  if(nv + addV > MAX_DENSE_V) return null;

  const nv2 = nv + addV;
  const px2 = new Float64Array(nv2), py2 = new Float64Array(nv2), pz2 = new Float64Array(nv2);
  px2.set(px.subarray(0, nv)); py2.set(py.subarray(0, nv)); pz2.set(pz.subarray(0, nv));
  const midIdx = new Map();
  let ni = nv;
  edge.forEach((e, key) => {
    const u = e.u, v = e.v;
    px2[ni] = (px[u] + px[v]) * 0.5;
    py2[ni] = (py[u] + py[v]) * 0.5;
    const zlin = (pz[u] + pz[v]) * 0.5;
    let zavg;
    if(e.third.length >= 2) zavg = (pz[u] + pz[v] + pz[e.third[0]] + pz[e.third[1]]) * 0.25;
    else if(e.third.length === 1) zavg = (pz[u] + pz[v] + pz[e.third[0]]) / 3;
    else zavg = zlin;
    pz2[ni] = zlin + sm * (zavg - zlin);   // 平滑：线性中点 → 邻域重心 之间插值
    midIdx.set(key, ni);
    ni++;
  });

  // 拆分三角形（按被细分边数 1/2/3 → 2/3/4 个子三角）
  const out = [];
  const kf = (u, v) => (u < v ? u*nv + v : v*nv + u);
  for(let t=0;t<ntri;t++){
    const a = tris[3*t], b = tris[3*t+1], c = tris[3*t+2];
    const mab = midIdx.get(kf(a,b));
    const mbc = midIdx.get(kf(b,c));
    const mca = midIdx.get(kf(c,a));
    const hasAB = mab !== undefined, hasBC = mbc !== undefined, hasCA = mca !== undefined;
    const cnt = (hasAB?1:0) + (hasBC?1:0) + (hasCA?1:0);
    if(cnt === 0){ out.push(a, b, c); }
    else if(cnt === 1){
      if(hasAB){ out.push(a, mab, c, mab, b, c); }
      else if(hasBC){ out.push(b, mbc, a, mbc, c, a); }
      else { out.push(c, mca, b, mca, a, b); }
    }
    else if(cnt === 2){
      if(hasAB && hasCA){ out.push(a, mab, mca, mab, b, c, mab, c, mca); }
      else if(hasAB && hasBC){ out.push(b, mbc, mab, mbc, c, a, mbc, a, mab); }
      else { out.push(c, mca, mbc, mca, a, b, mca, b, mbc); }
    }
    else { out.push(a, mab, mca, mab, b, mbc, mca, mbc, c, mab, mbc, mca); }
  }

  const ntri2 = out.length / 3;
  const tris2 = new Int32Array(out);
  const halfH = S.hspan / 2;
  const invH = (S.hspan > 0) ? (PAL_N - 1) / S.hspan : 0;
  const fci = new Uint8Array(ntri2);
  const fnx = new Float32Array(ntri2);
  const fny = new Float32Array(ntri2);
  for(let t=0;t<ntri2;t++){
    const a = tris2[3*t], b = tris2[3*t+1], c = tris2[3*t+2];
    const ax = px2[a], ay = py2[a], az = pz2[a];
    const bx = px2[b], by = py2[b], bz = pz2[b];
    const cx = px2[c], cy = py2[c], czz = pz2[c];
    const ux1 = bx-ax, uy1 = by-ay, uz1 = bz-az;
    const ux2 = cx-ax, uy2 = cy-ay, uz2 = czz-az;
    const nX = uy1*uz2 - uz1*uy2;
    const nY = uz1*ux2 - ux1*uz2;
    const nZ = ux1*uy2 - uy1*ux2;
    if(nZ > 1e-12){ fnx[t] = -nX/nZ; fny[t] = -nY/nZ; }
    else { fnx[t] = 0; fny[t] = 0; }
    const ha = (az + bz + czz) / 3;
    fci[t] = clampInt(Math.round((ha + halfH) * invH), 0, PAL_N-1);
  }

  return {
    kind: 'tin',
    px: px2, py: py2, pz: pz2, nv: nv2,
    tris: tris2, ntri: ntri2,
    fci: fci, fnx: fnx, fny: fny, fsh: null, fshZ: -1,
    edgeSegs: null,
    sx: new Float32Array(nv2), sy: new Float32Array(nv2), cz: new Float32Array(nv2), vis: new Uint8Array(nv2),
    rt: null,
    spacing: spacing, dense: true, addV: addV
  };
}

/* ============================================================
   7. 生成地表曲面（IDW 插值 + 规则三角网）
   ============================================================ */
/* 按当前成图规则构建场景 */
function buildScene(){
  S.tin = null;
  if(S.mode === 'tin'){
    buildTIN();
    if(S.tin) S.surf = S.tin;
    else S.surf = null;
  } else {
    S.surf = null;
    buildSurface();
  }
  updateTinInfo();
}

function updateTinInfo(){
  const el = $('tinInfo');
  if(!el) return;
  if(S.mode !== 'tin'){
    el.textContent = '规则格网 IDW（插值成图，整片铺满）';
    return;
  }
  const s = S.tin;
  if(!s){ el.textContent = '三角网 —'; return; }
  const cut = s.tri0 - s.ntri;
  const vac = (s.holeCount || 0) - (s.refillHole || 0);
  const me = (s.maxEdge > 0) ? s.maxEdge : 0;
  el.innerHTML = '三角网 <b>' + s.ntri.toLocaleString() + '</b> 面 · 间隔 <b>' + (me >= 1 ? me.toFixed(0) : me.toFixed(1)) + '</b> m'
    + (s.spacing > 0 ? ' · 点距 <b>' + (s.spacing >= 1 ? s.spacing.toFixed(1) : s.spacing.toFixed(2)) + '</b> m' : '')
    + (cut > 0 ? '<br>剔除 <b>' + cut.toLocaleString() + '</b> · 补洞 <b>' + s.refillTri.toLocaleString() + '</b>' + (vac > 0 ? ' · 空白 <b>' + vac + '</b>' : '') + ((s.cutLong || 0) > 0 ? ' · 超距 <b>' + s.cutLong.toLocaleString() + '</b>' : '') : '')
    + (s.decimated ? '<br>显示抽稀至 <b>' + s.np.toLocaleString() + '</b> 点' : '');
  // 自动模式下把算出来的当前值提示在输入框里
  const inp = $('numMaxEdge');
  if(inp && !(S.tinMaxEdge > 0)){
    inp.placeholder = (s.autoMaxEdge > 0) ? ('自动 ' + Math.round(s.autoMaxEdge)) : '自动';
  }
  updateDenseInfo();
}

function buildSurface(){
  const n = S.n;
  if(n < 6){ S.surf = null; return; }

  const res = S.surfaceRes;
  const nx = res+1, ny = res+1;
  const wx = S.wx, wy = S.wy, wz = S.wz;   // 东 / 北 / 高
  const x0 = S.box.x0, x1 = S.box.x1, y0 = S.box.y0, y1 = S.box.y1;
  const spanX = (x1-x0) || 1, spanY = (y1-y0) || 1;
  const dx = spanX/res, dy = spanY/res;

  // 空间哈希（按东-北平面）
  const ng = Math.max(8, Math.min(160, Math.round(Math.sqrt(n))));
  const buckets = new Array(ng*ng);
  const cellX = spanX/ng, cellY = spanY/ng;
  for(let i=0;i<n;i++){
    let gx = Math.floor((wx[i]-x0)/cellX); if(gx<0)gx=0; if(gx>=ng)gx=ng-1;
    let gy = Math.floor((wy[i]-y0)/cellY); if(gy<0)gy=0; if(gy>=ng)gy=ng-1;
    const k = gy*ng+gx;
    let arr = buckets[k];
    if(!arr){ arr = []; buckets[k] = arr; }
    arr.push(i);
  }

  // ---- 估算典型点距（最近邻距离中位数）：用于判定"没有测量数据的空白区" ----
  let spacing = Math.sqrt((spanX*spanY)/Math.max(1,n));
  {
    const stepI = Math.max(1, Math.floor(n/400));
    const ds = [];
    for(let t=0;t<n;t+=stepI){
      const px = wx[t], py = wy[t];
      let gx = Math.floor((px-x0)/cellX); if(gx<0)gx=0; if(gx>=ng)gx=ng-1;
      let gy = Math.floor((py-y0)/cellY); if(gy<0)gy=0; if(gy>=ng)gy=ng-1;
      let best = Infinity;
      const rcMin = Math.min(cellX, cellY);
      for(let r=1; r<=ng; r++){
        const ax0 = gx-r < 0 ? 0 : gx-r, ax1 = gx+r >= ng ? ng-1 : gx+r;
        const ay0 = gy-r < 0 ? 0 : gy-r, ay1 = gy+r >= ng ? ng-1 : gy+r;
        for(let yy=ay0; yy<=ay1; yy++){
          const rowK = yy*ng;
          for(let xx=ax0; xx<=ax1; xx++){
            const arr = buckets[rowK+xx];
            if(!arr) continue;
            for(let k=0;k<arr.length;k++){
              const q = arr[k];
              if(q === t) continue;
              const ddx = wx[q]-px, ddy = wy[q]-py;
              const d2 = ddx*ddx + ddy*ddy;
              if(d2 < best) best = d2;
            }
          }
        }
        if(best < Infinity && best <= (r*rcMin)*(r*rcMin)) break;  // 已确认不可能更近
      }
      if(best < Infinity) ds.push(Math.sqrt(best));
    }
    if(ds.length >= 8){
      ds.sort((a,b) => a-b);
      spacing = ds[ds.length >> 1];
    }
  }

  // 有效插值半径：超出该距离说明周围根本没有测点，整块留空不绘制。
  // 这样多个测区之间的空白地带、以及测区外的空地都不会被插出假地形。
  const maxR = Math.max(spacing*5, Math.max(dx,dy)*1.5);
  S.maxR = maxR;

  // 自适应搜索半径：正常按局部点距取，但不越过 maxR
  const meanSpacing = Math.sqrt((spanX*spanY)/Math.max(1,n));
  const R = Math.min(Math.max(Math.max(dx,dy)*1.7, meanSpacing*1.25), maxR);
  const KMIN = 6;
  const nbuf = new Int32Array(4096);
  let _hc = 0, _he = -1;

  function collect(px, py, gx, gy, rGX, rGY, rc2){
    _hc = 0; _he = -1;
    const ax0 = gx-rGX < 0 ? 0 : gx-rGX;
    const ax1 = gx+rGX >= ng ? ng-1 : gx+rGX;
    const ay0 = gy-rGY < 0 ? 0 : gy-rGY;
    const ay1 = gy+rGY >= ng ? ng-1 : gy+rGY;
    for(let yy=ay0; yy<=ay1; yy++){
      const rowK = yy*ng;
      for(let xx=ax0; xx<=ax1; xx++){
        const arr = buckets[rowK+xx];
        if(!arr) continue;
        for(let k=0;k<arr.length;k++){
          const pi = arr[k];
          const ddx = wx[pi]-px, ddy = wy[pi]-py;
          const d2 = ddx*ddx + ddy*ddy;
          if(d2 > rc2) continue;
          if(d2 < 1e-10){ _he = pi; return; }
          if(_hc < nbuf.length) nbuf[_hc++] = pi;
        }
      }
    }
  }

  const vx = new Float32Array(nx*ny);
  const vy = new Float32Array(nx*ny);
  const vz = new Float32Array(nx*ny);
  const valid = new Uint8Array(nx*ny);
  const hasZ = new Uint8Array(nx*ny);        // 该格点是否有可信插值高度
  const ci = new Uint8Array(nx*ny);
  const sx = new Float32Array(nx*ny);
  const sy = new Float32Array(nx*ny);
  const vis = new Uint8Array(nx*ny);

  const halfH = S.hspan/2;

  for(let j=0;j<ny;j++){
    const py = y0 + j*dy;
    let gy = Math.floor((py-y0)/cellY); if(gy<0)gy=0; if(gy>=ng)gy=ng-1;
    for(let i=0;i<nx;i++){
      const px = x0 + i*dx;
      let gx = Math.floor((px-x0)/cellX); if(gx<0)gx=0; if(gx>=ng)gx=ng-1;

      // 逐级扩大邻域取源点，但半径不超过 maxR：超出即视为无数据区，留空
      let rc = R;
      collect(px, py, gx, gy, Math.max(1,Math.ceil(rc/cellX)), Math.max(1,Math.ceil(rc/cellY)), rc*rc);
      let guard = 0;
      while(_he < 0 && _hc < KMIN && rc < maxR && guard++ < 12){
        rc = Math.min(rc*1.9, maxR);
        collect(px, py, gx, gy, Math.max(1,Math.ceil(rc/cellX)), Math.max(1,Math.ceil(rc/cellY)), rc*rc);
      }

      const id = j*nx + i;
      vx[id] = px;
      vy[id] = py;
      if(_he >= 0){
        vz[id] = wz[_he];
        valid[id] = 1;
        hasZ[id] = 1;
      } else if(_hc > 0){
        let sw = 0, sh = 0;
        for(let k=0;k<_hc;k++){
          const pi = nbuf[k];
          const ddx = wx[pi]-px, ddy = wy[pi]-py;
          const d2 = ddx*ddx + ddy*ddy;
          const w = 1/(d2*Math.sqrt(d2));   // power = 3
          sw += w; sh += w*wz[pi];
        }
        vz[id] = sw > 0 ? sh/sw : wz[nbuf[0]];
        valid[id] = 1;
        hasZ[id] = 1;
      } else {
        vz[id] = 0;
        valid[id] = 0;
        hasZ[id] = 0;
      }
      if(valid[id]){
        ci[id] = clampInt(Math.round((vz[id]+halfH)/S.hspan*(PAL_N-1)), 0, PAL_N-1);
      }
    }
  }

  // 有效区去噪：3×3 多数表决两遍，去掉单格凸起/凹坑（否则边界裁剪后会出现一排排"梳齿"）
  const totalCells = nx*ny;
  {
    const tv = new Uint8Array(totalCells);
    for(let pass=0; pass<2; pass++){
      tv.set(valid);
      for(let j=0;j<ny;j++){
        for(let i=0;i<nx;i++){
          const id = j*nx + i;
          let c = 0, cnt = 0;
          for(let b=-1;b<=1;b++){
            const jj = j+b;
            if(jj < 0 || jj >= ny) continue;
            const rowJ = jj*nx;
            for(let a=-1;a<=1;a++){
              const ii = i+a;
              if(ii < 0 || ii >= nx) continue;
              cnt++;
              if(tv[rowJ+ii]) c++;
            }
          }
          valid[id] = (c*2 > cnt) ? 1 : 0;
        }
      }
    }
  }

  // 邻近空白格点补高度：只补 3 层，供边界裁剪插值与侧壁使用（不改变"画不画"）
  {
    const pend = [];
    for(let pass=0; pass<3; pass++){
      pend.length = 0;
      for(let j=0;j<ny;j++){
        const row = j*nx;
        for(let i=0;i<nx;i++){
          const id = row + i;
          if(hasZ[id]) continue;
          let sum = 0, cnt = 0;
          if(i > 0   && hasZ[id-1]){ sum += vz[id-1]; cnt++; }
          if(i < nx-1 && hasZ[id+1]){ sum += vz[id+1]; cnt++; }
          if(j > 0   && hasZ[id-nx]){ sum += vz[id-nx]; cnt++; }
          if(j < ny-1 && hasZ[id+nx]){ sum += vz[id+nx]; cnt++; }
          if(cnt){ pend.push(id, sum/cnt); }
        }
      }
      if(!pend.length) break;
      for(let m=0;m<pend.length;m+=2){ vz[pend[m]] = pend[m+1]; hasZ[pend[m]] = 1; }
    }
  }

  // ---- 无数据区处理 ----
  // 默认（S.showHole=false）：整片铺满，与上一版一致——单测区数据不会因为
  //   "边界外没有测点"被削成一圈台阶。
  // 勾选"无数据区留空"：周围没有任何测点的区域保持留空，
  //   多块测区之间相隔较远的空白地带就不绘制（阶段验收类数据的场景）。
  const fillMask = new Uint8Array(totalCells);
  {
    let invalidCount = 0;
    for(let k=0;k<totalCells;k++) if(!valid[k]) invalidCount++;
    S.invalidRatio = invalidCount / totalCells;
  }
  if(!S.showHole){
    for(let k=0;k<totalCells;k++) if(!valid[k]) fillMask[k] = 1;
  }

  // 清理孤立小碎块：面积过小的有效区域多为零星散点插出来的孤岛，一并留空
  {
    const total = nx*ny;
    const seen = new Uint8Array(total);
    const queue = new Int32Array(total);
    const minCells = Math.max(6, Math.round(res*res*0.0016));
    for(let start=0; start<total; start++){
      if(!valid[start] || seen[start]) continue;
      let head = 0, tail = 0;
      queue[tail++] = start; seen[start] = 1;
      while(head < tail){
        const cur = queue[head++];
        const cxi = cur % nx, cyi = (cur - cxi)/nx;
        if(cxi > 0){ const nb = cur-1; if(valid[nb] && !seen[nb]){ seen[nb]=1; queue[tail++]=nb; } }
        if(cxi < nx-1){ const nb = cur+1; if(valid[nb] && !seen[nb]){ seen[nb]=1; queue[tail++]=nb; } }
        if(cyi > 0){ const nb = cur-nx; if(valid[nb] && !seen[nb]){ seen[nb]=1; queue[tail++]=nb; } }
        if(cyi < ny-1){ const nb = cur+nx; if(valid[nb] && !seen[nb]){ seen[nb]=1; queue[tail++]=nb; } }
      }
      if(tail < minCells){
        for(let m=0;m<tail;m++) valid[queue[m]] = 0;
      }
    }
  }

  // 铺满外围空白：标记有效，高度由相邻已知格点逐层扩散（外推面平缓，不出现空洞塌陷）
  {
    let needFill = 0;
    for(let k=0;k<totalCells;k++) if(fillMask[k]){ valid[k] = 1; needFill++; }
    if(needFill){
      const q = new Int32Array(totalCells);
      let head = 0, tail = 0;
      for(let k=0;k<totalCells;k++) if(hasZ[k]) q[tail++] = k;
      while(head < tail){
        const cur = q[head++];
        const cxi = cur % nx, cyi = (cur - cxi)/nx;
        for(let s2=0;s2<4;s2++){
          let nb = -1;
          if(s2 === 0){ if(cxi > 0) nb = cur-1; }
          else if(s2 === 1){ if(cxi < nx-1) nb = cur+1; }
          else if(s2 === 2){ if(cyi > 0) nb = cur-nx; }
          else { if(cyi < ny-1) nb = cur+nx; }
          if(nb < 0 || hasZ[nb] || !valid[nb]) continue;
          let sum = 0, cnt = 0;
          const nxi = nb % nx;
          if(nxi > 0 && hasZ[nb-1]){ sum += vz[nb-1]; cnt++; }
          if(nxi < nx-1 && hasZ[nb+1]){ sum += vz[nb+1]; cnt++; }
          if(nb-nx >= 0 && hasZ[nb-nx]){ sum += vz[nb-nx]; cnt++; }
          if(nb+nx < totalCells && hasZ[nb+nx]){ sum += vz[nb+nx]; cnt++; }
          if(cnt){ vz[nb] = sum/cnt; hasZ[nb] = 1; q[tail++] = nb; }
        }
      }
      // 极端情况未扩散到：用整体均值兜底
      let sg = 0, cg = 0;
      for(let k=0;k<totalCells;k++) if(hasZ[k]){ sg += vz[k]; cg++; }
      const avgZ = cg ? sg/cg : 0;
      for(let k=0;k<totalCells;k++){
        if(fillMask[k] && !hasZ[k]){ vz[k] = avgZ; hasZ[k] = 1; }
      }

      // 松弛：把扩散出的阶梯面磨成平缓外推面（真实测点格点固定不动，只当边界条件）
      const tmp = new Float32Array(totalCells);
      for(let pass=0; pass<40; pass++){
        tmp.set(vz);
        for(let j=0;j<ny;j++){
          for(let i=0;i<nx;i++){
            const id = j*nx + i;
            if(!fillMask[id]) continue;
            let s9 = 0, c9 = 0;
            for(let b=-1;b<=1;b++){
              const jj = j+b;
              if(jj < 0 || jj >= ny) continue;
              const rowJ = jj*nx;
              for(let a=-1;a<=1;a++){
                const ii = i+a;
                if(ii < 0 || ii >= nx) continue;
                s9 += tmp[rowJ+ii]; c9++;
              }
            }
            if(c9) vz[id] = s9/c9;
          }
        }
      }

      // 颜色索引重算
      for(let k=0;k<totalCells;k++){
        if(fillMask[k]) ci[k] = clampInt(Math.round((vz[k]+halfH)/S.hspan*(PAL_N-1)), 0, PAL_N-1);
      }
    }
  }

  // 边界线段（Marching Squares，取格边中点）：供侧面填充沿真实边界封口，
  // 与曲面裁剪用的是同一套判据，壁和曲面就不会错位。
  let edgeSegs = null;
  {
    const segs = [];
    const mid = (i1, i2, out) => {
      out[0] = (vx[i1] + vx[i2])*0.5;
      out[1] = (vy[i1] + vy[i2])*0.5;
      out[2] = (vz[i1] + vz[i2])*0.5;
    };
    const m0 = [0,0,0], m1 = [0,0,0], m2 = [0,0,0], m3 = [0,0,0];
    // 情形表：每种 4 位状态对应的连接（边号 0=下 1=右 2=上 3=左）
    const LINK = [
      [], [[0,3]], [[0,1]], [[1,3]], [[1,2]],
      [[0,3],[1,2]], [[0,2]], [[2,3]], [[2,3]],
      [[1,2]], [[0,1],[2,3]], [[1,2]], [[1,3]],
      [[0,1]], [[0,3]], []
    ];
    for(let j=0;j<ny-1;j++){
      for(let i=0;i<nx-1;i++){
        const a = j*nx + i, b = a+1, c = a+nx+1, d = a+nx;   // 左下 / 右下 / 右上 / 左上
        const k = (valid[a]?1:0) | (valid[b]?2:0) | (valid[c]?4:0) | (valid[d]?8:0);
        if(k === 0 || k === 15) continue;
        mid(a, b, m0); mid(b, c, m1); mid(c, d, m2); mid(d, a, m3);
        const mm = [m0, m1, m2, m3];
        const links = LINK[k];
        for(let t=0;t<links.length;t++){
          const p = mm[links[t][0]], q = mm[links[t][1]];
          segs.push(p[0], p[1], p[2], q[0], q[1], q[2]);
        }
      }
    }
    if(segs.length) edgeSegs = new Float32Array(segs);
  }

  S.surf = {
    kind: 'grid',
    res: res, nx: nx, ny: ny,
    vx: vx, vy: vy, vz: vz, valid: valid, ci: ci,
    edgeSegs: edgeSegs,
    sx: sx, sy: sy, vis: vis,
    cOff: null, cSeg: null, cIdx: null
  };
}

/* ============================================================
   7b. 等高线（Marching Squares，单元格四分割）
   ============================================================ */
function niceInterval(raw){
  const seq = [0.05,0.1,0.2,0.25,0.5,1,2,2.5,5,10,20,25,50,100,200,500,1000];
  for(let i=0;i<seq.length;i++) if(seq[i] >= raw - 1e-9) return seq[i];
  return 1000;
}

function computeLevels(){
  const z0 = S.box.z0, z1 = S.box.z1;
  const span = (z1 - z0) || 1;
  let iv = S.cntInterval > 0 ? S.cntInterval : niceInterval(span/20);
  if(!(iv > 0)) iv = niceInterval(span/20);
  if(span/iv > 300) iv = niceInterval(span/300);   // 防止线过密拖慢渲染
  const levels = [];
  const start = Math.ceil(z0/iv - 1e-9)*iv;
  for(let L = start; L <= z1 + 1e-9; L += iv) levels.push(L);
  if(levels.length === 0) levels.push((z0+z1)*0.5);
  return { levels: levels, iv: iv };
}

function buildContours(){
  const s = S.surf;
  S.cntLevels = [];
  if(!s) return;

  const lv = computeLevels();
  const levels = lv.levels, iv = lv.iv;

  // 三角网模式下等高线在渲染时逐面内插，这里只确定等高距与高程线
  if(s.kind === 'tin'){
    S.cntLevels = levels;
    S.cntIv = iv;
    updateCntInfo();
    return;
  }

  const res = s.res, nx = s.nx;

  const cells = res*res;
  const off = new Int32Array(cells+1);
  const seg = [];
  const sfl = [];

  function triSeg(x1,y1,h1, x2,y2,h2, x3,y3,h3, L, isIdx){
    let ax=0, ay=0, bx=0, by=0, nn=0;
    if((h1-L)*(h2-L) < 0){ const t=(L-h1)/(h2-h1); ax=x1+(x2-x1)*t; ay=y1+(y2-y1)*t; nn=1; }
    if((h2-L)*(h3-L) < 0 && nn<2){
      const t=(L-h2)/(h3-h2);
      if(nn===0){ ax=x2+(x3-x2)*t; ay=y2+(y3-y2)*t; nn=1; }
      else { bx=x2+(x3-x2)*t; by=y2+(y3-y2)*t; nn=2; }
    }
    if((h3-L)*(h1-L) < 0 && nn<2){
      const t=(L-h3)/(h1-h3);
      if(nn===0){ ax=x3+(x1-x3)*t; ay=y3+(y1-y3)*t; nn=1; }
      else { bx=x3+(x1-x3)*t; by=y3+(y1-y3)*t; nn=2; }
    }
    if(nn===2){ seg.push(ax, ay, L, bx, by, L); sfl.push(isIdx?1:0); }
  }

  for(let j=0;j<res;j++){
    for(let i=0;i<res;i++){
      const cell = j*res + i;
      off[cell] = seg.length/6;
      const a = j*nx + i, b = a+1, c = a+nx+1, d = a+nx;
      if(!s.valid[a] || !s.valid[b] || !s.valid[c] || !s.valid[d]) continue;

      const ha = s.vz[a], hb = s.vz[b], hc = s.vz[c], hd = s.vz[d];
      let mn = ha, mx = ha;
      if(hb<mn)mn=hb; if(hb>mx)mx=hb;
      if(hc<mn)mn=hc; if(hc>mx)mx=hc;
      if(hd<mn)mn=hd; if(hd>mx)mx=hd;
      if(mx - mn < 1e-12) continue;

      // 二分定位落到本格内的高程线，避免逐条遍历
      let lo = 0, hi = levels.length-1, st = -1;
      while(lo <= hi){
        const md = (lo+hi)>>1;
        if(levels[md] <= mn) lo = md+1; else { st = md; hi = md-1; }
      }
      if(st < 0) continue;

      const xa = s.vx[a], ya = s.vy[a];
      const xb = s.vx[b], yb = s.vy[b];
      const xc = s.vx[c], yc = s.vy[c];
      const xd = s.vx[d], yd = s.vy[d];
      const xm = (xa+xc)*0.5, ym = (ya+yc)*0.5, hm = (ha+hb+hc+hd)*0.25;

      for(let li=st; li<levels.length; li++){
        const L = levels[li];
        if(L >= mx) break;
        const isIdx = (li % 5 === 0);
        triSeg(xa,ya,ha, xb,yb,hb, xm,ym,hm, L, isIdx);
        triSeg(xb,yb,hb, xc,yc,hc, xm,ym,hm, L, isIdx);
        triSeg(xc,yc,hc, xd,yd,hd, xm,ym,hm, L, isIdx);
        triSeg(xd,yd,hd, xa,ya,ha, xm,ym,hm, L, isIdx);
      }
    }
  }
  off[cells] = seg.length/6;

  s.cOff = off;
  s.cSeg = new Float32Array(seg);
  s.cIdx = new Uint8Array(sfl);
  S.cntLevels = levels;
  S.cntIv = iv;
  updateCntInfo();
}

function updateCntInfo(){
  const el = $('cntInfo');
  if(!el) return;
  const num = $('numCnt');
  if(!S.surf || !S.cntLevels || !S.cntLevels.length){
    el.textContent = '等高距 —';
    return;
  }
  if(num && document.activeElement !== num) num.value = S.cntIv;
  const ivTxt = S.cntIv >= 1 ? String(Math.round(S.cntIv*100)/100) : String(Math.round(S.cntIv*1000)/1000);
  el.innerHTML = '等高距 <b>' + ivTxt + '</b> m · 共 <b>' + S.cntLevels.length + '</b> 条';
}

/* ============================================================
   8. 渲染
   ============================================================ */
function projectPoint(px, py, pz){
  const ddx = px-V.eye.x, ddy = py-V.eye.y, ddz = pz-V.eye.z;
  const zc = ddx*V.fx + ddy*V.fy + ddz*V.fz;
  if(zc < 0.5) return null;
  const inv = V.focal/zc;
  return [V.cx + (ddx*V.rx + ddy*V.ry + ddz*V.rz)*inv,
          V.cy - (ddx*V.ux + ddy*V.uy + ddz*V.uz)*inv];
}

/* ---- 基准面（水平参考面 + 挖填方统计） ---- */
function drawBasePlane(){
  if(!S.loaded || !S.rawBox) return;
  const b = S.box;
  const pz = (S.baseElev - S.zCenter) * S.zExag;
  const pad = S.diag * 0.015;
  const x0 = b.x0 - pad, x1 = b.x1 + pad;
  const y0 = b.y0 - pad, y1 = b.y1 + pad;

  const c00 = projectPoint(x0, y0, pz), c10 = projectPoint(x1, y0, pz);
  const c11 = projectPoint(x1, y1, pz), c01 = projectPoint(x0, y1, pz);
  if(!c00 || !c10 || !c11 || !c01) return;

  const g = ctx;
  const above = S.baseElev > (S.rawBox.h0 + S.rawBox.h1) * 0.5;

  g.save();
  g.beginPath();
  g.moveTo(c00[0], c00[1]); g.lineTo(c10[0], c10[1]);
  g.lineTo(c11[0], c11[1]); g.lineTo(c01[0], c01[1]);
  g.closePath();
  g.fillStyle = above ? 'rgba(56,189,248,.038)' : 'rgba(56,189,248,.15)';
  g.fill();

  // 面内参考网格
  g.strokeStyle = above ? 'rgba(125,211,232,.30)' : 'rgba(125,211,232,.22)';
  g.lineWidth = 1;
  const ND = 6;
  for(let k=1;k<ND;k++){
    const t = k/ND;
    const ax = x0 + (x1-x0)*t;
    const p1 = projectPoint(ax, y0, pz), p2 = projectPoint(ax, y1, pz);
    if(p1 && p2){ g.beginPath(); g.moveTo(p1[0],p1[1]); g.lineTo(p2[0],p2[1]); g.stroke(); }
    const ay = y0 + (y1-y0)*t;
    const p3 = projectPoint(x0, ay, pz), p4 = projectPoint(x1, ay, pz);
    if(p3 && p4){ g.beginPath(); g.moveTo(p3[0],p3[1]); g.lineTo(p4[0],p4[1]); g.stroke(); }
  }

  // 外轮廓
  g.beginPath();
  g.moveTo(c00[0], c00[1]); g.lineTo(c10[0], c10[1]);
  g.lineTo(c11[0], c11[1]); g.lineTo(c01[0], c01[1]);
  g.closePath();
  g.strokeStyle = above ? 'rgba(125,211,232,.42)' : 'rgba(125,211,232,.62)';
  g.lineWidth = 1.4;
  g.stroke();

  // 高程标注：贴在最靠近观察者的角上
  const cs = [c00, c10, c11, c01];
  let ci = 0, my = -1e9;
  for(let i=0;i<4;i++){ if(cs[i][1] > my){ my = cs[i][1]; ci = i; } }
  const txt = '基准面 ' + S.baseElev.toFixed(2) + ' m';
  g.font = '600 11px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
  g.textAlign = 'left';
  g.textBaseline = 'middle';
  const tw = g.measureText(txt).width;
  let bx = cs[ci][0] - tw/2 - 6;
  let by = cs[ci][1] + 9;
  const sideL = V.w > 700 ? 276 : 6;          // 让开左侧面板
  bx = clamp(bx, sideL, Math.max(sideL, V.w - tw - 18));
  by = clamp(by, 58, V.h - 12);
  g.fillStyle = 'rgba(8,11,16,.78)';
  g.fillRect(bx, by, tw + 12, 18);
  g.strokeStyle = 'rgba(125,211,232,.3)';
  g.lineWidth = 1;
  g.strokeRect(bx + 0.5, by + 0.5, tw + 11, 17);
  g.fillStyle = '#7dd3e8';
  g.fillText(txt, bx + 6, by + 9.5);
  g.restore();
}

/* ---- 侧面填充：地形面与基准面之间的垂直侧壁（沿场地四周外轮廓封口） ---- */
function drawSkirt(){
  const s = S.surf;
  if(!S.loaded || !s || !S.rawBox) return;
  const nx = s.nx, ny = s.ny;
  const vx = s.vx, vy = s.vy, vz = s.vz, valid = s.valid;
  const zs = S.zExag;
  const baseZ = (S.baseElev - S.zCenter) * zs;

  const ex = V.eye.x, ey = V.eye.y, ez = V.eye.z;
  const fx = V.fx, fy = V.fy, fz = V.fz;
  const rx = V.rx, ry = V.ry, rz = V.rz;
  const ux = V.ux, uy = V.uy, uz = V.uz;
  const focal = V.focal, ccx = V.cx, ccy = V.cy;

  const pa = [0,0,0], pb = [0,0,0], pc = [0,0,0], pd = [0,0,0];
  function proj(px, py, pz, out){
    const ddx = px-ex, ddy = py-ey, ddz = pz-ez;
    const zc = ddx*fx + ddy*fy + ddz*fz;
    if(zc < 0.5) return false;
    const inv = focal/zc;
    out[0] = ccx + (ddx*rx + ddy*ry + ddz*rz)*inv;
    out[1] = ccy - (ddx*ux + ddy*uy + ddz*uz)*inv;
    out[2] = zc;
    return true;
  }

  const quads = [];
  function edge(i1, i2, nxv, nyv){
    if(!valid[i1] || !valid[i2]) return;
    const x1 = vx[i1], y1 = vy[i1], z1 = vz[i1]*zs;
    const x2 = vx[i2], y2 = vy[i2], z2 = vz[i2]*zs;
    const d1 = z1 - baseZ, d2 = z2 - baseZ;
    // 两端都几乎贴合基准面（<2cm 当量）时无需成壁
    if(Math.abs(d1) < 1e-4 && Math.abs(d2) < 1e-4) return;
    if(!proj(x1, y1, z1, pa)) return;
    if(!proj(x2, y2, z2, pb)) return;
    if(!proj(x2, y2, baseZ, pc)) return;
    if(!proj(x1, y1, baseZ, pd)) return;
    quads.push({
      x1:pa[0], y1:pa[1], x2:pb[0], y2:pb[1],
      x3:pc[0], y3:pc[1], x4:pd[0], y4:pd[1],
      z:(pa[2]+pb[2])*0.5, cut:(d1+d2) > 0, nxv:nxv, nyv:nyv
    });
  }

  // 有"内部空白边界"时（无数据区留空模式）沿真实边界封口，与曲面裁剪严格对齐；
  // 整片铺满时退化为沿有效格网区域边界封口
  const segs = s.edgeSegs;
  if(segs && segs.length){
