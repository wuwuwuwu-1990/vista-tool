<title>竣工章生成器 V1.1 优化版</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "SimHei", sans-serif;
  background: #f5f5f5;
  display: flex; height: 100vh; overflow: hidden;
}
.sidebar {
  width: 220px; background: #fff; border-right: 1px solid #ddd;
  padding: 16px; display: flex; flex-direction: column;
}
.sidebar h3 { margin-bottom: 12px; font-size: 16px; color: #333; }
.stamp-list { list-style: none; flex: 1; }
.stamp-list li {
  padding: 10px 12px; margin-bottom: 6px;
  border-radius: 6px; cursor: pointer; font-size: 14px;
  border: 1px solid transparent; transition: all .2s;
}
.stamp-list li:hover { background: #eef5ff; border-color: #cce0ff; }
.stamp-list li.active { background: #e6f0ff; border-color: #80b3ff; color: #0066cc; font-weight: bold; }

.main {
  flex: 1; display: flex; flex-direction: column;
  padding: 16px; overflow-y: auto;
}
.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
}
.preview-wrap {
  background: #fff; border-radius: 8px; border: 1px solid #ddd;
  padding: 12px; margin-bottom: 16px; display: flex;
  justify-content: center; align-items: center;
  min-height: 320px; max-height: 520px; overflow: auto;
}
#previewCanvas { max-width: 100%; max-height: 500px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

.controls { display: flex; gap: 24px; flex-wrap: wrap; }
.form-section { flex: 1; min-width: 320px; }
.form-section h3 { margin-bottom: 10px; font-size: 15px; color: #333; }
.form-row {
  background: #fff; border-radius: 8px; border: 1px solid #e0e0e0;
  padding: 10px 12px; margin-bottom: 8px;
}
.form-group { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.form-group label { font-size: 13px; color: #555; white-space: nowrap; width: 70px; }
.form-group input {
  flex: 1; padding: 6px 10px; font-size: 14px;
  border: 1px solid #ccc; border-radius: 4px; font-family: inherit;
}
.ctrl-bar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.ctrl-bar .lbl { font-size: 12px; color: #888; }
.ctrl-bar button {
  padding: 3px 10px; font-size: 13px; border: 1px solid #ccc;
  border-radius: 4px; background: #f8f8f8; cursor: pointer;
  transition: all .15s;
}
.ctrl-bar button:hover { background: #e8e8e8; }
.ctrl-bar button:active { background: #ddd; }
.ctrl-bar .val { font-size: 13px; color: #333; min-width: 32px; text-align: center; font-family: monospace; }
.ctrl-bar .reset { background: #fff0f0; border-color: #ffcccc; color: #c00; }
.ctrl-bar .reset:hover { background: #ffe0e0; }
.ctrl-bar .condense { background: #f0f5ff; border-color: #cce0ff; color: #36c; }
.ctrl-bar .condense:hover { background: #e0ecff; }
.ctrl-bar .relax { background: #f0fff0; border-color: #cce0cc; color: #0a0; }
.ctrl-bar .relax:hover { background: #e0ffe0; }

.actions { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
.btn {
  padding: 8px 20px; font-size: 14px; border-radius: 6px;
  border: none; cursor: pointer; transition: all .15s;
}
.btn-primary { background: #0066cc; color: #fff; }
.btn-primary:hover { background: #0052a3; }
.btn-secondary { background: #f0f0f0; color: #333; border: 1px solid #ccc; }
.btn-secondary:hover { background: #e5e5e5; }
</style>
</head>

  </div>
  <div class="controls">
    <div class="form-section" id="formContainer"></div>
  </div>
</div>

const images = {};
stamps.forEach(s => {
  const img = new Image();
  img.src = 'data:image/png;base64,' + s.frameBase64;
  images[s.id] = img;
});

let currentStampId = stamps[0].id;
let previewScale = 0.5;
let currentFont = 'SimHei';
// ===== 方正小标宋（网页版：系统装有则自动使用，否则回退黑体） =====
(function() {
  try {
    document.fonts.load('12px 方正小标宋_GBK').then(function() {
      if (currentFont === '方正小标宋_GBK') drawPreview();
    }).catch(function() {});
  } catch (e) {}
})();

const storedValues = {};
const fontOverrides = {};   // per stamp per key: font size override
const spacingOverrides = {}; // per stamp per key: letter-spacing override (added to auto)
const posOverrides = {};    // per stamp per key: {x: number, y: number} position offset

function getStored(stampId, key) {
  return (storedValues[stampId] && storedValues[stampId][key]) || '';
}
function getFontOverride(stampId, key) {
  if (fontOverrides[stampId] && fontOverrides[stampId][key]) return fontOverrides[stampId][key];
  return 0;
}
function getSpacingOverride(stampId, key) {
  if (spacingOverrides[stampId] && spacingOverrides[stampId][key]) return spacingOverrides[stampId][key];
  return 0;
}
function getPosOverride(stampId, key) {
  if (posOverrides[stampId] && posOverrides[stampId][key]) return posOverrides[stampId][key];
  return {x: 0, y: 0};
}

function init() {
  initFontSelect();
  renderStampList();
  renderForm();
  computePreviewScale();
  const firstImg = images[stamps[0].id];
  if (firstImg.complete) { requestAnimationFrame(drawPreview); }
  else { firstImg.onload = () => requestAnimationFrame(drawPreview); }
}

function computePreviewScale() {
  const stamp = stamps.find(s => s.id === currentStampId);
  const maxW = Math.min(700, window.innerWidth - 380);
  const maxH = 500;
  previewScale = Math.min(maxW / stamp.canvasWidth, maxH / stamp.canvasHeight, 1.0);
}

function renderStampList() {
  const list = document.getElementById('stampList');
  list.innerHTML = stamps.map(s =>
    `<li class="${s.id===currentStampId?'active':''}" data-id="${s.id}" onclick="switchStamp('${s.id}')">${s.name}</li>`
  ).join('');
}

function switchStamp(id) {
  currentStampId = id;
  computePreviewScale();
  renderStampList();
  renderForm();
  const img = images[id];
  if (img.complete) requestAnimationFrame(drawPreview);
  else img.onload = () => requestAnimationFrame(drawPreview);
}

function renderForm() {
  const stamp = stamps.find(s => s.id === currentStampId);
  const container = document.getElementById('formContainer');
  container.innerHTML = stamp.textFields.map(f => {
    const curSize = getFontOverride(stamp.id, f.key) || f.baseFontSize;
    const curSpace = getSpacingOverride(stamp.id, f.key);
    const curPos = getPosOverride(stamp.id, f.key);
    return `<div class="form-row">
      <div class="form-group">
        <label>${f.label}</label>
        <input type="text" id="input_${f.key}" placeholder="请输入${f.label}"
          value="${getStored(stamp.id, f.key).replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}"
          oninput="onInputChange('${f.key}')">
      </div>
      <div class="ctrl-bar">
        <span class="lbl">字号</span>
        <button class="btn-fs" onclick="adjFont('${f.key}',-2)" title="缩小">−</button>
        <span class="val" id="fsval_${f.key}">${curSize}</span>
        <button class="btn-fs" onclick="adjFont('${f.key}',2)" title="放大">+</button>
        <button class="btn-fs reset" onclick="resetFont('${f.key}')">默认</button>
        <span class="lbl" style="margin-left:8px">字间距</span>
        <button class="btn-fs condense" onclick="adjSpacing('${f.key}',-1)" title="缩瘦">缩瘦</button>
        <span class="val" id="spval_${f.key}">${curSpace > 0 ? '+' + curSpace : curSpace}</span>
        <button class="btn-fs relax" onclick="adjSpacing('${f.key}',1)" title="放松">放松</button>
        <button class="btn-fs reset" onclick="resetSpacing('${f.key}')">默认</button>
      </div>
      <div class="ctrl-bar" style="margin-top:4px">
        <span class="lbl">位置</span>
        <button class="btn-fs" onmousedown="startPosMove('${f.key}',0,-1)" onmouseup="stopPosMove()" onmouseleave="stopPosMove()" ontouchstart="startPosMove('${f.key}',0,-1);event.preventDefault()" ontouchend="stopPosMove()" title="上移（长按连续移动）">↑</button>
        <button class="btn-fs" onmousedown="startPosMove('${f.key}',0,1)" onmouseup="stopPosMove()" onmouseleave="stopPosMove()" ontouchstart="startPosMove('${f.key}',0,1);event.preventDefault()" ontouchend="stopPosMove()" title="下移（长按连续移动）">↓</button>
        <button class="btn-fs" onmousedown="startPosMove('${f.key}',-1,0)" onmouseup="stopPosMove()" onmouseleave="stopPosMove()" ontouchstart="startPosMove('${f.key}',-1,0);event.preventDefault()" ontouchend="stopPosMove()" title="左移（长按连续移动）">←</button>
        <button class="btn-fs" onmousedown="startPosMove('${f.key}',1,0)" onmouseup="stopPosMove()" onmouseleave="stopPosMove()" ontouchstart="startPosMove('${f.key}',1,0);event.preventDefault()" ontouchend="stopPosMove()" title="右移（长按连续移动）">→</button>
        <span class="val" id="posval_${f.key}">${curPos.x},${curPos.y}</span>
        <button class="btn-fs reset" onclick="resetPos('${f.key}')">默认</button>
      </div>
    </div>`;
  }).join('');
}

function onInputChange(key) {
  const stamp = stamps.find(s => s.id === currentStampId);
  if (!storedValues[currentStampId]) storedValues[currentStampId] = {};
  storedValues[currentStampId][key] = document.getElementById('input_' + key).value;
  drawPreview();
}

function adjFont(key, delta) {
  const stamp = stamps.find(s => s.id === currentStampId);
  if (!fontOverrides[currentStampId]) fontOverrides[currentStampId] = {};
  const cur = fontOverrides[currentStampId][key] || stamp.textFields.find(f=>f.key===key).baseFontSize;
  fontOverrides[currentStampId][key] = Math.max(6, cur + delta);
  document.getElementById('fsval_' + key).textContent = fontOverrides[currentStampId][key];
  drawPreview();
}
function resetFont(key) {
  const stamp = stamps.find(s => s.id === currentStampId);
  if (!fontOverrides[currentStampId]) return;
  fontOverrides[currentStampId][key] = 0;
  document.getElementById('fsval_' + key).textContent =
    stamp.textFields.find(f=>f.key===key).baseFontSize;
  drawPreview();
}

function adjSpacing(key, delta) {
  if (!spacingOverrides[currentStampId]) spacingOverrides[currentStampId] = {};
  const cur = spacingOverrides[currentStampId][key] || 0;
  spacingOverrides[currentStampId][key] = cur + delta;
  const val = spacingOverrides[currentStampId][key];
  document.getElementById('spval_' + key).textContent = val > 0 ? '+' + val : val;
  drawPreview();
}
function resetSpacing(key) {
  if (!spacingOverrides[currentStampId]) return;
  spacingOverrides[currentStampId][key] = 0;
  document.getElementById('spval_' + key).textContent = '0';
  drawPreview();
}

function adjPos(key, dx, dy) {
  if (!posOverrides[currentStampId]) posOverrides[currentStampId] = {};
  const cur = posOverrides[currentStampId][key] || {x: 0, y: 0};
  posOverrides[currentStampId][key] = {x: cur.x + dx, y: cur.y + dy};
  const p = posOverrides[currentStampId][key];
  document.getElementById('posval_' + key).textContent = p.x + ',' + p.y;
  drawPreview();
}
function resetPos(key) {
  if (!posOverrides[currentStampId]) return;
  posOverrides[currentStampId][key] = {x: 0, y: 0};
  document.getElementById('posval_' + key).textContent = '0,0';
  drawPreview();
}

function onFontChange() {
  currentFont = document.getElementById('fontSelect').value;
  if (currentFont) drawPreview();
}

// ===== 字体列表（硬编码） =====
const BUILTIN_FONTS = [
  {name:'SimHei', label:'黑体'},
  {name:'SimSun', label:'宋体'},
  {name:'KaiTi', label:'楷体'},
  {name:'FangSong', label:'仿宋'},
  {name:'方正小标宋_GBK', label:'方正小标宋_GBK'},
];

function initFontSelect() {
  var sel = document.getElementById('fontSelect');
  sel.innerHTML = '';
  BUILTIN_FONTS.forEach(function(f) {
    var opt = document.createElement('option');
    opt.value = f.name;
    opt.textContent = f.label;
    sel.appendChild(opt);
  });
  sel.value = 'SimHei';
  currentFont = 'SimHei';
}

// Long-press support for position arrows
let posInterval = null;
let posIntervalKey = null;
let posIntervalDx = 0;
let posIntervalDy = 0;

function startPosMove(key, dx, dy) {
  stopPosMove();
  posIntervalKey = key;
  posIntervalDx = dx;
  posIntervalDy = dy;
  adjPos(key, dx, dy); // immediate first step
  posInterval = setInterval(function() {
    adjPos(posIntervalKey, posIntervalDx, posIntervalDy);
  }, 60);
}

function stopPosMove() {
  if (posInterval) { clearInterval(posInterval); posInterval = null; }
  posIntervalKey = null;
}

function clearAll() {
  const stamp = stamps.find(s => s.id === currentStampId);
  stamp.textFields.forEach(f => {
    const el = document.getElementById('input_'+f.key);
    if (el) el.value = '';
    if (storedValues[currentStampId]) storedValues[currentStampId][f.key] = '';
    if (fontOverrides[currentStampId]) fontOverrides[currentStampId][f.key] = 0;
    if (spacingOverrides[currentStampId]) spacingOverrides[currentStampId][f.key] = 0;
    if (posOverrides[currentStampId]) posOverrides[currentStampId][f.key] = {x:0,y:0};
    const fsEl = document.getElementById('fsval_'+f.key);
    if (fsEl) fsEl.textContent = f.baseFontSize;
    const spEl = document.getElementById('spval_'+f.key);
    if (spEl) spEl.textContent = '0';
    const posEl = document.getElementById('posval_'+f.key);
    if (posEl) posEl.textContent = '0,0';
  });
  drawPreview();
}

function getFontStr(size) {
  return size + 'px "' + currentFont + '", sans-serif';
}

// 自适应排版：手动字距 -> 自动缩瘦字距 -> 自动缩小字号，始终居中且不超出框线
function calcTextStyle(ctx, text, maxW, baseSize, manualSpacing, maxH) {
  if (!text || text.trim() === '') return { size: baseSize, spacing: 0 };
  const chars = text.length;

  const widthAt = function(size, spacing) {
    ctx.font = getFontStr(size);
    return measureTextWithSpacing(ctx, text, spacing);
  };
  // 字号上限：不超过框高的 75%，避免上下超出框线
  const heightLimit = (maxH && maxH > 0) ? maxH * 0.75 : Infinity;

  // 第一步：用用户设定字号 + 手动字距
  if (baseSize <= heightLimit && widthAt(baseSize, manualSpacing) <= maxW) {
    return { size: baseSize, spacing: manualSpacing };
  }

  // 第二步：同字号下自动压缩字距（缩瘦），压到下限为止，避免字重叠过重
  const spacingFloor = -Math.max(8, baseSize * 0.38);
  let spacing = manualSpacing;
  if (chars > 1 && spacing > spacingFloor) {
    const noSpacingW = widthAt(baseSize, 0);
    let need = (maxW - noSpacingW) / (chars - 1);
    if (need < spacing) {
      need = Math.max(spacingFloor, need);
      spacing = need;
      if (baseSize <= heightLimit && widthAt(baseSize, spacing) <= maxW) {
        return { size: baseSize, spacing: spacing };
      }
    }
  }

  // 第三步：仍放不下则逐级缩小字号，字距下限随字号而定（且不超过框高限制）
  const minSize = Math.max(6, Math.min(baseSize * 0.35, heightLimit === Infinity ? baseSize * 0.35 : heightLimit));
  let size = Math.min(baseSize, heightLimit);
  while (size > minSize) {
    size = Math.max(minSize, size - 2);
    const floor = -Math.max(6, size * 0.38);
    let s = spacing;
    if (s < floor) s = floor;
    if (widthAt(size, s) <= maxW) {
      return { size: size, spacing: s };
    }
  }

  // 第四步：极端长文本抵底，按框宽强制计算字距，绝不超出框线
  size = minSize;
  let s = 0;
  if (chars > 1) {
    const noSpacingW = widthAt(size, 0);
    s = (maxW - noSpacingW) / (chars - 1);
    if (s > manualSpacing) s = manualSpacing;
  }
  return { size: size, spacing: s };
}

function drawTextWithSpacing(ctx, text, x, y, spacing) {
  if (spacing === 0) { ctx.fillText(text, x, y); return; }
  let cx = x;
  for (const ch of text) {
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + spacing;
  }
}

function measureTextWithSpacing(ctx, text, spacing) {
  if (spacing === 0) return ctx.measureText(text).width;
  let w = 0;
  for (let i = 0; i < text.length; i++) {
    w += ctx.measureText(text[i]).width;
    if (i < text.length - 1) w += spacing;
  }
  return w;
}

function renderStampToContext(ctx, stamp, scale) {
  const img = images[stamp.id];
  ctx.clearRect(0, 0, stamp.canvasWidth * scale, stamp.canvasHeight * scale);
  ctx.save();
  ctx.scale(scale, scale);

  // Draw the frame image
  ctx.drawImage(img, 0, 0);

  // Draw text fields
  stamp.textFields.forEach(f => {
    const text = getStored(stamp.id, f.key).trim();
    if (!text) return;

    const customSize = getFontOverride(stamp.id, f.key);
    const fontSize = customSize || f.baseFontSize;
    const manualSpacing = getSpacingOverride(stamp.id, f.key);
    const posOff = getPosOverride(stamp.id, f.key);

    const style = calcTextStyle(ctx, text, f.w, fontSize, manualSpacing, f.h);
    ctx.font = getFontStr(style.size);
    ctx.fillStyle = f.color;
    ctx.textBaseline = 'middle';

    const textW = measureTextWithSpacing(ctx, text, style.spacing);
    const cx = f.x + (f.w - textW) / 2 + posOff.x;
    const cy = f.y + f.h / 2 + posOff.y;
    drawTextWithSpacing(ctx, text, cx, cy, style.spacing);
  });

  ctx.restore();
}

function drawPreview() {
  const stamp = stamps.find(s => s.id === currentStampId);
  const canvas = document.getElementById('previewCanvas');
  canvas.width = Math.round(stamp.canvasWidth * previewScale);
  canvas.height = Math.round(stamp.canvasHeight * previewScale);
  renderStampToContext(canvas.getContext('2d'), stamp, previewScale);
}

function exportPNG() {
  var stamp = stamps.find(function(s) { return s.id === currentStampId; });
  var img = images[currentStampId];
  if (!img.complete) { alert('图片加载中，请稍后再试'); return; }

  var renderCanvas = document.createElement('canvas');
  renderCanvas.width = stamp.canvasWidth;
  renderCanvas.height = stamp.canvasHeight;
  renderStampToContext(renderCanvas.getContext('2d'), stamp, 1.0);

  var dataUrl = renderCanvas.toDataURL('image/png');
  var filename = stamp.name + '_' + new Date().toISOString().slice(0,10) + '.png';

  // 在 pywebview 中通过原生对话框保存；浏览器中则触发下载
  if (typeof window.pywebview !== 'undefined' && window.pywebview.api && window.pywebview.api.save_png) {
    try {
      window.pywebview.api.save_png(dataUrl, filename).then(function(ok) {
        if (!ok) alert('保存已取消');
      }).catch(function(e) {
        alert('保存失败: ' + e);
      });
    } catch(e) {
      // 回退到浏览器下载
      downloadDataUrl(dataUrl, filename);
    }
  } else {
    downloadDataUrl(dataUrl, filename);
  }
}

function downloadDataUrl(dataUrl, filename) {
  var link = document.createElement('a');
  link.download = filename;
  link.href = dataUrl;
  link.click();
}

// Init
let loaded = 0;
stamps.forEach(s => {
  const img = images[s.id];
  function onDone() { if (++loaded >= stamps.length) init(); }
  if (img.complete) setTimeout(onDone, 0);
  else { img.onload = onDone; img.onerror = onDone; }
});
</script>
