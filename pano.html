<style>
:root{
  /* 主题：阿里云服务器·价值全景（绿白） */
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --primary:#16a34a; --primary-dark:#15803d; --accent:#4ade80;
  --blue:#0e6eb8; --green:#16a34a; --red:#d93026; --orange:#b07d2a; --purple:#6d4fc2;
  --bg:#eef5ee; --card:#ffffff; --text:#1f2b1f; --text-strong:#10240f; --text2:#647864; --text3:#7c8f7c;
  --line:#d9e8db; --line2:#e2eee4; --soft:#f2f7f1;
  --shadow:0 14px 40px -22px rgba(20,60,30,.35); --shadow-sm:0 2px 6px rgba(20,60,30,.05);
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font);
  background-color:#eef5ee;
  background-image:linear-gradient(180deg,#f4faf4 0%,#e9f3ea 40%,#dfeee2 100%);
  background-attachment:fixed;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.5;
  overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d9e8db;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#bcd8c1;background-clip:content-box}

/* ---------- 顶栏 ---------- */
.nav{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;
  padding:10px 18px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line2);box-shadow:0 10px 26px -14px rgba(20,60,30,.35);
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand__icon{
  width:32px;height:32px;flex:0 0 32px;border-radius:9px;
  background:linear-gradient(135deg,#16a34a,#4ade80);color:#fff;
  display:grid;place-items:center;font-size:16px;font-weight:700;
  box-shadow:0 4px 10px rgba(22,163,74,.32);
}
.brand__text{display:flex;flex-direction:column;min-width:0}
.brand__title{font-size:16.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap;color:var(--text-strong)}
.brand__sub{font-size:11.5px;color:var(--text3);white-space:nowrap}
.ver{
  display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;
  background:#f0faf3;border:1px solid #cfe6d4;color:var(--primary-dark);font-size:11.5px;font-weight:600;
}
.nav__spacer{flex:1 1 auto}
.nav__tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;
  background:#fff;border:1px solid var(--line);min-width:170px;color:var(--text3);
  transition:border-color .16s ease,box-shadow .16s ease;
}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,163,74,.12)}
.search input{border:none;background:none;outline:none;width:100%;font-size:14px;color:var(--text)}
.search input::placeholder{color:var(--text3)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);
  font-size:14px;font-weight:500;color:var(--text);transition:all .16s ease;
  white-space:nowrap;
}
.btn:hover{border-color:#a9d4b2;color:var(--primary-dark);box-shadow:var(--shadow-sm)}
.btn:active{transform:scale(.98)}
.btn--primary{
  background:linear-gradient(135deg,#16a34a,#4ade80);border-color:transparent;color:#fff;font-weight:600;
  box-shadow:0 4px 12px rgba(22,163,74,.3);
}
.btn--primary:hover{color:#fff;transform:translateY(-1px);box-shadow:0 6px 18px rgba(22,163,74,.4)}
.btn--danger{background:#fdf2f1;border-color:#f3cfcb;color:var(--red)}
.btn--danger:hover{background:#fbe6e4;border-color:#e8b3ae;color:var(--red);box-shadow:none}
.btn--ghost{background:transparent;border-color:var(--line)}
.btn--ghost:hover{background:#f2f7f1}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn--sm{padding:5px 11px;font-size:13px;border-radius:9px}

/* ---------- 主体 ---------- */
.wrap{height:calc(100% - 57px);display:flex;flex-direction:column;overflow:hidden}
.bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:9px 18px;background:#fff;border-bottom:1px solid var(--line);
  font-size:12.5px;color:var(--text2);
}
.bar__dot{width:6px;height:6px;border-radius:50%;background:var(--primary);display:inline-block;margin-right:6px}
.bar__sep{color:var(--line)}
.bar__spacer{flex:1 1 auto}
.bar__cloud{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text2)}
.bar__cloud b{color:var(--primary-dark);font-weight:600}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.selbar[hidden]{display:none}
.scroll{flex:1 1 auto;overflow-y:auto;padding:14px 18px 60px}
.list{display:flex;flex-direction:column;gap:8px;max-width:1180px;margin:0 auto}
.row{
  display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--card);
  border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow-sm);
  transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease;
}
.row:hover{box-shadow:0 8px 22px -12px rgba(22,163,74,.35);transform:translateY(-2px);border-color:#a9d4b2}
.row.is-active{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,163,74,.14)}
.row__check{flex:0 0 auto;display:grid;place-items:center}
.row__check input{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
.thumb{
  flex:0 0 108px;width:108px;height:54px;border-radius:8px;overflow:hidden;background:
    linear-gradient(135deg,#e8f2ea,#d5e7d9);display:grid;place-items:center;cursor:pointer;position:relative;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb__na{font-size:11px;color:#6b8a72;font-weight:600;letter-spacing:.6px}
.thumb__play{
  position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.28);
  color:#fff;font-size:12px;font-weight:600;opacity:0;transition:opacity .18s ease;
}
.thumb:hover .thumb__play{opacity:1}
.row__main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.row__name{
  font-size:15px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:8px;color:var(--text-strong);
}
.row__name span{overflow:hidden;text-overflow:ellipsis}
.badge{
  flex:0 0 auto;padding:1.5px 8px;border-radius:6px;font-size:11px;font-weight:600;
  background:#f2f7f1;border:1px solid #cfe0d2;color:var(--text2);
}
.badge--local{background:#f2f7f1;border-color:#cfe0d2;color:var(--text2)}
.badge--url{background:#eaf4fb;border-color:#c2dcf1;color:var(--blue)}
.badge--cloud{background:#e8f8ec;border-color:#bfe6c9;color:var(--primary-dark)}
.row__meta{font-size:12.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__acts{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.icon-btn{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#f6faf6;
  border:1px solid var(--line);transition:all .16s ease;color:var(--text2);
}
.icon-btn:hover{background:#e8f8ec;border-color:#bfe6c9;color:var(--primary-dark);transform:translateY(-1px)}
.icon-btn--danger:hover{background:#fdf2f1;border-color:#f3cfcb;color:var(--red)}
.icon-btn svg{width:16px;height:16px;display:block}
.empty{
  max-width:1180px;margin:34px auto 0;padding:52px 24px;text-align:center;
  border:2px dashed #cfe0d2;border-radius:14px;background:#fff;color:var(--text2);
  box-shadow:var(--shadow-sm);
}
.empty h2{font-size:19px;font-weight:700;color:var(--text-strong);margin-bottom:8px}
.empty p{font-size:14px;line-height:1.9}
.empty__acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.dropmask{
  position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(22,163,74,.1);
  backdrop-filter:blur(6px);
}
.dropmask.is-open{display:grid}
.dropmask__box{
  padding:36px 56px;border-radius:16px;border:2.5px dashed var(--primary);background:rgba(255,255,255,.96);
  font-size:18px;font-weight:700;color:var(--primary-dark);box-shadow:var(--shadow);
}

/* ---------- 查看器 ---------- */
.viewer{position:fixed;inset:0;z-index:60;background:#0b0d12;display:none}
.viewer.is-open{display:block}
#psv{width:100%;height:100%}
.vbar{
  position:absolute;left:50%;transform:translateX(-50%);top:16px;z-index:200;
  display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;
  width:min(1120px,calc(100% - 28px));
  border-radius:16px;background:rgba(28,28,30,.62);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 34px rgba(0,0,0,.34);
  color:#f5f5f7;transition:opacity .2s ease,transform .2s ease;
}
.viewer.is-hidden-bar .vbar{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(-14px)}
.vbar__meta{min-width:0;display:flex;flex-direction:column;gap:2px;margin-right:auto}
.vbar__name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar__status{font-size:11.5px;color:rgba(235,235,245,.66);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar__status[data-state="error"]{color:#ffb1ab}
.vbar__acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.vbtn{
  padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#f5f5f7;font-size:13.5px;
  display:inline-flex;align-items:center;gap:5px;transition:background .16s ease;
}
.vbtn:hover{background:rgba(255,255,255,.24)}
.vbtn--primary{background:linear-gradient(135deg,#16a34a,#4ade80);color:#fff}
.vbtn--primary:hover{background:linear-gradient(135deg,#15803d,#3ecb6f)}
.vbtn[hidden]{display:none}
/* 访客模式（?img=&share=1）：只看全景，藏起管理按钮 */
body.is-guest #vBack,body.is-guest #vKeep,body.is-guest #vUpload,
body.is-guest #vLink,body.is-guest #vShare{display:none!important}
.vshow{
  position:absolute;top:16px;right:16px;z-index:200;padding:8px 14px;border-radius:999px;
  background:rgba(28,28,30,.66);backdrop-filter:blur(16px);color:#f5f5f7;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.viewer.is-hidden-bar .vshow{opacity:1;pointer-events:auto}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:20px;background:rgba(16,36,15,.34);backdrop-filter:blur(4px)}
.modal.is-open{display:grid}
.sheet{
  width:min(580px,100%);max-height:86vh;overflow:auto;background:#fff;
  border-radius:16px;border:1px solid var(--line);box-shadow:0 24px 70px rgba(20,60,30,.26);padding:22px 22px 18px;
  animation:pop .2s ease;
}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:17.5px;font-weight:700;color:var(--text-strong);margin-bottom:4px}
.sheet__desc{font-size:13px;color:var(--text3);line-height:1.7}
.field{margin-top:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:6px}
.field input,.field textarea{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;outline:none;
  font-size:14.5px;transition:border-color .16s ease,box-shadow .16s ease;
}
.field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,163,74,.14)}
.field textarea{resize:vertical;min-height:76px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.7}
.field__hint{font-size:11.5px;color:var(--text3);margin-top:5px;line-height:1.6}
.sheet__acts{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.sheet__note{margin-top:14px;padding:11px 13px;border-radius:11px;background:var(--soft);border:1px solid var(--line2);font-size:12.5px;color:var(--text2);line-height:1.75}
.share-opt{
  display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:12px;border:1px solid var(--line);
  margin-top:12px;background:#fff;transition:all .16s ease;
}
.share-opt--main{border-color:rgba(22,163,74,.45);background:linear-gradient(135deg,rgba(74,222,128,.08),rgba(255,255,255,0));}
.share-opt:hover{border-color:#a9d4b2;box-shadow:var(--shadow-sm)}
.share-opt__icon{width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:grid;place-items:center;background:#e8f8ec;border:1px solid #bfe6c9;color:var(--primary-dark);font-size:17px}
.share-opt__body{flex:1 1 auto;min-width:0}
.share-opt__title{font-size:14.5px;font-weight:600;color:var(--text-strong)}
.share-opt__text{font-size:12.5px;color:var(--text3);line-height:1.7;margin-top:2px;word-break:break-all}
.share-opt__text code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--primary-dark)}
.linkbox{
  margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--primary-dark);
  word-break:break-all;max-height:110px;overflow:auto;
}
.probe{
  margin-top:10px;padding:11px 13px;border-radius:11px;font-size:13px;line-height:1.7;
  background:var(--soft);color:var(--text2);display:none;
}
.probe.is-open{display:block}
.probe--ok{background:#e8f8ec;border:1px solid #bfe6c9;color:#15803d}
.probe--warn{background:#fdf8ef;border:1px solid #eeddb2;color:#7a6234}
.probe--bad{background:#fdf2f1;border:1px solid #f3cfcb;color:#a8261d}
.probe__head{font-weight:700;margin-bottom:4px}
.probe__detail{font-size:12px;opacity:.86;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.probe__spin{
  width:13px;height:13px;border:2px solid rgba(22,163,74,.28);border-top-color:var(--primary);
  border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:6px;border-radius:3px;background:#e4efe6;overflow:hidden;margin-top:12px;display:none}
.progress.is-on{display:block}
.progress__bar{height:100%;width:0;background:linear-gradient(135deg,#16a34a,#4ade80);transition:width .2s ease}

/* ---------- 上传 / 云同步列表 ---------- */
.uplist{margin-top:12px;max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:11px}
.uprow{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line2)}
.uprow:last-child{border-bottom:none}
.uprow__name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-strong)}
.uprow__st{flex:0 0 auto;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--text2)}
.uprow__st.is-run{background:#eaf4fb;border-color:#c2dcf1;color:var(--blue)}
.uprow__st.is-ok{background:#e8f8ec;border-color:#bfe6c9;color:var(--primary-dark)}
.uprow__st.is-err{background:#fdf2f1;border-color:#f3cfcb;color:var(--red)}
.checkline{display:flex;align-items:flex-start;gap:9px;margin-top:12px;font-size:13px;color:var(--text2);line-height:1.6;cursor:pointer}
.checkline input{margin-top:3px;width:17px;height:17px;accent-color:var(--primary);flex:0 0 auto}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);z-index:120;
  padding:11px 20px;border-radius:999px;background:rgba(16,36,15,.92);color:#f2fbf4;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;max-width:88vw;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(10px);
  border:1px solid rgba(74,222,128,.28);
}
.toast.is-open{opacity:1;transform:translate(-50%,0)}

/* 主题固定为「价值全景」绿白浅色（与参照页一致，不随系统深色翻转） */
@media (max-width:820px){
  .nav{padding:10px 12px;gap:10px}
  .brand__sub{display:none}
  .search{min-width:0;flex:1 1 130px}
  .scroll{padding:12px 12px 70px}
  .row{flex-wrap:wrap;gap:10px;padding:10px}
  .thumb{flex:0 0 92px;width:92px;height:46px}
  .row__acts{width:100%;justify-content:flex-end}
  .vbar{flex-wrap:wrap;padding:8px}
  .vbar__meta{width:100%;margin:0 0 4px}
  .vbar__acts{width:100%;justify-content:flex-start}
}
</style>
</head>
<body>

<header class="nav">
  <div class="brand">
    <div class="brand__icon">360</div>
    <div class="brand__text">
      <div class="brand__title">在线浏览全景照片 <span class="ver" id="verChip">v1.0.7</span></div>
      <div class="brand__sub">上传 · 服务器直链 · 预览 · 重命名 · 分享</div>
    </div>
  </div>
  <div class="nav__spacer"></div>
  <div class="nav__tools">
    <label class="search">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
      <input id="searchInput" type="search" placeholder="搜索名称">
    </label>
    <button class="btn" id="openImgBtn">打开图片</button>
    <button class="btn btn--primary" id="uploadBtn">上传照片</button>
    <button class="btn" id="cloudBtn">上传服务器</button>
    <button class="btn" id="addUrlBtn">添加直链</button>
    <button class="btn" id="syncBtn">同步</button>
  </div>
</header>

<div class="wrap">
  <div class="bar">
    <span><span class="bar__dot"></span><span id="statText">资源库加载中…</span></span>
    <span class="bar__sep">|</span>
    <span id="quotaText">存储占用读取中…</span>
    <span class="bar__spacer"></span>
    <span class="bar__cloud" id="cloudText">☁ 云端未连接</span>
    <div class="selbar" id="selBar" hidden>
      <span id="selText">已选 0 项</span>
      <button class="btn btn--sm btn--primary" id="selUploadBtn">上传服务器</button>
      <button class="btn btn--sm btn--primary" id="selLinkBtn">生成在线链接</button>
      <button class="btn btn--sm" id="selShareBtn">HTML文件</button>
      <button class="btn btn--sm btn--danger" id="selDelBtn">删除</button>
      <button class="btn btn--sm btn--ghost" id="selClearBtn">取消选择</button>
    </div>
  </div>
  <div class="scroll" id="scrollArea">
    <ul class="list" id="listBox"></ul>
    <div class="empty" id="emptyBox"></div>
  </div>
</div>

<div class="viewer" id="viewer">
  <div id="psv"></div>
  <div class="vbar">
    <div class="vbar__meta">
      <div class="vbar__name" id="vName">—</div>
      <div class="vbar__status" id="vStatus" data-state="idle">拖动画面即可环视</div>
    </div>
    <div class="vbar__acts">
      <button class="vbtn" id="vBack">‹ 返回列表</button>
      <button class="vbtn vbtn--primary" id="vKeep" hidden>存入资源库</button>
      <button class="vbtn" id="vUpload" hidden>上传服务器</button>
      <button class="vbtn" id="vLink" hidden>复制直链</button>
      <button class="vbtn" id="vPrev">上一张</button>
      <button class="vbtn" id="vNext">下一张</button>
      <button class="vbtn" id="vShare">分享</button>
      <button class="vbtn" id="vAuto">自动旋转</button>
      <button class="vbtn" id="vHide">隐藏栏</button>
    </div>
  </div>
  <button class="vshow" id="vShow">显示工具栏</button>
</div>

<div class="dropmask" id="dropmask"><div class="dropmask__box">松开鼠标即可上传全景图</div></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<input id="fileInput" type="file" accept="image/*" multiple hidden>
<input id="openInput" type="file" accept="image/*" hidden>
<input id="libInput" type="file" accept=".panojson,application/json" hidden>

(function () {

  var CLOUD_FALLBACK = { api: 'https://srv.wbc2023.top/sync', app: 'pano', token: 'af91def02e8a9a205fe630e970b1b39a' };
  var CFG_KEY = 'pano.cloudcfg';

  function loadCloudCfg() {
    var cfg = { api: CLOUD_FALLBACK.api, app: CLOUD_FALLBACK.app, token: CLOUD_FALLBACK.token, auto: true };
    try {
      var raw = window.localStorage.getItem(CFG_KEY);
      if (raw) {
        var saved = JSON.parse(raw) || {};
        if (saved.api) { cfg.api = String(saved.api).replace(/\/+$/, ''); }
        if (saved.app) { cfg.app = String(saved.app); }
        if (typeof saved.token === 'string') { cfg.token = saved.token; }
        if (typeof saved.auto === 'boolean') { cfg.auto = saved.auto; }
      }
    } catch (e) { /* ignore */ }
    return cfg;
  }

  function saveCloudCfg(cfg) {
    try { window.localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) { /* ignore */ }
  }

  var cloudCfg = loadCloudCfg();

  var els = {

  };

  /* ------------------------------ 工具函数 ------------------------------ */
  function uid() {
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function esc(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmtSize(bytes) {
    if (!bytes && bytes !== 0) { return '—'; }
    if (bytes < 1024) { return bytes + ' B'; }
    if (bytes < 1024 * 1024) { return (bytes / 1024).toFixed(1) + ' KB'; }
    if (bytes < 1024 * 1024 * 1024) { return (bytes / 1024 / 1024).toFixed(2) + ' MB'; }
    return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
  }

  function fmtTime(ts) {
    var d = new Date(ts);
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function safeFileName(name) {
    return String(name || '全景图').replace(/[\\/:*?"<>|\r\n\t]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 60) || '全景图';
  }

  function toast(message, ms) {
    els.toast.textContent = message;
    els.toast.classList.add('is-open');
    window.clearTimeout(toast._t);
    toast._t = window.setTimeout(function () { els.toast.classList.remove('is-open'); }, ms || 2400);
  }

  function setStatus(message, kind) {
    els.vStatus.textContent = message;
    els.vStatus.dataset.state = kind || 'idle';
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      return navigator.clipboard.writeText(text)['catch'](function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* ignore */ }
    document.body.removeChild(ta);
  }

  function download(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function blobToDataURL(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        var s = String(fr.result);
        resolve(s.slice(s.indexOf(',') + 1));
      };
      fr.onerror = function () { reject(fr.error); };
      fr.readAsDataURL(blob);
    });
  }

  function base64ToBlob(b64, mime) {
    var bin = atob(b64);
    var len = bin.length;
    var u8 = new Uint8Array(len);
    for (var i = 0; i < len; i += 1) { u8[i] = bin.charCodeAt(i); }
    return new Blob([u8], { type: mime || 'image/jpeg' });
  }

  function escapeForScript(text) {
    return String(text).replace(/<\//g, '<\\/');
  }

  /* ------------------------------ 数据存储 ------------------------------ */
  var dbPromise = null;

  function openDB() {
    if (dbPromise) { return dbPromise; }
    dbPromise = new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('当前浏览器不支持 IndexedDB')); return; }

      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('数据库打开失败')); };
    });
    return dbPromise;
  }

  function dbRun(mode, fn) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, mode);
        var store = tx.objectStore(STORE);
        var out;
        try { out = fn(store); } catch (e) { reject(e); return; }
        tx.oncomplete = function () { resolve(out && out.result !== undefined ? out.result : out); };

        tx.onabort = function () { reject(tx.error); };
      });
    });
  }

    all: function () {
      return openDB().then(function (db) {
        return new Promise(function (resolve, reject) {

    clear: function () { return dbRun('readwrite', function (s) { return s.clear(); }); }
  };

  function makeThumb(blob) {
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(blob);
      var img = new Image();
      var finish = function (result) {
        URL.revokeObjectURL(url);
        resolve(result);
      };
      img.onload = function () {
        var w = img.naturalWidth || 0;
        var h = img.naturalHeight || 0;
        var tw = 480;
        var th = Math.max(1, Math.round(h * (tw / Math.max(1, w))));
        try {
          var cv = document.createElement('canvas');
          cv.width = tw;
          cv.height = th;
          cv.getContext('2d').drawImage(img, 0, 0, tw, th);
          finish({ thumb: cv.toDataURL('image/jpeg', 0.72), w: w, h: h });
        } catch (e) {
          finish({ thumb: null, w: w, h: h });
        }
      };
      img.onerror = function () { finish({ thumb: null, w: 0, h: 0 }); };
      img.src = url;
    });
  }

  function loadUrlThumb(item) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        var w = img.naturalWidth || item.w || 0;
        var h = img.naturalHeight || item.h || 0;
        try {
          var tw = 480;
          var th = Math.max(1, Math.round(h * (tw / Math.max(1, w))));
          var cv = document.createElement('canvas');
          cv.width = tw; cv.height = th;
          cv.getContext('2d').drawImage(img, 0, 0, tw, th);
          resolve({ thumb: cv.toDataURL('image/jpeg', 0.72), w: w, h: h });
        } catch (e) { resolve({ thumb: null, w: w, h: h }); }
      };
      img.onerror = function () { resolve(null); };
      img.src = item.url;
    });
  }

  /* ------------------------------ 直链体检 ------------------------------ */
  /* 判断一个图片地址能否当公网直链用：
     cors=true  → 允许跨域读取（全景渲染必需）
     imgOk=true → 图片本身能打开（不是分享页、没被防盗链拦）
     注意：本页若是 file:// 打开，Origin 为 null，只有返回 * 的服务器才会判定为允许跨域。 */
  function probeLink(url) {
    var res = { fetchOk: false, status: 0, type: '', size: 0, cors: false, fetchErr: '', imgOk: false, w: 0, h: 0 };

    return fetch(url, { method: 'GET', mode: 'cors', cache: 'no-store' }).then(function (response) {
      res.fetchOk = response.ok;
      res.status = response.status;
      res.type = response.headers.get('content-type') || '';
      res.size = parseInt(response.headers.get('content-length') || '0', 10) || 0;
      res.cors = true;
      if (response.body && response.body.cancel) { response.body.cancel(); }
      return null;
    })['catch'](function (error) {
      res.fetchErr = (error && error.message) ? error.message : '跨域请求被拒绝';
      return null;
    }).then(function () {
      return new Promise(function (resolve) {
        var img = new Image();
        img.onload = function () {
          res.imgOk = true;
          res.w = img.naturalWidth;
          res.h = img.naturalHeight;
          if (!res.size) { res.size = 0; }
          resolve();
        };
        img.onerror = function () { resolve(); };
        img.src = url;
      });
    }).then(function () { return res; });
  }

  function renderProbe(box, url, res) {
    var detail = [];
    if (res.status) { detail.push('HTTP ' + res.status); }
    if (res.type) { detail.push(res.type); }
    if (res.size) { detail.push(fmtSize(res.size)); }
    if (res.w && res.h) { detail.push(res.w + '×' + res.h); }
    if (res.fetchErr) { detail.push(res.fetchErr.slice(0, 90)); }

    var level;
    var head;
    var tip;
    var isHtmlPage = !res.imgOk && /text\/html/i.test(res.type) && (!res.status || res.status < 400);
    if (res.cors && res.imgOk) {
      level = 'ok';
      head = '✅ 可以当直链用';
      tip = '能直接打开、也允许跨域读取，全景渲染没问题。' + (res.w && res.h && Math.abs(res.w / res.h - 2) > 0.2 ? ' 注意：这张不是 2:1 比例，全景可能变形。' : '');
    } else if (res.status >= 400) {
      level = 'bad';
      head = '❌ 地址打不开（HTTP ' + res.status + '）';
      tip = '链接可能已失效、被删除，或者需要登录才能访问。';
    } else if (isHtmlPage) {
      level = 'bad';
      head = '❌ 这是网页，不是图片直链';
      tip = '返回的是 HTML 页面（网盘、蓝奏云这类分享页就是这样）。这类链接别人点开是登录/提取码页面，不能直接当图片地址；' +
        '就算用第三方工具解析出真实直链，通常几小时到几天就失效，还有防盗链拦截。建议把照片放到你自己的服务器、对象存储（OSS/COS）或图床，拿到以 .jpg / .png 结尾的地址。';
    } else if (res.imgOk) {
      level = 'warn';
      head = '⚠️ 能打开，但不能跨域读取';
      tip = '当普通图片直链没问题；但把它嵌到别的域名的全景页里，浏览器会拦截（WebGL 需要 CORS 头）。' +
        '解决办法：给图床/服务器/OSS 开启跨域（Access-Control-Allow-Origin: * 或指定你的域名），或者把照片和查看页放在同一个域名下。';
    } else {
      level = 'bad';
      head = '❌ 不能当直链用';
      tip = '地址打不开：可能是分享页而不是图片地址、链接已失效、需要登录/提取码，或者被防盗链拦截。';
    }
    box.className = 'probe is-open probe--' + level;
    box.innerHTML = '<div class="probe__head">' + head + '</div><div>' + esc(tip) + '</div>' +
      (detail.length ? '<div class="probe__detail">' + esc(detail.join(' · ')) + '</div>' : '');
  }

  function runProbe(url, box) {
    box.className = 'probe is-open';
    box.innerHTML = '<div class="probe__head"><span class="probe__spin"></span>正在体检…</div>' +
      '<div class="probe__detail">' + esc(url) + '</div>';
    probeLink(url).then(function (res) {
      renderProbe(box, url, res);
      box.dataset.result = res.cors && res.imgOk ? 'ok' : (res.imgOk ? 'warn' : 'bad');
    });
  }

  /* ------------------------------ 添加本地照片 ------------------------------ */
  function addLocalFiles(files) {
    var list = Array.prototype.slice.call(files || []).filter(function (f) {
      return f && (f.type.indexOf('image/') === 0 || /\.(jpe?g|png|webp|avif|bmp)$/i.test(f.name));
    });
    if (!list.length) { toast('没有可用的图片文件'); return; }

    var added = 0;
    toast('正在导入 ' + list.length + ' 张照片…', 2000);

    list.reduce(function (chain, file) {
      return chain.then(function () {
        return makeThumb(file).then(function (info) {
          return Store.put({
            id: uid(), name: file.name.replace(/\.[^.]+$/, ''), source: 'local', url: '',
            blob: file, thumb: info.thumb, w: info.w, h: info.h, size: file.size,
            type: file.type || 'image/jpeg', createdAt: Date.now(), updatedAt: Date.now()
          });
        }).then(function () {
          added += 1;
        });
      });
    }, Promise.resolve()).then(function () {
      return refresh();
    }).then(function () {
      updateQuota();
      cloudTouch();
      toast('已导入 ' + added + ' 张全景照片');
    })['catch'](function (error) {
      console.error(error);
      toast('导入失败：' + (error && error.message ? error.message : error), 4200);
    });
  }

  /* ========================= 阿里云服务器：图床上传 + 资源库云同步 =========================
     服务器：srv.wbc2023.top（阿里云 ECS，自建）
       · 图床   /img/<名字>            ← 上传即得公网直链（nginx 已带 CORS 头，WebGL 可直接当纹理）
       · 上传   POST /sync/upload/<app>?token=&name=   原始字节流
       · 列表   GET  /sync/imglist/<app>?token=
       · 删除   POST /sync/imgdel/<app>?token=  {"name":"..."}
       · 同步   GET  /sync/pull|push/<app>?token=      记录级合并（按 id + 版本号取大） */

  function cloudBase() { return String(cloudCfg.api || '').replace(/\/+$/, ''); }

  function cloudHost() {
    var m = cloudBase().match(/^https?:\/\/([^/]+)/i);
    return m ? m[1] : cloudBase();
  }

  function cloudHttp(act, method, body) {
    var url = cloudBase() + '/' + act + '/' + encodeURIComponent(cloudCfg.app) +
      '?token=' + encodeURIComponent(cloudCfg.token);
    var opt = { method: method || 'GET', headers: { 'X-Token': cloudCfg.token } };
    if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    return fetch(url, opt).then(function (r) {
      if (r.status === 401) { throw new Error('令牌无效（请到「同步 → 服务器设置」核对令牌）'); }
      return r.json()['catch'](function () { return {}; }).then(function (j) {
        if (!r.ok || (j && j.e)) { throw new Error((j && j.e) || ('HTTP ' + r.status)); }
        return j;
      });
    });
  }

  function uploadNameFor(item) {
    var type = String(item.type || '');
    var ext = type.indexOf('png') >= 0 ? '.png' : (type.indexOf('webp') >= 0 ? '.webp' : '.jpg');
    var base = String(item.name || 'pano').replace(/[^A-Za-z0-9._-]/g, '').replace(/^[._-]+/, '').slice(0, 26) || 'pano';
    return base + '-' + String(item.id).replace(/[^A-Za-z0-9]/g, '').slice(-6) + ext;
  }

  /* ---------- 低清预览图（分享页「秒开」用）：<原名>.pv.jpg ---------- */
  var PV_EXT = '.pv.jpg';
  var PV_TARGET = 900 * 1024;   /* 低清图目标上限 ~900KB，3M 带宽约 2 秒出画面 */

  function imgBase() {
    return cloudBase().replace(/\/[^/]*\/?$/, '') + '/img/';
  }

  function pvUrlOf(u) {
    u = String(u || '');
    if (!u) { return ''; }
    if (u.indexOf(imgBase()) !== 0) { return ''; }   /* 非本服务器图床的直链不做低清图 */
    return u.replace(/\.[A-Za-z0-9]+$/, '') + PV_EXT;
  }

  function pvNameFor(item) {
    return uploadNameFor(item).replace(/\.[A-Za-z0-9]+$/, '') + PV_EXT;
  }

  function canvasJpeg(cv, q) {
    return new Promise(function (ok) { cv.toBlob(function (b) { ok(b); }, 'image/jpeg', q); });
  }

  /* 从原图（Blob）生成一张低清全景图：等比分档，尽量压到 PV_TARGET 以内 */
  function makePreview(blob) {
    return new Promise(function (resolve) {
      var src = URL.createObjectURL(blob);
      var img = new Image();
      var done = function (r) { URL.revokeObjectURL(src); resolve(r); };
      img.onload = function () {
        var w0 = img.naturalWidth || 0, h0 = img.naturalHeight || 0;
        if (w0 < 1600) { done(null); return; }        /* 原图本来就小，直接看原图 */
        var tries = [[2560, 0.72], [2048, 0.72], [1600, 0.70]];
        var i = 0, best = null;
        var next = function () {
          if (i >= tries.length || (best && best.size <= PV_TARGET)) { done(best); return; }
          var tw = Math.min(tries[i][0], w0);
          var th = Math.max(1, Math.round(h0 * (tw / w0)));
          var cv = document.createElement('canvas');
          cv.width = tw; cv.height = th;
          var ctx = cv.getContext('2d');
          try { ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; } catch (e) { /* ignore */ }
          ctx.drawImage(img, 0, 0, tw, th);
          canvasJpeg(cv, tries[i][1]).then(function (b) {
            if (b && (!best || b.size < best.size)) { best = { blob: b, w: tw, h: th, size: b.size }; }
            i += 1;
            next();
          })['catch'](function () { i += 1; next(); });
        };
        next();
      };
      img.onerror = function () { done(null); };
      img.src = src;
    });
  }

  /* 拿原图字节：本地有副本就用副本，没有就回服务器取（图床已开 CORS） */
  function sourceBlobFor(item) {
    if (item && item.blob) { return Promise.resolve(item.blob); }
    var u = item && item.remoteUrl;
    if (!u) { return Promise.resolve(null); }
    return fetch(u).then(function (r) { return r.ok ? r.blob() : null; })['catch'](function () { return null; });
  }

  function makeAndUploadPreview(item, blob, onProgress) {
    return makePreview(blob).then(function (pv) {
      if (!pv) { return false; }
      return uploadRaw(pvNameFor(item), pv.blob, 'image/jpeg', onProgress).then(function (res) {
        item.pvName = res.name; item.pvSize = res.size; item.pvUrl = res.url;
        if (item.id) { item.updatedAt = item.updatedAt || Date.now(); }
        return true;
      });
    });
  }

  /* 上传本地照片时顺带传一张低清图（失败不影响主流程） */
  function uploadPreviewFor(item, onProgress) {
    if (!item || !item.remoteUrl || !pvUrlOf(item.remoteUrl)) { return Promise.resolve(false); }
    return sourceBlobFor(item).then(function (b) {
      if (!b) { return false; }
      return makeAndUploadPreview(item, b, onProgress);
    })['catch'](function () { return false; });
  }

  /* 已有照片补低清图：先探一次，缺了才上传 */
  function pvExists(u) {
    if (!u) { return Promise.resolve(false); }
    return fetch(u, { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { return !!r.ok; })['catch'](function () { return false; });
  }

  function ensurePreview(item, onProgress) {
    if (!item) { return Promise.resolve(false); }
    if (item.pvUrl) { return Promise.resolve(true); }
    var pvUrl = pvUrlOf(publicUrlOf(item));
    if (!pvUrl) { return Promise.resolve(false); }
    return pvExists(pvUrl).then(function (ok) {
      if (ok) { item.pvUrl = pvUrl; return true; }
      return uploadPreviewFor(item, onProgress);
    });
  }

  function uploadRaw(name, blob, type, onProgress) {
    return new Promise(function (resolve, reject) {
      if (!cloudCfg.token) { reject(new Error('还没配置服务器令牌')); return; }
      if (!blob) { reject(new Error('没有可上传的内容')); return; }
      var url = cloudBase() + '/upload/' + encodeURIComponent(cloudCfg.app) +
        '?token=' + encodeURIComponent(cloudCfg.token) +
        '&name=' + encodeURIComponent(name);
      var xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.timeout = 900000;
      xhr.setRequestHeader('Content-Type', type || 'application/octet-stream');
      xhr.upload.onprogress = function (e) { if (e.lengthComputable && onProgress) { onProgress(e.loaded / e.total); } };
      xhr.onload = function () {
        var j = {};
        try { j = JSON.parse(xhr.responseText || '{}'); } catch (e) { /* ignore */ }
        if (xhr.status === 200 && j && j.url) { resolve(j); }
        else { reject(new Error((j && j.e) || ('HTTP ' + xhr.status))); }
      };
      xhr.onerror = function () { reject(new Error('网络错误：服务器不可达或已被拦截')); };
      xhr.ontimeout = function () { reject(new Error('上传超时')); };
      xhr.send(blob);
    });
  }

  function uploadBlob(item, onProgress) {
    if (!item.blob) { return Promise.reject(new Error('本地副本已不在（可能是别台设备同步来的）')); }
    return uploadRaw(uploadNameFor(item), item.blob, item.type, onProgress);
  }

  function markUploaded(item, res) {
    item.remoteUrl = res.url;
    item.remoteName = res.name;
    item.remoteSize = res.size || item.size;
    item.uploadedAt = Date.now();
    item.updatedAt = Date.now();
    return Store.put(item);
  }

  function deleteRemote(item) {
    if (!item.remoteName) { return Promise.resolve(false); }
    return cloudHttp('imgdel', 'POST', { name: item.remoteName })
      .then(function () { return true; })['catch'](function () { return false; });
  }

  /* ---------- 云端同步：只同步「资源库信息」，照片本体走图床 ---------- */
  function metaOf(it) {
    return {
      name: it.name, source: it.source, url: it.url || '',
      remoteUrl: it.remoteUrl || '', remoteName: it.remoteName || '',
      w: it.w || 0, h: it.h || 0, size: it.size || 0, type: it.type || 'image/jpeg',
      thumb: it.thumb || null, createdAt: it.createdAt || 0, updatedAt: it.updatedAt || it.createdAt || 0
    };
  }

  function recordOf(it, del) {
    return {
      id: it.id,
      v: del ? Date.now() : (it.updatedAt || it.createdAt || Date.now()),
      data: del ? null : metaOf(it),
      del: !!del
    };
  }

  function pushRecords(records) {
    if (!records || !records.length) { return Promise.resolve(0); }
    var batches = [];
    for (var i = 0; i < records.length; i += 12) { batches.push(records.slice(i, i + 12)); }
    return batches.reduce(function (p, b) {
      return p.then(function () { return cloudHttp('push', 'POST', { records: b }); });
    }, Promise.resolve()).then(function () { return records.length; });
  }

  function applyRemote(rec) {
    var data = (rec && rec.data) || {};
    var local = null;
    for (var i = 0; i < state.items.length; i += 1) {
      if (state.items[i].id === rec.id) { local = state.items[i]; break; }
    }
    if (rec.del) { return local ? Store.remove(rec.id) : Promise.resolve(); }
    if (local) {
      if ((rec.v || 0) <= (local.updatedAt || 0)) { return Promise.resolve(); }
      local.name = data.name || local.name;
      if (data.remoteUrl) { local.remoteUrl = data.remoteUrl; local.remoteName = data.remoteName || local.remoteName || ''; }
      if (!local.thumb && data.thumb) { local.thumb = data.thumb; }
      if (!local.w && data.w) { local.w = data.w; }
      if (!local.h && data.h) { local.h = data.h; }
      if (!local.blob && !local.url && (data.remoteUrl || data.url)) { local.url = data.remoteUrl || data.url; }
      if (!local.blob && !local.url && data.source === 'url') { local.source = 'url'; local.url = data.url || ''; }
      local.updatedAt = rec.v || Date.now();
      return Store.put(local);
    }
    // 本机没有：只有「服务器上有图」的记录才落地，避免出现点不开的空条目
    var remote = data.remoteUrl || (data.source === 'url' ? data.url : '');
    if (!remote) { return Promise.resolve(); }
    return Store.put({
      id: rec.id, name: data.name || rec.id, source: 'url', url: remote,
      remoteUrl: data.remoteUrl || '', remoteName: data.remoteName || '',
      blob: null, thumb: data.thumb || null, w: data.w || 0, h: data.h || 0,
      size: data.size || 0, type: data.type || 'image/jpeg',
      createdAt: data.createdAt || Date.now(), updatedAt: rec.v || Date.now()
    });
  }

  function cloudSync(silent) {
    if (!cloudCfg.token || state.syncBusy) { return Promise.resolve(false); }
    state.syncBusy = true;
    if (!silent) { toast('正在与云端同步…', 1600); }
    return cloudHttp('pull').then(function (j) {
      var remote = (j && j.records) || [];
      var rmap = {};
      remote.forEach(function (r) { rmap[r.id] = r; });
      return remote.reduce(function (p, r) {
        return p.then(function () { return applyRemote(r); });
      }, Promise.resolve()).then(function () { return Store.all(); }).then(function (items) {
        state.items = items || [];
        var up = [];
        state.items.forEach(function (it) {
          var r = rmap[it.id];
          if (!r || (it.updatedAt || 0) > (r.v || 0)) { up.push(recordOf(it, false)); }
        });
        return pushRecords(up);
      });
    }).then(function (n) {
      state.syncBusy = false;
      state.lastSyncAt = Date.now();
      return refresh().then(function () {
        renderCloudStatus();
        if (!silent) { toast('云同步完成（上传 ' + (n || 0) + ' 条变更）', 3000); }
        return true;
      });
    })['catch'](function (err) {
      state.syncBusy = false;
      renderCloudStatus();
      if (!silent) { toast('云同步失败：' + (err && err.message ? err.message : err), 4400); }
      return false;
    });
  }

  var syncTimer = null;
  function cloudTouch() {
    if (!cloudCfg.auto || !cloudCfg.token) { return; }
    window.clearTimeout(syncTimer);
    syncTimer = window.setTimeout(function () { cloudSync(true); }, 1500);
  }

  function cloudDelete(item) {
    if (!cloudCfg.token) { return Promise.resolve(); }
    return pushRecords([recordOf(item, true)])['catch'](function () { return 0; });
  }

  /* ---------- 上传弹窗 ---------- */
  function uploadRowHtml(it) {
    var st = it.remoteUrl
      ? '<span class="uprow__st is-ok">已上传</span>'
      : '<span class="uprow__st">待上传</span>';
    return '<div class="uprow" data-id="' + it.id + '">' +
      '<span class="uprow__name" title="' + esc(it.name) + '">' + esc(it.name) + '</span>' +
      '<span class="uprow__st">' + fmtSize(it.size) + '</span>' + st + '</div>';
  }

  function uploadModal(items) {
    var pool = (items || []).filter(function (it) { return it.source === 'local' && it.blob; });
    if (!pool.length) {
      toast(items && items.length ? '这些照片已经在服务器上了（直链照片无需上传）' : '没有可上传的本地照片');
      return;
    }
    var pending = pool.filter(function (it) { return !it.remoteUrl; });
    openModal(
      '<h3>上传到阿里云服务器</h3>' +
      '<p class="sheet__desc">照片存到 <b>' + esc(cloudHost()) + '</b> 的图床，得到形如 <code>https://' + esc(cloudHost()) +
        '/img/xxx.jpg</code> 的公网直链——别人点开就能看 360°，不受限于你的电脑。</p>' +
      '<div class="uplist" id="upList">' + pool.map(uploadRowHtml).join('') + '</div>' +
      '<label class="checkline"><input type="checkbox" id="upRedo"><span>已上传过的也重新上传一遍（覆盖服务器上的同名文件）</span></label>' +
      '<div class="progress" id="upProg"><div class="progress__bar" id="upBar"></div></div>' +
      '<div class="sheet__note" id="upNote">共 ' + pool.length + ' 张：待上传 <b>' + pending.length + '</b> 张' +
        (pool.length - pending.length ? '，已上传 ' + (pool.length - pending.length) + ' 张' : '') +
        '。服务器是 3M 带宽，一张 10MB 的图约需 30 秒，请让它跑完。每张还会附带一张约 0.5MB 的低清预览图（分享页靠它 1~2 秒先出画面）。</div>' +
      '<div class="sheet__acts">' +
        '<button class="btn btn--ghost" id="upCfg">服务器设置</button>' +
        '<button class="btn btn--ghost" data-close>关闭</button>' +
        '<button class="btn btn--primary" id="upGo">开始上传</button>' +
      '</div>',
      function (sheet) {
        sheet.querySelector('#upCfg').addEventListener('click', function () { closeModal(); serverModal(); });
        sheet.querySelector('#upGo').addEventListener('click', function () {
          var redo = sheet.querySelector('#upRedo').checked;
          var targets = redo ? pool.slice() : pending.slice();
          if (!targets.length) { toast('全部都已上传；要覆盖就勾上「重新上传」'); return; }
          this.disabled = true;
          this.textContent = '上传中…';
          runUpload(sheet, targets);
        });
      }
    );
  }

  function runUpload(sheet, targets) {
    var bar = sheet.querySelector('#upBar');
    var prog = sheet.querySelector('#upProg');
    var note = sheet.querySelector('#upNote');
    prog.classList.add('is-on');
    var done = 0, failed = 0, idx = 0;
    var failedNames = [];

    function setRow(item, text, cls) {
      var row = sheet.querySelector('.uprow[data-id="' + item.id + '"] .uprow__st:last-child');
      if (row) { row.textContent = text; row.className = 'uprow__st' + (cls ? ' ' + cls : ''); }
    }

    function step() {
      if (idx >= targets.length) {
        bar.style.width = '100%';
        note.innerHTML = '上传结束：成功 <b>' + done + '</b> 张' +
          (failed ? '，失败 <b>' + failed + '</b> 张（' + esc(failedNames.slice(0, 3).join('、')) + (failed > 3 ? '…' : '') + '，可关掉重开再试）' : '') +
          '。<br>资源库里的这些照片已标上「☁ 公网」，点行尾的「分享」即可生成给别人看的 360° 在线链接。';
        toast('服务器上传完成：成功 ' + done + ' 张' + (failed ? '，失败 ' + failed + ' 张' : ''), 4200);
        var btn = sheet.querySelector('#upGo');
        if (btn) { btn.disabled = false; btn.textContent = '再传一次'; }
        return refresh().then(function () {
          updateQuota();
          return cloudSync(true);
        });
      }
      var item = targets[idx];
      setRow(item, '上传中 0%', 'is-run');
      note.textContent = '正在上传第 ' + (idx + 1) + '/' + targets.length + ' 张：' + item.name +
        '（' + fmtSize(item.size) + '）→ ' + cloudHost();
      uploadBlob(item, function (p) {
        setRow(item, '上传中 ' + Math.round(p * 100) + '%', 'is-run');
        bar.style.width = Math.round(((idx + p * 0.85) / targets.length) * 100) + '%';
      }).then(function (res) {
        return markUploaded(item, res).then(function () {
          done += 1;
          setRow(item, '已上传', 'is-ok');
          /* 顺带传一张低清预览图：分享页靠它秒开，失败不影响主流程 */
          return uploadPreviewFor(item, function (p) {
            setRow(item, '低清图 ' + Math.round(p * 100) + '%', 'is-run');
            bar.style.width = Math.round(((idx + 0.85 + p * 0.15) / targets.length) * 100) + '%';
          }).then(function (ok) {
            setRow(item, ok ? '已上传 + 低清图' : '已上传', 'is-ok');
          });
        });
      })['catch'](function (err) {
        failed += 1;
        failedNames.push(item.name);
        setRow(item, '失败', 'is-err');
        note.textContent = '第 ' + (idx + 1) + ' 张失败：' + (err && err.message ? err.message : err) + '（继续下一张）';
      }).then(function () {
        idx += 1;
        step();
      });
    }
    step();
  }

  /* ---------- 服务器设置 ---------- */
  function serverModal() {
    openModal(
      '<h3>服务器设置</h3>' +
      '<p class="sheet__desc">照片上传到这台服务器的图床；资源库信息（名称 / 尺寸 / 直链）通过它的同步接口在多台设备间互通。</p>' +
      '<div class="field"><label>同步接口地址</label><input id="cfgApi" type="text" value="' + esc(cloudCfg.api) + '">' +
        '<div class="field__hint">默认 https://srv.wbc2023.top/sync（你那台阿里云 ECS）</div></div>' +
      '<div class="field"><label>应用命名空间</label><input id="cfgApp" type="text" maxlength="32" value="' + esc(cloudCfg.app) + '">' +
        '<div class="field__hint">同一服务器上按它隔离数据（bracecad / woodreport / fanglian …）</div></div>' +
      '<div class="field"><label>访问令牌</label><input id="cfgToken" type="text" value="' + esc(cloudCfg.token) + '">' +
        '<div class="field__hint">与服务器 /opt/syncserver/token.txt 一致；只存在本机浏览器，不会写进分享页。</div></div>' +
      '<label class="checkline"><input type="checkbox" id="cfgAuto"' + (cloudCfg.auto ? ' checked' : '') +
        '><span>自动同步：打开时拉取云端、本地有改动后自动上传</span></label>' +
      '<div class="probe" id="cfgBox"></div>' +
      '<div class="sheet__acts">' +
        '<button class="btn btn--ghost" id="cfgTest">测试连接</button>' +
        '<button class="btn btn--ghost" data-close>取消</button>' +
        '<button class="btn btn--primary" id="cfgSave">保存</button>' +
      '</div>',
      function (sheet) {
        sheet.querySelector('#cfgTest').addEventListener('click', function () {
          var box = sheet.querySelector('#cfgBox');
          box.className = 'probe is-open';
          box.innerHTML = '<div class="probe__head"><span class="probe__spin"></span>正在连接 ' + esc(cloudHost()) + ' …</div>';
          var backup = { api: cloudCfg.api, app: cloudCfg.app, token: cloudCfg.token };
          cloudCfg.api = String(sheet.querySelector('#cfgApi').value || '').trim().replace(/\/+$/, '');
          cloudCfg.app = String(sheet.querySelector('#cfgApp').value || '').trim();
          cloudCfg.token = String(sheet.querySelector('#cfgToken').value || '').trim();
          cloudHttp('imglist').then(function (j) {
            box.className = 'probe is-open probe--ok';
            box.innerHTML = '<div class="probe__head">✅ 连接正常</div><div>服务器上已有 ' + (j.count || 0) +
              ' 张本应用图片，共 ' + fmtSize(j.total || 0) + '。</div>';
          })['catch'](function (err) {
            box.className = 'probe is-open probe--bad';
            box.innerHTML = '<div class="probe__head">❌ 连接失败</div><div>' + esc(err && err.message ? err.message : String(err)) + '</div>';
          }).then(function () {
            cloudCfg.api = backup.api; cloudCfg.app = backup.app; cloudCfg.token = backup.token;
          });
        });
        sheet.querySelector('#cfgSave').addEventListener('click', function () {
          var api = String(sheet.querySelector('#cfgApi').value || '').trim().replace(/\/+$/, '');
          var app = String(sheet.querySelector('#cfgApp').value || '').trim();
          if (!/^https?:\/\//i.test(api)) { toast('接口地址要以 http:// 或 https:// 开头'); return; }
          if (!/^[A-Za-z0-9_-]{1,32}$/.test(app)) { toast('命名空间只能用字母、数字、- 和 _'); return; }
          cloudCfg.api = api;
          cloudCfg.app = app;
          cloudCfg.token = String(sheet.querySelector('#cfgToken').value || '').trim();
          cloudCfg.auto = !!sheet.querySelector('#cfgAuto').checked;
          saveCloudCfg(cloudCfg);
          closeModal();
          renderCloudStatus();
          toast('服务器设置已保存');
          if (cloudCfg.auto) { cloudSync(true); }
        });
      }
    );
  }

  /* ------------------------------ 查看器 ------------------------------ */
  function currentSource(item) {
    if (item.blob) { return URL.createObjectURL(item.blob); }
    return item.remoteUrl || item.url;
  }

  function releaseViewerUrl() {
    if (state.viewerUrl) {
      URL.revokeObjectURL(state.viewerUrl);
      state.viewerUrl = null;
    }
  }

  /* 「打开图片」看的是临时项，不打扰列表；有它时查看器以它为准 */
  function activeList() { return state.tempView || state.view; }

  function activeItem() {
    var list = activeList();
    return list[state.viewerIndex] || null;
  }

  function publicUrlOf(item) {
    if (!item) { return ''; }
    return item.remoteUrl || (item.source === 'url' ? item.url : '');
  }

  function ensureViewer(source) {
    if (!state.viewer) {
      state.viewer = new PhotoSphereViewer.Viewer({
        container: els.psv,
        panorama: source,
        navbar: false,
        touchmoveTwoFingers: false,
        mousewheelCtrlKey: false,
        defaultZoomLvl: 55,
        minFov: 28,
        maxFov: 100,
        moveSpeed: 1.1
      });
      return Promise.resolve();
    }
    return state.viewer.setPanorama(source);
  }

  function openViewer(index) {
    var list = activeList();
    var item = list[index];
    if (!item) { return; }
    state.viewerIndex = index;
    els.viewer.classList.add('is-open');
    els.viewer.classList.remove('is-hidden-bar');
    els.vName.textContent = item.name;
    setStatus('正在加载…', 'idle');

    var source = currentSource(item);
    releaseViewerUrl();
    if (item.blob) { state.viewerUrl = source; }

    ensureViewer(source).then(function () {
      setStatus('已加载 · ' + (item.w && item.h ? item.w + '×' + item.h + ' · ' : '') +
        (item.blob ? fmtSize(item.size) : '网络直链') +
        (item.remoteUrl ? ' · ☁ 已上传' : '') +
        ' · 第 ' + (state.viewerIndex + 1) + '/' + list.length + ' 张', 'success');
    })['catch'](function (error) {
      console.warn(error);
      setStatus('加载失败：图片可能无法跨域访问或地址失效', 'error');
    });

    els.vKeep.hidden = !item.temp;
    els.vUpload.hidden = !item.blob;
    els.vLink.hidden = !publicUrlOf(item);
    els.vPrev.hidden = list.length < 2;
    els.vNext.hidden = list.length < 2;
    els.vAuto.textContent = state.autorotate ? '停止旋转' : '自动旋转';
  }

  function closeViewer() {
    els.viewer.classList.remove('is-open');
    state.viewerIndex = -1;
    state.tempView = null;
    releaseViewerUrl();
  }

  function stepViewer(delta) {
    var list = activeList();
    if (list.length < 2) { return; }
    var next = (state.viewerIndex + delta + list.length) % list.length;
    openViewer(next);
  }

  /* ------------------------------ 打开本机图片（即看，不入库） ------------------------------ */
  function openLocalImage(file) {
    if (!file) { return; }
    if (!(String(file.type).indexOf('image/') === 0 || /\.(jpe?g|png|webp|avif|bmp)$/i.test(file.name))) {
      toast('请选择图片文件（JPG / PNG / WebP）');
      return;
    }
    toast('正在打开 ' + file.name + '…', 1600);
    makeThumb(file).then(function (info) {
      state.tempView = [{
        id: 'temp-' + uid(), temp: true, name: String(file.name).replace(/\.[^.]+$/, '') || '本机图片',
        source: 'local', url: '', blob: file, thumb: info.thumb, w: info.w, h: info.h,
        size: file.size, type: file.type || 'image/jpeg', createdAt: Date.now(), updatedAt: Date.now()
      }];
      openViewer(0);
      toast('已打开（临时，未存入资源库）· 想保存就点上面「存入资源库」', 3600);
    });
  }

  function keepTempToLib() {
    var item = activeItem();
    if (!item || !item.temp) { return; }
    var saved = item.blob
      ? {
          id: uid(), name: item.name, source: 'local', url: '', blob: item.blob,
          thumb: item.thumb, w: item.w, h: item.h, size: item.size, type: item.type,
          createdAt: item.createdAt, updatedAt: Date.now()
        }
      : {
          id: uid(), name: item.name, source: 'url', url: item.url || item.remoteUrl || '', blob: null,
          thumb: item.thumb, w: item.w, h: item.h, size: item.size || 0, type: item.type || 'image/jpeg',
          createdAt: item.createdAt, updatedAt: Date.now()
        };
    Store.put(saved).then(function () {
      return refresh();
    }).then(function () {
      closeViewer();
      updateQuota();
      cloudTouch();
      toast('已存入资源库：' + saved.name, 3000);
    })['catch'](function (error) {
      toast('保存失败：' + (error && error.message ? error.message : error), 4200);
    });
  }

  function exportSharePage(items) {
    if (!items.length) { return; }
    var lib = libScripts();
    var payloadEntries = [];
    var pending = [];
    var index = 0;

    var sheet = openModal(
      '<h3>正在生成分享页</h3>' +
      '<p class="sheet__desc">把照片打包成一个可以单独发送或上传的 HTML 文件，对方双击即可查看 360° 全景。</p>' +
      '<div class="progress is-on"><div class="progress__bar" id="pgBar"></div></div>' +
      '<div class="sheet__note" id="pgNote">准备中…</div>' +
      '<div class="sheet__acts"><button class="btn btn--ghost" data-close>后台继续</button></div>',
      function () {}
    );
    var bar = document.getElementById('pgBar');
    var note = document.getElementById('pgNote');

    items.forEach(function (it) {
      if (it.source === 'local' && it.blob && !it.remoteUrl) {
        pending.push(function () {
          return blobToDataURL(it.blob).then(function (b64) {
            payloadEntries.push({ name: it.name, kind: 'inline', b64: b64, type: it.type || 'image/jpeg' });
          });
        });
      } else {
        pending.push(function () {
          payloadEntries.push({ name: it.name, kind: 'url', url: it.remoteUrl || it.url });
          return Promise.resolve();
        });
      }
    });

    pending.reduce(function (chain, task, i) {
      return chain.then(function () {
        note.textContent = '正在处理：' + (payloadEntries[i] ? payloadEntries[i].name : items[i].name);
        bar.style.width = Math.round(((i + 1) / pending.length) * 82) + '%';
        return task();
      });
    }, Promise.resolve()).then(function () {
      note.textContent = '正在打包生成 HTML 文件…';
      bar.style.width = '92%';
      var title = items.length === 1 ? (items[0].name + ' · 360° 全景') : (items.length + ' 张 360° 全景');
      var html = buildShareHtml(payloadEntries, title);
      var sizeMb = (new Blob([html]).size / 1024 / 1024).toFixed(2);
      var filename = items.length === 1
        ? '全景分享_' + safeFileName(items[0].name) + '.html'
        : '全景分享_' + items.length + '张.html';
      download(new Blob([html], { type: 'text/html;charset=utf-8' }), filename);
      bar.style.width = '100%';
      note.innerHTML = '已生成 <b>' + esc(filename) + '</b>（' + sizeMb + ' MB，含查看器与照片，可离线打开）。<br>' +
        '已保存到浏览器默认下载目录，直接发微信/QQ，或上传到任意静态空间即可得到在线直链。';
      toast('分享页已生成：' + filename, 3600);
    })['catch'](function (error) {
      console.error(error);
      toast('生成失败：' + (error && error.message ? error.message : error), 4200);
    });
  }

  /* ---------- 在线分享链接：服务器生成极简全景页，别人点开就是 360° ---------- */
  function mkShareOnline(items, onDone) {
    if (!cloudCfg.token) {
      openModal(
        '<h3>还没配置服务器</h3>' +
        '<p class="sheet__desc">在线分享链接需要先把照片传到你的阿里服务器（' + esc(cloudHost() || 'srv.wbc2023.top') + '），由服务器生成一个极简全景页。</p>' +
        '<div class="sheet__acts"><button class="btn btn--ghost" data-close>取消</button>' +
        '<button class="btn btn--primary" id="goCfg">去配置</button></div>',
        function (sheet) {
          sheet.querySelector('#goCfg').addEventListener('click', function () { closeModal(); serverModal(); });
        });
      return;
    }
    /* 第一步：确保每张照片都有公网直链（本地未上传的先传） */
    var needUp = items.filter(function (it) { return !publicUrlOf(it); });
    var doShare = function () {
      var urls = items.map(function (it) { return publicUrlOf(it); });
      var titles = items.map(function (it) { return it.name; });
      var pvs = urls.map(function (u) { return pvUrlOf(u); });
      var shareName = (items.length === 1 ? items[0].name : (items[0].name + ' 等 ' + items.length + ' 张')) + '-全景照片';
      if (urls.some(function (u) { return !u; })) { toast('有照片缺少公网直链，无法生成', 3600); return; }
      toast('正在检查低清预览图…', 9000);
      /* 低清预览图：缺的现场补一张（分享页靠它 1~2 秒出画面，再把原图换上） */
      var todo = items.filter(function (it) { return pvUrlOf(publicUrlOf(it)) && !it.pvUrl; });
      var ensureAll = todo.reduce(function (p, it) {
        return p.then(function () {
          return ensurePreview(it)['catch'](function () { return false; });
        });
      }, Promise.resolve())['catch'](function () { /* 低清图失败也照常生成分享链接 */ });
      ensureAll.then(function () {
        toast('正在生成分享链接…', 12000);
        return cloudHttp('mkshare', 'POST', {
          title: shareName,
          imgs: urls, titles: titles, pvs: pvs
        });
      }).then(function (res) {
        if (onDone) { onDone(res.url); }
        return res;
      }).then(function (res) {
        /* v1.0.5：复制出来的内容 = 照片名称 + 链接（两行），发给微信直接可读 */
        var shareText = shareName + '\n' + res.url;
        openModal(
          '<h3>✅ 分享链接已生成</h3>' +
          '<p class="sheet__desc">把下面这段发给任何人（微信 / QQ / 短信都行），点开就是全屏 360° 全景，自动旋转环视，手机电脑都能看。</p>' +
          '<div class="linkbox" id="shareUrlBox">' + esc(shareName) + '<br>' + esc(res.url) + '</div>' +
          '<div class="sheet__note">⚡ 对方点开先出低清画面（1~2 秒），随后自动切换成高清原图。<br>链接永久有效（照片存在你的服务器上）。删除服务器照片或删除该分享文件后链接失效。</div>' +
          '<div class="sheet__acts">' +
            '<button class="btn btn--ghost" data-close>关闭</button>' +
            '<button class="btn btn--sm" id="cpShareRaw">只复制链接</button>' +
            '<button class="btn btn--sm" id="openShare">打开看看</button>' +
            '<button class="btn btn--primary" id="cpShare">复制名称+链接</button>' +
          '</div>',
          function (sheet2) {
            sheet2.querySelector('#cpShare').addEventListener('click', function () {
              copyText(shareText).then(function () { toast('已复制：照片名称 + 链接，去粘贴给朋友吧'); });
            });
            sheet2.querySelector('#cpShareRaw').addEventListener('click', function () {
              copyText(res.url).then(function () { toast('纯链接已复制'); });
            });
            sheet2.querySelector('#openShare').addEventListener('click', function () {
              window.open(res.url, '_blank');
            });
          });
      })['catch'](function (error) {
        toast('生成失败：' + (error && error.message ? error.message : error), 4600);
      });
    };
    if (!needUp.length) { doShare(); return; }
    toast('先把 ' + needUp.length + ' 张本地照片传到服务器…', 30000);
    needUp.reduce(function (p, it) {
      return p.then(function () { return uploadBlob(it).then(function (res) { return markUploaded(it, res); }); });
    }, Promise.resolve()).then(function () {
      return refresh();
    }).then(doShare)['catch'](function (error) {
      toast('上传失败：' + (error && error.message ? error.message : error), 4600);
    });
  }

  function shareModal(item) {
    var pub = publicUrlOf(item);
    var isInline = item.source === 'local' && item.blob && !item.remoteUrl;
    var html = '' +
      '<h3>分享「' + esc(item.name) + '」</h3>' +
      '<p class="sheet__desc">推荐用「在线分享链接」——对方点开就是全屏 360° 全景，不用装任何东西。</p>' +

      '<div class="share-opt share-opt--main">' +
        '<div class="share-opt__icon">🌐</div>' +
        '<div class="share-opt__body">' +
          '<div class="share-opt__title">在线分享链接（推荐 · 发人看 360°）</div>' +
          '<div class="share-opt__text">在你的服务器上生成一个极简全景页，得到 <code>' + esc(cloudHost() || 'srv.wbc2023.top') + '/s/xxx.html</code> 短链。' +
            (pub ? '' : '本地照片会先自动上传到服务器。') + '<br>⚡ 已自动附带低清预览图：对方点开先出画面，再自动换成高清原图。</div>' +
          '<div style="margin-top:9px"><button class="btn btn--primary btn--sm" id="mkOnline">生成在线分享链接</button></div>' +

        '<div class="share-opt__body">' +

    openModal(html, function (sheet) {

  /* ------------------------------ 删除（可选连服务器文件一起删） ------------------------------ */
  function delModal(items) {
    var list = items || [];
    if (!list.length) { return; }
    var remotes = list.filter(function (it) { return !!it.remoteName; });
    var one = list.length === 1;
    openModal(
      '<h3>' + (one ? '删除「' + esc(list[0].name) + '」？' : '删除选中的 ' + list.length + ' 张？') + '</h3>' +
      '<p class="sheet__desc">' + (one ? '从本机资源库中移除这张全景图' : '从本机资源库中移除这些全景图') + '，删除后不可恢复。</p>' +
      (remotes.length
        ? '<label class="checkline"><input type="checkbox" id="delRemote" checked><span>同时删除服务器上的 ' + remotes.length +
            ' 个文件（<code>' + esc(cloudHost()) + '/img/</code>，公网直链会一起失效）</span></label>'
        : '<div class="sheet__note">这些照片还没上传到服务器，只删本机这一份。</div>') +
      '<div class="sheet__acts">' +
        '<button class="btn btn--ghost" data-close>取消</button>' +
        '<button class="btn btn--danger" id="delOk">删除</button>' +
      '</div>',
      function (sheet) {
        sheet.querySelector('#delOk').addEventListener('click', function () {
          var box = sheet.querySelector('#delRemote');
          var alsoRemote = !!(remotes.length && box && box.checked);
          closeModal();
          var chain = list.map(function (it) {
            return function () {
              var tasks = [];
              if (alsoRemote && it.remoteName) { tasks.push(deleteRemote(it)); }
              tasks.push(cloudDelete(it));
              tasks.push(Store.remove(it.id));
              return Promise.all(tasks);
            };
          });
          chain.reduce(function (p, t) { return p.then(t); }, Promise.resolve()).then(function () {
            list.forEach(function (it) { delete state.selected[it.id]; });
            return refresh();
          }).then(function () {
            updateQuota();
            toast('已删除 ' + list.length + ' 张' + (alsoRemote ? '，服务器文件一并清理' : ''), 3200);
          })['catch'](function (error) {
            toast('删除失败：' + (error && error.message ? error.message : error), 4200);
          });
        });
      }
    );
  }

  /* ------------------------------ 同步（云端 / 文件） ------------------------------ */
  function syncModal() {
