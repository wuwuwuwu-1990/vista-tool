    openModal(
      '<h3>同步资源库</h3>' +
      '<p class="sheet__desc">两条路：<b>云端同步</b>走你自己服务器的接口，多台电脑自动互通；<b>文件备份</b>导出 .panojson 放共享文件夹。</p>' +

      '<div class="share-opt">' +
        '<div class="share-opt__icon">☁</div>' +
        '<div class="share-opt__body">' +
          '<div class="share-opt__title">云端同步 · ' + esc(cloudHost()) + '</div>' +
          '<div class="share-opt__text">资源库信息（名称 / 尺寸 / 公网直链 / 缩略图）按「谁后改谁生效」与云端合并，删除也会同步；照片本体走图床，不重复传。' +
            '<br>当前：本机 ' + state.items.length + ' 张 · 已上传服务器 ' + cloudN + ' 张 · 上次同步 ' +
            (state.lastSyncAt ? fmtTime(state.lastSyncAt) : '从未') + '</div>' +
          '<label class="checkline"><input type="checkbox" id="ckAuto"' + (cloudCfg.auto ? ' checked' : '') +
            '><span>自动同步：打开时拉取云端，本地改动后自动上传</span></label>' +
          '<div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap">' +
            '<button class="btn btn--primary btn--sm" id="ckNow">立即同步</button>' +
            '<button class="btn btn--sm" id="ckCfg">服务器设置</button>' +
          '</div>' +
          '<div class="probe" id="ckBox"></div>' +
        '</div>' +
      '</div>' +

      '<div class="share-opt">' +
        '<div class="share-opt__icon">⬆</div>' +
        '<div class="share-opt__body">' +
          '<div class="share-opt__title">导出资源库文件（备份）</div>' +
          '<div class="share-opt__text">生成 .panojson（' + state.items.length + ' 张，约 ' +
            fmtSize(state.items.reduce(function (s, i) { return s + (i.size || 0); }, 0)) + '），含本地照片本体。</div>' +
          '<div style="margin-top:9px"><button class="btn btn--sm" id="exBtn">导出</button></div>' +
        '</div>' +
      '</div>' +
      '<div class="share-opt">' +
        '<div class="share-opt__icon">⬇</div>' +
        '<div class="share-opt__body">' +
          '<div class="share-opt__title">导入资源库文件</div>' +
          '<div class="share-opt__text">选择 .panojson，按「名称 + 大小」自动跳过重复项，只补新增的全景图。</div>' +
          '<div style="margin-top:9px"><button class="btn btn--sm" id="imBtn">选择文件导入</button></div>' +
        '</div>' +
      '</div>' +
      '<div class="sheet__note">共享文件夹：\\\\Z4pro-w0op\\团队文件-★★★家庭局域网共享★★★\\AI智能体打包软件\\' + APP_NAME +
        '<br>服务器图床目录：<code>/var/www/img/</code>（访问前缀 <code>https://' + esc(cloudHost()) + '/img/</code>）</div>' +
      '<div class="sheet__acts"><button class="btn btn--ghost" data-close>关闭</button></div>',
      function (sheet) {
        sheet.querySelector('#ckNow').addEventListener('click', function () { cloudSync(false); });
        sheet.querySelector('#ckCfg').addEventListener('click', function () { closeModal(); serverModal(); });
        sheet.querySelector('#ckAuto').addEventListener('change', function () {
          cloudCfg.auto = this.checked;
          saveCloudCfg(cloudCfg);
          renderCloudStatus();
          toast(cloudCfg.auto ? '已开启自动同步' : '已关闭自动同步');
        });
        sheet.querySelector('#exBtn').addEventListener('click', exportLib);
        sheet.querySelector('#imBtn').addEventListener('click', function () {
          closeModal();
          els.libInput.click();
        });
      }
    );
  }

  function exportLib() {
    if (!state.items.length) { toast('资源库是空的'); return; }
    toast('正在打包资源库…', 2000);
    var out = { app: APP_NAME, version: APP_VERSION, exportedAt: Date.now(), items: [] };
    var chain = state.items.map(function (it) {
      return function () {
        if (it.source === 'local' && it.blob) {
          return blobToDataURL(it.blob).then(function (b64) {
            out.items.push({
              name: it.name, source: 'local', size: it.size, type: it.type, w: it.w, h: it.h,
              remoteUrl: it.remoteUrl || '', remoteName: it.remoteName || '',
              thumb: it.thumb, createdAt: it.createdAt, updatedAt: it.updatedAt, b64: b64
            });
          });
        }
        out.items.push({
          name: it.name, source: 'url', url: it.url, remoteUrl: it.remoteUrl || '', remoteName: it.remoteName || '',
          size: it.size, w: it.w, h: it.h,
          thumb: it.thumb, createdAt: it.createdAt, updatedAt: it.updatedAt
        });
        return Promise.resolve();
      };
    });
    chain.reduce(function (p, task) { return p.then(task); }, Promise.resolve()).then(function () {
      var name = '全景资源库_' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '_' + state.items.length + '张.panojson';
      download(new Blob([JSON.stringify(out)], { type: 'application/json' }), name);
      toast('资源库已导出：' + name, 3600);
    })['catch'](function (error) {
      toast('导出失败：' + (error && error.message ? error.message : error), 4200);
    });
  }

  function importLib(file) {
    if (!file) { return; }
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try { data = JSON.parse(String(reader.result)); } catch (e) {
        toast('文件格式不对，请选择导出的 .panojson 文件', 4000);
        return;
      }
      var incoming = (data && data.items) || [];
      var exist = {};
      state.items.forEach(function (it) { exist[it.name + '|' + (it.size || 0)] = true; });
      var added = 0;
      var skipped = 0;
      var chain = incoming.map(function (raw) {
        return function () {
          var key = raw.name + '|' + (raw.size || 0);
          if (exist[key]) { skipped += 1; return Promise.resolve(); }
          exist[key] = true;
          if (raw.source === 'local' && raw.b64) {
            var blob = base64ToBlob(raw.b64, raw.type || 'image/jpeg');
            return Store.put({
              id: uid(), name: raw.name, source: 'local', url: '', blob: blob, thumb: raw.thumb || null,
              remoteUrl: raw.remoteUrl || '', remoteName: raw.remoteName || '',
              w: raw.w || 0, h: raw.h || 0, size: raw.size || blob.size, type: raw.type || 'image/jpeg',
              createdAt: raw.createdAt || Date.now(), updatedAt: Date.now()
            }).then(function () { added += 1; });
          }
          return Store.put({
            id: uid(), name: raw.name, source: 'url', url: raw.url || raw.remoteUrl || '', blob: null,
            thumb: raw.thumb || null, remoteUrl: raw.remoteUrl || '', remoteName: raw.remoteName || '',
            w: raw.w || 0, h: raw.h || 0, size: raw.size || 0, type: 'image/jpeg',
            createdAt: raw.createdAt || Date.now(), updatedAt: Date.now()
          }).then(function () { added += 1; });
        };
      });
      chain.reduce(function (p, task) { return p.then(task); }, Promise.resolve()).then(function () {
        return refresh();
      }).then(function () {
        updateQuota();
        cloudTouch();
        toast('导入完成：新增 ' + added + ' 张，跳过重复 ' + skipped + ' 张', 4000);
      })['catch'](function (error) {
        toast('导入失败：' + (error && error.message ? error.message : error), 4200);
      });
    };
    reader.readAsText(file);
  }

  /* ------------------------------ 事件绑定 ------------------------------ */
  function pickedItems() {
    return state.items.filter(function (it) { return state.selected[it.id]; });
  }

  els.uploadBtn.addEventListener('click', function () { els.fileInput.click(); });
  els.openImgBtn.addEventListener('click', function () { els.openInput.click(); });
  els.cloudBtn.addEventListener('click', function () {
    var picked = pickedItems();
    uploadModal(picked.length ? picked : state.items);
  });
  els.addUrlBtn.addEventListener('click', addUrlModal);
  els.syncBtn.addEventListener('click', syncModal);

  /* 空状态按钮用事件委托：容器不会随 render 重建，按钮永远有效 */
  els.emptyBox.addEventListener('click', function (event) {
    var btn = event.target.closest('[data-empty]');
    if (!btn) { return; }
    var act = btn.dataset.empty;
    if (act === 'upload') { els.fileInput.click(); }
    else if (act === 'open') { els.openInput.click(); }
    else if (act === 'url') { addUrlModal(); }
    else if (act === 'clear') {
      els.searchInput.value = '';
      state.keyword = '';
      render();
    }
  });

  els.fileInput.addEventListener('change', function () {
    addLocalFiles(els.fileInput.files);
    els.fileInput.value = '';
  });

  els.openInput.addEventListener('change', function () {
    openLocalImage(els.openInput.files && els.openInput.files[0]);
    els.openInput.value = '';
  });

  els.libInput.addEventListener('change', function () {
    importLib(els.libInput.files && els.libInput.files[0]);
    els.libInput.value = '';
  });

  els.searchInput.addEventListener('input', function () {
    state.keyword = els.searchInput.value;
    render();
  });

  els.listBox.addEventListener('click', function (event) {
    var row = event.target.closest('.row');
    if (!row) { return; }
    var index = parseInt(row.dataset.index, 10);
    var item = state.view[index];
    if (!item) { return; }
    var actBtn = event.target.closest('[data-act]');
    var act = actBtn ? actBtn.dataset.act : null;
    if (event.target.matches('input[type=checkbox]')) { return; }
    if (!act) { act = 'view'; }

    if (act === 'view') { openViewer(index); return; }
    if (act === 'rename') { renameModal(item); return; }
    if (act === 'share') { shareModal(item); return; }
    if (act === 'upload') { uploadModal([item]); return; }
    if (act === 'del') { delModal([item]); }
  });

  els.listBox.addEventListener('change', function (event) {
    var box = event.target.closest('input[data-check]');
    if (!box) { return; }
    var id = box.dataset.check;
    if (box.checked) { state.selected[id] = true; } else { delete state.selected[id]; }
    els.selBar.hidden = Object.keys(state.selected).length === 0;
    els.selText.textContent = '已选 ' + Object.keys(state.selected).length + ' 项';
  });

  els.selClearBtn.addEventListener('click', function () {
    state.selected = {};
    render();
  });

  els.selUploadBtn.addEventListener('click', function () {
    var picked = pickedItems();
    if (!picked.length) { return; }
    uploadModal(picked);
  });

  els.selLinkBtn.addEventListener('click', function () {
    var picked = pickedItems();
    if (!picked.length) { return; }
    mkShareOnline(picked);
  });

  els.selShareBtn.addEventListener('click', function () {
    var picked = pickedItems();
    if (!picked.length) { return; }
    exportSharePage(picked);
  });

  els.selDelBtn.addEventListener('click', function () {
    var picked = pickedItems();
    if (!picked.length) { return; }
    delModal(picked);
  });

  els.vBack.addEventListener('click', closeViewer);
  els.vKeep.addEventListener('click', keepTempToLib);
  els.vUpload.addEventListener('click', function () {
    var item = activeItem();
    if (item) { uploadModal([item]); }
  });
  els.vLink.addEventListener('click', function () {
    var item = activeItem();
    var pub = publicUrlOf(item);
    if (!pub) { toast('这张还没有公网直链'); return; }
    copyText(pub).then(function () { toast('公网图片直链已复制'); });
  });
  els.vPrev.addEventListener('click', function () { stepViewer(-1); });
  els.vNext.addEventListener('click', function () { stepViewer(1); });
  els.vShare.addEventListener('click', function () {
    var item = activeItem();
    if (item) { shareModal(item); }
  });
  els.vHide.addEventListener('click', function () { els.viewer.classList.add('is-hidden-bar'); });
  els.vShow.addEventListener('click', function () { els.viewer.classList.remove('is-hidden-bar'); });
  els.vAuto.addEventListener('click', function () {
    if (!state.viewer || typeof state.viewer.toggleAutorotate !== 'function') { return; }
    state.viewer.toggleAutorotate();
    state.autorotate = !state.autorotate;
    els.vAuto.textContent = state.autorotate ? '停止旋转' : '自动旋转';
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      if (els.modal.classList.contains('is-open')) { closeModal(); return; }
      if (els.viewer.classList.contains('is-open')) { closeViewer(); }
      return;
    }
    if (!els.viewer.classList.contains('is-open') || els.modal.classList.contains('is-open')) { return; }
    if (event.key === 'ArrowRight') { stepViewer(1); }
    if (event.key === 'ArrowLeft') { stepViewer(-1); }
  });

  /* 拖拽上传 */
  var dragDepth = 0;
  var hasFiles = function (event) {
    return event.dataTransfer && event.dataTransfer.types &&
      Array.prototype.indexOf.call(event.dataTransfer.types, 'Files') !== -1;
  };
  window.addEventListener('dragenter', function (event) {
    if (!hasFiles(event)) { return; }
    event.preventDefault();
    dragDepth += 1;
    els.dropmask.classList.add('is-open');
  });
  window.addEventListener('dragover', function (event) {
    if (!hasFiles(event)) { return; }
    event.preventDefault();
  });
  window.addEventListener('dragleave', function (event) {
    if (!hasFiles(event)) { return; }
    event.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) { els.dropmask.classList.remove('is-open'); }
  });
  window.addEventListener('drop', function (event) {
    if (!hasFiles(event)) { return; }
    event.preventDefault();
    dragDepth = 0;
    els.dropmask.classList.remove('is-open');
    addLocalFiles(event.dataTransfer.files);
  });

  /* 从 ?img= 进入时直接看全景（配合分享直链）——用临时视图，不打扰资源库 */
  function bootFromQuery() {
    var params = new URLSearchParams(location.search);
    var img = params.get('img');
    if (!img) { return false; }
    var title = params.get('title') || decodeURIComponent(img.split('?')[0].split('/').pop() || '全景图');
    /* share=1：访客模式——只看全景，不露管理功能 */
    if (params.get('share') === '1') {
      document.body.classList.add('is-guest');
      document.title = title + ' · 全景照片';
    }
    state.tempView = [{
      id: 'query', temp: true, name: title, source: 'url', url: img, remoteUrl: '', blob: null, thumb: null,
      w: 0, h: 0, size: 0, type: 'image/jpeg', createdAt: Date.now(), updatedAt: Date.now()
    }];
    openViewer(0);
    return true;
  }

  /* ------------------------------ 启动 ------------------------------ */
  els.verChip.textContent = 'v' + APP_VERSION;
  renderCloudStatus();
  refresh().then(function () {
    updateQuota();
    if (!bootFromQuery() && cloudCfg.auto && cloudCfg.token) { cloudSync(true); }
  });
  window.addEventListener('beforeunload', function () {
    if (state.viewer && state.viewer.destroy) { state.viewer.destroy(); }
    releaseViewerUrl();
  });
})();
</script>
